   ntField('Solicitante','ntmPerson',v.solicitante)+ntField('Pedido / referência','ntmOrder',v.pedido)+ntField('Observação','ntmNotes',v.observacao)+
   '<div class="buttons"><button class="btn" data-action="nt-meta-save">Salvar correção</button><button class="btn ghost" data-action="nt-meta-history">Voltar</button></div>');
 }finally{loader(false)}
}
async function ntMetaSave(){
 const draft=ntMetaDraft;if(!draft)throw Error('Abra um lançamento no histórico.');
 isReady();
 const next={solicitante:String($('ntmPerson')?.value||'').trim(),pedido:String($('ntmOrder')?.value||'').trim(),observacao:String($('ntmNotes')?.value||'').trim()};
 if(!next.solicitante||next.solicitante.length>160||next.pedido.length>120||next.observacao.length>400)
  throw Error('Informe solicitante e respeite os limites dos campos (160, 120 e 400 caracteres).');
 if(JSON.stringify(next)===JSON.stringify(draft.old)){notice('Nenhuma alteração realizada.');return}
 if(!confirm('Salvar a retificação auditada? Os saldos e quantidades continuarão inalterados.'))return;
 loader(true);
 try{
  const snap=await getDocFromServer(doc(db,'nt_web_movimentos',draft.id));
  if(!snap.exists())throw Error('Registro original não localizado.');
  const m={...snap.data(),id:snap.id};
  if(m.anulado||m.reciboId||m.origem==='RECEBIMENTO_INTEGRADO')throw Error('Lançamento protegido.');
  const effective=ntMetaMoves([m],await ntMetaRead())[0];if(effective.anulado)throw Error('Movimentação estornada: edição bloqueada.');
  const current=ntMetaFields(effective);
  if(JSON.stringify(current)!==JSON.stringify(draft.old))throw Error('Alteração em outra sessão. Reabra o histórico.');
  if(testeIdentificado(m)!==testeIdentificado({...m,...next}))throw Error('Não é permitido reclassificar um teste nesta edição.');
  await setDoc(doc(collection(db,'nt_web_auditoria')),{acao:NT_META_ACTION,documentoId:draft.id,documentoTipo:'movimento',
   antes:current,depois:next,usuario:user.email||'',uid:user.uid,criadoEmLocal:new Date().toISOString(),criadoEm:serverTimestamp()});
  ntMetaDraft=null;notice('Correção registrada para os relatórios. Nenhum saldo foi alterado.');
  await ntShowTodayMovements(ntMetaDate||day());
 }finally{loader(false)}
}


/* Excluir movimento operacional = estorno ATÔMICO no estoque atual + trilha imutável.
   Nunca apaga documentos originais e não altera retroativamente outros saldos históricos. */
let ntCancelDraft=null;
function ntCancelEligible(m,id){
 const code=String(m.codigo||''),qty=Number(m.quantidade),delta=Number(m.delta);
 if(!['SAIDA','ENTRADA','DEVOLUCAO'].includes(String(m.tipo))||m.anulado||m.reciboId||
    m.origem==='RECEBIMENTO_INTEGRADO'||String(m.origem||'').startsWith('ESTORNO')||
    String(id||'').startsWith('ESTORNO_')||String(id||'').startsWith('RETIFICACAO_'))
  throw Error('Este movimento é protegido. Para entradas de fornecedor, corrija o registro no Histórico de Recebimentos.');
 if(!/^\d{9}$/.test(code)||!Number.isFinite(qty)||qty<=0||
    !Number.isFinite(delta)||Math.abs(Math.abs(delta)-qty)>0.0001||
    (m.tipo==='SAIDA'&&delta>=0)||(m.tipo!=='SAIDA'&&delta<=0))
  throw Error('Dados históricos do lançamento não estão íntegros para estorno automático. Não houve alteração.');
 if(Number.isFinite(Number(m.antes))&&Number.isFinite(Number(m.depois))&&
    Math.abs(rnd(Number(m.antes)+delta-Number(m.depois)))>0.0001)
  throw Error('Lançamento histórico com saldo inicial/final inconsistente. Estorno bloqueado.');
 return {code,qty,delta};
}
async function ntCancelMoveOpen(id){
 isReady();
 const moveId=String(id||'').trim();
 if(!moveId||moveId.length>220)throw Error('Identificador do lançamento inválido.');
 loader(true);
 try{
  const [snap,audit]=await Promise.all([
   getDocFromServer(doc(db,'nt_web_movimentos',moveId)),

  ]);
  if(!snap.exists())throw Error('Movimentação não encontrada.');
  if(audit.exists())throw Error('Este item já foi excluído e estornado. Atualize o histórico.');
  const m={...snap.data(),id:snap.id},info=ntCancelEligible(m,moveId);
  ntCancelDraft={id:moveId,codigo:info.code,dia:String(m.dia||'')};
  const change=-info.delta;
  panel('<h2>Excluir item do histórico operacional</h2>'+
   '<p class="small" style="margin:7px 0 14px">A exclusão não apaga o registro original. Um estorno de estoque será criado na data de hoje e a retirada ou entrada deixará de contar nos novos relatórios do dia original.</p>'+
   '<div class="card" style="margin:8px 0 14px">'+
   '<strong>'+esc(m.nome||info.code)+'</strong>'+
   '<p class="small">'+esc(info.code)+' · '+esc(m.tipo)+' · '+esc(ntDate(m.dia||day()))+'</p>'+
   '<p style="margin-top:8px">Quantidade original: <b>'+esc(fmt(info.qty))+'</b></p>'+
   '<p style="margin-top:5px">Correção no saldo atual: <b class="'+(change>=0?'green':'red')+'">'+(change>=0?'+':'')+esc(fmt(change))+'</b></p></div>'+
   '<div class="field"><label for="ntCancelReason">Motivo da exclusão (obrigatório)</label>'+
   '<textarea id="ntCancelReason" rows="3" maxlength="300" placeholder="Ex.: material lançado no pedido por engano"></textarea></div>'+
   '<p class="small" style="margin:8px 0 12px">Se o saldo não permitir o estorno, a operação será bloqueada. Para uma entrega com nota fiscal vinculada, utilize o Histórico de Recebimentos.</p>'+
   '<div class="buttons"><button class="btn danger" data-action="nt-cancel-confirm">Confirmar exclusão e estorno</button>'+
   '<button class="btn ghost" data-action="nt-meta-history">Cancelar</button></div>');
 }finally{loader(false)}
}
async function ntCancelMoveCommit(){
 const draft=ntCancelDraft;
 if(!draft)throw Error('Selecione um item no histórico antes de excluir.');
 const reason=String($('ntCancelReason')?.value||'').trim();
 if(reason.length<8||reason.length>300)throw Error('Informe um motivo com 8 a 300 caracteres para a auditoria.');
 isReady();
 const id=draft.id,originalRef=doc(db,'nt_web_movimentos',id),
  auditRef=doc(db,'nt_web_auditoria','ESTORNO_'+id),
  reversalRef=doc(db,'nt_web_movimentos','ESTORNO_'+id),
  stockRef=itemRef(draft.codigo),stamp=new Date().toISOString();
 loader(true);
 let confirmed=false;
 try{
  const result=await runTransaction(db,async tx=>{
   // Todas as leituras ocorrem antes de qualquer gravação.
   const [originalSnap,stockSnap,auditSnap,reversalSnap]=await Promise.all([
    tx.get(originalRef),tx.get(stockRef),tx.get(auditRef),tx.get(reversalRef)
   ]);
   if(auditSnap.exists()||reversalSnap.exists())throw Error('Já existe um estorno para este lançamento. Nenhuma operação duplicada.');
   if(!originalSnap.exists()||!stockSnap.exists())throw Error('Movimento ou material não encontrado no servidor.');
   const m=originalSnap.data(),stock=stockSnap.data(),info=ntCancelEligible(m,id);
   if(info.code!==draft.codigo||String(m.dia||'')!==draft.dia||
      String(stock.codigo||'')!==info.code)throw Error('Dados alterados desde a seleção. Reabra o histórico.');
   const before=Number(stock.quantidade),delta=rnd(-info.delta),after=rnd(before+delta);
   if(!Number.isFinite(before)||before<0||!Number.isFinite(after)||after<0)
    throw Error('Saldo insuficiente ou inválido para estornar. Nenhuma quantidade foi alterada.');
   const effectiveFields=ntMetaFields(m);
   const entry={id:reversalRef.id,codigo:info.code,nome:String(stock.nome||m.nome||info.code),
    unidade:String(stock.unidade||m.unidade||''),tipo:'AJUSTE',
    quantidade:Math.abs(delta),delta,antes:before,depois:after,
    solicitante:user.email||'Almoxarifado',pedido:'ESTORNO OPERACIONAL',
    observacao:'Estorno do lançamento '+id+'. Motivo: '+reason,
    origem:'ESTORNO_MOVIMENTO',movimentoOriginalId:id,
    operador:user.email||'',uid:user.uid,dia:day(),timeClient:stamp,criadoEm:serverTimestamp()};
   const log={acao:NT_META_ACTION,documentoTipo:'movimento',documentoId:id,
    antes:{...effectiveFields,excluido:false},depois:{...effectiveFields,excluido:true},
    tipoRetificacao:'EXCLUSAO_COM_ESTORNO',motivo:reason,movimentoEstornoId:reversalRef.id,
    codigo:info.code,quantidadeOriginal:info.qty,deltaEstorno:delta,
    diaOriginal:String(m.dia||''),diaEstorno:day(),usuario:user.email||'',uid:user.uid,
    criadoEmLocal:stamp,criadoEm:serverTimestamp()};
   tx.update(stockRef,{quantidade:after,ultimoMovimentoId:reversalRef.id,atualizadoEm:serverTimestamp()});
   tx.set(reversalRef,entry);
   tx.set(auditRef,log);
   return {code:info.code,delta,after};
  });
  confirmed=true;
  ntCancelDraft=null;
  await consultarSaldosServidor([result.code],{[result.code]:{quantidade:result.after}});
  notice('Item excluído do relatório e estorno de '+fmt(result.delta)+' registrado com auditoria.');
  await ntShowTodayMovements(ntMetaDate||draft.dia||day());
 }catch(err){
  notice((confirmed?'Estorno gravado, mas a tela não confirmou os novos dados. ':
   'Não foi possível confirmar o estorno. ')+
   'NÃO repita sem consultar o histórico. '+String(err.message||err),true);
 }finally{loader(false)}
}

  }

function ntReceiptAdd(){
 ntReceiptCapture();
 if(ntReceiptCommitRef)throw Error('Existe uma tentativa de recebimento a conferir. Abra o histórico antes de modificar a entrega para evitar lançamento duplicado.');
 const expectedText=String($('nrExpected')?.value||'').trim(),receivedText=String($('nrReceived')?.value||'').trim();
 const expected=rnd(nval(expectedText)),received=rnd(nval(receivedText));
 if(!expectedText||!receivedText||!Number.isFinite(expected)||!Number.isFinite(received)||
    expected<=0||received<0||expected>99999999||received>99999999)
   throw Error('Informe quantidades válidas: NF maior que zero e recebida igual ou maior que zero.');
 if(!/^\d{1,8}([,.]\d{1,4})?$/.test(expectedText)||!/^\d{1,8}([,.]\d{1,4})?$/.test(receivedText))
   throw Error('Informe até quatro casas decimais e use vírgula ou ponto.');
 if(ntReceiptItems.length>=50)throw Error('Máximo de 50 materiais por recebimento.');
 if(ntReceiptManualMode){
  const name=String($('nrUnknownName')?.value||'').trim(),unit=String($('nrUnknownUnit')?.value||'').trim().toUpperCase();
  if(name.length<3||name.length>140)throw Error('Informe o nome do produto sem código com pelo menos três caracteres.');
  if(!/^[A-Z0-9²./ -]{1,12}$/.test(unit))throw Error('Informe uma unidade de medida válida, como UN, KG, M ou L.');
  if(mats.some(x=>normMaterial(x.nome)===normMaterial(name)))throw Error('Já existe material com esse nome no cadastro. Use a opção Cadastrado.');
  if(ntReceiptItems.some(x=>x.semCadastro&&normMaterial(x.nome)===normMaterial(name)))
   throw Error('Produto sem código já incluído nesta nota.');
  ntReceiptItems.push({codigo:'',nome:name,unidadeMedida:unit,
    quantidadeNota:expected,quantidadeRecebida:received,semCadastro:true});
 }else{
  const code=String($('nrItem')?.value||'').trim(),m=material(code);
  if(!m)throw Error('Selecione um material cadastrado ou toque em Sem código.');
  if(!/^\d{9}$/.test(code))throw Error('O código cadastrado do material é inválido; corrija o cadastro antes da entrada.');
  if(ntReceiptItems.some(x=>!x.semCadastro&&x.codigo===code))throw Error('Material já incluído nesta nota. Remova-o para corrigir a quantidade.');
  ntReceiptItems.push({codigo:code,nome:String(m.nome),unidadeMedida:String(m.unidadeMedida||'—'),
    quantidadeNota:expected,quantidadeRecebida:received,semCadastro:false});
 }
 ntReceiptForm();
}
function ntReceiptValidate(d,items){
 if(!d.fornecedor||d.fornecedor.length>160||!d.pedidoCompra||d.pedidoCompra.length>90||
    !d.notaFiscal||d.notaFiscal.length>90||!items.length)
   throw Error('Preencha fornecedor, pedido de compra, número da NF e pelo menos um material.');
 if(d.dataRecebimento!==day())throw Error('A data do recebimento precisa ser hoje para que o saldo e o relatório coincidam. Reabra a Entrada antes de lançar.');
 if(d.observacao.length>500)throw Error('Observação deve conter no máximo 500 caracteres.');
 const codes=new Set();
 for(const item of items){
  if(!(Number(item.quantidadeNota)>0)||!(Number(item.quantidadeRecebida)>=0)||
     !Number.isFinite(Number(item.quantidadeRecebida)))throw Error('Há quantidades inválidas no recebimento.');
  if(item.semCadastro){
   if(item.codigo||!String(item.nome||'').trim()||!String(item.unidadeMedida||'').trim())
     throw Error('Produto sem código precisa ter nome e unidade de medida.');
  }else{
   if(!/^\d{9}$/.test(String(item.codigo)))throw Error('Código inválido em um material.');
   if(codes.has(String(item.codigo)))throw Error('Material repetido no recebimento: '+item.codigo);
   codes.add(String(item.codigo));
  }
 }
 if(items.length>50)throw Error('Máximo de 50 materiais por recebimento.');
}
function ntReceiptKey(d){
 const norm=x=>String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/s+/g,' ').trim().toLowerCase();
 const key=['nt_entrada_v2',d.dataRecebimento,norm(d.fornecedor),norm(d.pedidoCompra),norm(d.notaFiscal)].join('|');
 let h1=2166136261,h2=2166136261^0x9e3779b9;
 for(let i=0;i<key.length;i++){
  const c=key.charCodeAt(i);
  h1=Math.imul(h1^c,16777619);
  h2=Math.imul(h2^c,2246822519);
 }
 return 'ENTRADA_'+d.dataRecebimento.replace(/-/g,'')+'_'+(h1>>>0).toString(16).padStart(8,'0')+(h2>>>0).toString(16).padStart(8,'0');
}
async function ntReceiptSave(){
 if(tab!=='movimentar'||kind!=='ENTRADA')throw Error('Use Movimentar → Entrada para registrar recebimento.');
 ntReceiptCapture();isReady();
 const d={...ntReceiptDraft},items=ntReceiptItems.map(x=>({...x}));
 ntReceiptValidate(d,items);
 const registered=items.filter(x=>!x.semCadastro&&x.quantidadeRecebida>0);
 const pending=items.filter(x=>x.semCadastro);
 const message='Confirmar recebimento da NF '+d.notaFiscal+' (PC '+d.pedidoCompra+')?'+
  '\n'+registered.length+' material(is) cadastrado(s) com entrada no estoque.'+
  '\n'+pending.length+' produto(s) sem código serão apenas documentados, pendentes de cadastro.'+
  '\nOs saldos de itens não cadastrados NÃO serão alterados. Continuar?';
 if(!confirm(message))return;
 const signature=JSON.stringify({d,items});
 if(ntReceiptCommitRef&&ntReceiptCommitSignature!==signature)throw Error('Os dados da nota foram alterados após uma tentativa. Consulte o histórico antes de repetir.');
 if(!ntReceiptCommitRef){ntReceiptCommitRef=doc(db,'nt_web_auditoria',ntReceiptKey(d));ntReceiptCommitSignature=signature;}
 const receiptRef=ntReceiptCommitRef;
 const moveLinks=new Map(registered.map(x=>[String(x.codigo),moveRef()]));
 const stamp=new Date().toISOString(),today=day();
 loader(true);
 try{
  const result=await runTransaction(db,async tx=>{
   const existing=await tx.get(receiptRef);
   if(existing.exists())return 'EXISTENTE';
   const stockSnaps=[];
   for(const item of registered)stockSnaps.push(await tx.get(itemRef(item.codigo)));
   const stockDetails=new Map();
   for(let i=0;i<registered.length;i++){
    const item=registered[i],snap=stockSnaps[i];
    if(!snap.exists())throw Error('Material não existe mais no Firebase: '+item.codigo);
    const real=snap.data();
    if(String(real.codigo||'')!==String(item.codigo))
     throw Error('Código divergente no servidor. Operação cancelada: '+item.codigo);
    const prev=Number(real.quantidade),q=Number(item.quantidadeRecebida);
    if(!Number.isFinite(prev)||prev<0)throw Error('Saldo atual inválido para '+item.codigo);
    const next=rnd(prev+q);
    if(!Number.isFinite(next)||next<prev)throw Error('Quantidade inválida para '+item.codigo);
    stockDetails.set(String(item.codigo),{real,prev,next});
   }
   const docs=items.map(item=>{
    if(item.semCadastro)return {...item,statusEntrada:'PENDENTE_CADASTRO',movimentacaoId:''};
    if(!item.quantidadeRecebida)return {...item,statusEntrada:'NAO_ENTROU',movimentacaoId:''};
    return {...item,statusEntrada:'ESTOQUE_ATUALIZADO',movimentacaoId:moveLinks.get(item.codigo).id};
   });
   const auditData={acao:NT_RECEIPT_ACTION,formato:'NEW_TERMISA_RECEBIMENTO_INTEGRADO_V2',
    modo:'ENTRADA_INTEGRADA',numero:receiptRef.id,fornecedor:d.fornecedor,pedidoCompra:d.pedidoCompra,
    notaFiscal:d.notaFiscal,dataRecebimento:today,observacao:d.observacao,itens:docs,
    qtdItensComEntrada:registered.length,qtdItensPendentes:pending.length,
    operador:user.email||'',uid:user.uid,criadoEmLocal:stamp,criadoEm:serverTimestamp()};
   for(const item of registered){
    const info=stockDetails.get(String(item.codigo)),ref=moveLinks.get(item.codigo);
    const quantity=Number(item.quantidadeRecebida);
    const record={id:ref.id,codigo:String(item.codigo),nome:info.real.nome,
     unidade:info.real.unidade,tipo:'ENTRADA',quantidade:quantity,delta:quantity,
     antes:info.prev,depois:info.next,solicitante:user.email||'Almoxarifado',
     pedido:d.pedidoCompra,observacao:'Recebimento de fornecedor · NF '+d.notaFiscal,
     fornecedor:d.fornecedor,notaFiscal:d.notaFiscal,pedidoCompra:d.pedidoCompra,
     reciboId:receiptRef.id,origem:'RECEBIMENTO_INTEGRADO',
     operador:user.email||'',uid:user.uid,dia:today,timeClient:stamp,criadoEm:serverTimestamp()};
    tx.update(itemRef(item.codigo),{quantidade:info.next,ultimoMovimentoId:ref.id,atualizadoEm:serverTimestamp()});
    tx.set(ref,record);
   }
   tx.set(receiptRef,auditData);
   return 'SALVO';
  });
  ntReceiptCommitRef=null;ntReceiptCommitSignature=null;ntReceiptItems=[];ntReceiptManualMode=false;
  ntReceiptDraft={fornecedor:'',pedidoCompra:'',notaFiscal:'',dataRecebimento:day(),observacao:''};
  if(tab==='movimentar'&&kind==='ENTRADA')draw();
  if(result==='EXISTENTE')notice('Fornecedor, pedido e NF já constam como recebimento do dia. Nenhuma entrada foi duplicada.');
  else notice('Recebimento confirmado. '+registered.length+' item(ns) com entrada no estoque e '+pending.length+' sem código pendente(s).');
 }catch(err){
  notice('Recebimento NÃO confirmado nesta tela. Antes de repetir, consulte o Histórico de Recebimentos para evitar duplicações: '+String(err.message||err),true);
 }finally{loader(false)}
}

function ntManualApplyEdits(records,corrections){
 const byId=new Map((records||[]).map(x=>[String(x.numero||''),{...x}]));
 const changes=(corrections||[]).filter(x=>x.acao===NT_MANUAL_EDIT_ACTION&&x.documentoId&&x.depois)
  .sort((a,b)=>String(a.criadoEmLocal||'').localeCompare(String(b.criadoEmLocal||''))||
    String(a.numero||'').localeCompare(String(b.numero||'')));
 for(const edit of changes){
  const id=String(edit.documentoId),record=byId.get(id);
  if(!record)continue;
  const type=record.acao===NT_RECEIPT_ACTION?'receipt':record.acao===NT_PRODUCTION_ACTION?'production':record.acao===NT_REPOS_ACTION?'reposition':'';
  if(type!==edit.documentoTipo)continue;
  const next={...record};
  if(type==='receipt'){
   for(const k of ['fornecedor','pedidoCompra','notaFiscal']){
    if(typeof edit.depois[k]!=='string')continue;
    next[k]=edit.depois[k];
   }
   if(Array.isArray(edit.depois.itens)&&edit.depois.itens.length<=50)
    next.itens=edit.depois.itens.map(x=>({...x}));
  }else if(type==='reposition'){
   if(Array.isArray(edit.depois.itens)&&edit.depois.itens.length>0){
    next.itens=edit.depois.itens.map(item=>({...item}));
    next.totalItens=next.itens.length;
   }
   if(typeof edit.depois.excluidoDoGeral==='boolean')next.excluidoDoGeral=edit.depois.excluidoDoGeral;
  }else if(type==='production'&&Array.isArray(edit.depois.itens)&&edit.depois.itens.length<=40){
   // A retificação é um instantâneo completo: aceita acréscimos e exclusões,
   // inclusive de um lançamento inteiro incorreto. O documento original fica imutável.
   // Não mesclar pelo índice anterior, pois uma exclusão desloca todas as linhas seguintes.
   next.itens=edit.depois.itens.map(x=>({...x,
    modelo:x.nomeMaquina,ordemProducao:x.lote}));
  }else continue;
  next.ultimaRetificacao=edit.criadoEmLocal;
  byId.set(id,next);
 }
 return [...byId.values()];
}
async function ntManualLoad(action){

 const [snap,corrections]=await Promise.all([
  getDocsFromServer(query(collection(db,'nt_web_auditoria'),where('acao','==',action))),
  getDocsFromServer(query(collection(db,'nt_web_auditoria'),where('acao','==',NT_MANUAL_EDIT_ACTION)))
 ]);
 const original=snap.docs.map(d=>({...d.data(),numero:d.id})).filter(r=>Array.isArray(r.itens));
 return ntManualApplyEdits(original,corrections.docs.map(d=>({...d.data(),numero:d.id})))
  .sort((a,b)=>String(b.criadoEmLocal||'').localeCompare(String(a.criadoEmLocal||'')));
}

function ntManualEditAddMachine(){

 draft.addedCount++;

function ntManualNewData(type,old){
 if(type==='receipt'){
  const supplier=String($('neSupplier')?.value||'').trim(),pc=String($('nePC')?.value||'').trim(),
   invoice=String($('neInvoice')?.value||'').trim();
  if(!supplier||supplier.length>160||!pc||pc.length>90||!invoice||invoice.length>90)
   throw Error('Preencha fornecedor, pedido de compra e nota fiscal (limites: 160, 90 e 90 caracteres).');
  const draft=ntManualEditDraft;
  const items=draft.original.itens.filter((item,i)=>!draft.removedRows.has(i)).map((item,i,all)=>{
   const originalIndex=draft.original.itens.indexOf(item);
   const original=draft.original.itens[originalIndex];
   const text=String($('neRecNF'+originalIndex)?.value||'').trim();
   const amount=rnd(nval(text));
   if(!/^\d{1,8}([,.]\d{1,4})?$/.test(text)||!Number.isFinite(amount)||amount<=0)
    throw Error('Item '+(originalIndex+1)+': confira a quantidade da nota fiscal (até quatro casas decimais).');
   const next={...original,quantidadeNota:amount};
   if(original.semCadastro){
    const name=String($('neRecName'+originalIndex)?.value||'').trim();
    if(name.length<3||name.length>140)throw Error('Item '+(originalIndex+1)+': descrição inválida.');
    next.nome=name;
   }
   return next;
  });
  if(!items.length)throw Error('O recebimento não pode ficar sem itens. Não exclua a última linha.');
  return {fornecedor:supplier,pedidoCompra:pc,notaFiscal:invoice,itens:items};
 }
 const draft=ntManualEditDraft;
 const count=old.itens.length+(draft?.type==='production'?(draft.addedCount||0):0);
 if(count>40)throw Error('Limite de 40 máquinas por registro.');
 // Linhas marcadas para exclusão não entram no novo documento efetivo.
 const indices=Array.from({length:count},(_,i)=>i)
  .filter(i=>!(draft?.removedRows?.has(i)));
 const items=indices.map(i=>{
  const code=String($('neCode'+i)?.value||'').trim(),name=String($('neName'+i)?.value||'').trim(),
   unit=String($('neUnit'+i)?.value||'').trim().toUpperCase(),
   lot=String($('neLot'+i)?.value||'').trim(),
   pText=String($('nePlanned'+i)?.value||'').trim(),cText=String($('neDone'+i)?.value||'').trim(),
   planned=Number(pText),completed=Number(cText);
  if(!/^[A-Za-z0-9-]{5,40}$/.test(code)||name.length<3||name.length>160||
     !/^[A-Z0-9²./ -]{1,12}$/.test(unit)||!lot||lot.length>90||
     !pText||!cText||!Number.isInteger(planned)||!Number.isInteger(completed)||
     planned<=0||completed<0||completed>planned)
    throw Error('Máquina '+(i+1)+': confira código, produto, unidade, lote e quantidades inteiras.');
  return {codigoMaquina:code,nomeMaquina:name,unidadeMedida:unit,
   lote:lot,quantidadePedida:planned,quantidadeConcluida:completed};
 });
 return {itens:items};
}
async function ntManualEditSave(){
 const draft=ntManualEditDraft;
 if(!draft||!['receipt','production'].includes(draft.type))throw Error('Abra a edição pelo histórico.');
 isReady();
 const proposed=ntManualNewData(draft.type,draft.original);
 if(JSON.stringify(proposed)===JSON.stringify(draft.original)){
  notice('Nenhuma informação foi alterada.');return;
 }
 const excluded=draft.type==='production'?[...draft.removedRows].sort((a,b)=>a-b)
  .map(i=>({indiceAnterior:i+1,...draft.original.itens[i]})):[];
 const actionDescription=(draft.type==='production'?
  ((excluded.length?'Excluir '+excluded.length+' máquina(s)'+
    (excluded.some(x=>x.lote==='5003478')?' (incluindo lote 5003478)':'')+'. ':'')+
   (draft.addedCount?'Acrescentar '+draft.addedCount+' nova(s) máquina(s). ':'')+
   (proposed.itens.length?'Restarão '+proposed.itens.length+' linha(s) no registro. ':'Este documento ficará SEM máquinas nos relatórios. '))
   :'Corrigir os dados de recebimento. ');
 if(!confirm(actionDescription+
   'Salvar a correção com histórico de antes e depois? Não altera estoque nem movimentos oficiais.'))return;
 const target=doc(db,'nt_web_auditoria',draft.id),logRef=doc(collection(db,'nt_web_auditoria'));
 loader(true);
 try{
  const [snap,corrections]=await Promise.all([
   getDocFromServer(target),
   getDocsFromServer(query(collection(db,'nt_web_auditoria'),where('acao','==',NT_MANUAL_EDIT_ACTION)))
  ]);
  const action=draft.type==='receipt'?NT_RECEIPT_ACTION:NT_PRODUCTION_ACTION;
  if(!snap.exists()||snap.data().acao!==action||!Array.isArray(snap.data().itens))
   throw Error('Registro original não encontrado.');
  const effective=ntManualApplyEdits([{...snap.data(),numero:snap.id}],
    corrections.docs.map(d=>({...d.data(),numero:d.id})))[0];
  const current=ntManualEditableData(draft.type,effective);
  if(JSON.stringify(current)!==JSON.stringify(draft.original))
   throw Error('Documento retificado em outra sessão. Reabra o histórico antes de salvar.');
  const now=new Date().toISOString();
  await setDoc(logRef,{acao:NT_MANUAL_EDIT_ACTION,documentoId:draft.id,
   documentoTipo:draft.type,antes:current,depois:proposed,
   itensExcluidos:excluded,tipoRetificacao:excluded.length?'COM_EXCLUSAO':'EDICAO_OU_INCLUSAO',
   usuario:user.email||'',uid:user.uid,criadoEm:serverTimestamp(),
   criadoEmLocal:now});
  ntManualEditDraft=null;
  notice('Retificação registrada no histórico. PDFs novos mostram os dados corrigidos.');
  await ntManualHistory(draft.type);
 }catch(err){
  notice('Não foi possível salvar a retificação: '+String(err.message||err)+'. Confira suas permissões no Firebase.',true);
 }finally{loader(false)}
}
/* Resumo Gerencial: leitura de dados CONFIRMADOS do servidor no momento da emissão. */
// Recebimentos apenas em leitura: auditados e vinculados a movimentações já contabilizadas.
function ntManagerReceiptRows(receiptDocs,movements,from,to){
 const receipts=(Array.isArray(receiptDocs)?receiptDocs:[])
  .filter(r=>Array.isArray(r.itens)&&String(r.dataRecebimento||'')>=from&&String(r.dataRecebimento||'')<=to)
  .sort((a,b)=>String(a.dataRecebimento||'').localeCompare(String(b.dataRecebimento||''))||
   String(a.criadoEmLocal||'').localeCompare(String(b.criadoEmLocal||'')));
 const movementMap=new Map(movements.filter(m=>m.tipo==='ENTRADA'&&m.id&&!testeIdentificado(m)).map(m=>[String(m.id),m]));
 const rows=[];
 for(const r of receipts){
  for(const x of r.itens){
   const code=String(x.codigo||''),id=String(x.movimentacaoId||'');
   const mv=movementMap.get(id);
   const qty=Number(x.quantidadeRecebida||0);
   const linked=!!(id&&mv&&String(mv.codigo)===code&&String(mv.reciboId||'')===String(r.numero||'')&&
    Number.isFinite(qty)&&Math.abs(ntQty(mv)-qty)<0.0001);
   const status=x.semCadastro||x.statusEntrada==='PENDENTE_CADASTRO'?'PENDENTE CADASTRO':
    x.statusEntrada==='NAO_ENTROU'||qty===0?'SEM ENTRADA':
    linked?'VINCULADO AO ESTOQUE':'VÍNCULO NÃO CONFIRMADO';
   rows.push({data:String(r.dataRecebimento||''),fornecedor:String(r.fornecedor||'—'),
    pc:String(r.pedidoCompra||'—'),nf:String(r.notaFiscal||'—'),codigo:code||'SEM CÓD.',
    nome:String(x.nome||'—'),unidade:String(x.unidadeMedida||'—'),
    prevista:Number(x.quantidadeNota||0),recebida:qty,status});
  }
 }
 return {receipts,rows};
}
function ntManagerReceiptPages(data,periodLabel,date){
 if(!data.receipts.length)return [];
 const chunks=[];let chunk=[],size=0;
 for(const row of data.rows){
  const wraps=Math.max(1,Math.ceil(row.nome.length/28),Math.ceil(row.fornecedor.length/23));
  const weight=1+0.6*(wraps-1);
  if(chunk.length&&(chunk.length>=10||size+weight>11)){
   chunks.push(chunk);chunk=[];size=0;
  }
  chunk.push(row);size+=weight;
 }
 if(chunk.length||!chunks.length)chunks.push(chunk);
 const metrics='<div class="metrics">'+[
  ['ENTREGAS',String(data.receipts.length)],
  ['LINHAS DE MATERIAL',String(data.rows.length)],
  ['FORNECEDORES',String(new Set(data.receipts.map(x=>String(x.fornecedor||'').trim())).size)],
  ['PENDÊNCIAS / SEM VÍNCULO',String(data.rows.filter(x=>x.status!=='VINCULADO AO ESTOQUE').length)]
 ].map(x=>'<div class="metric"><small>'+ntPlain(x[0])+'</small><strong>'+ntPlain(x[1])+'</strong></div>').join('')+'</div>';
 return chunks.map((rows,i)=>{
  const head=ntTop('RECEBIMENTOS DE MATERIAIS','Compras recebidas e documentação vinculada às movimentações do período.',date);
  const table=ntTable(['DATA','FORNECEDOR','PC','NF','CÓDIGO','MATERIAL','UN.','RECEBIDA','STATUS'],
   [8,16,8,9,12,22,5,8,12],
   rows.map(r=>[ntDate(r.data),r.fornecedor,r.pc,r.nf,r.codigo,r.nome,r.unidade,fmt(r.recebida),
    r.status==='VINCULADO AO ESTOQUE'?'CONFIRMADO':r.status==='PENDENTE CADASTRO'?'PENDENTE':
    r.status==='SEM ENTRADA'?'SEM ENTRADA':'A CONFERIR']));
  const note='<p class="note">CONFIRMADO: entrada localizada em movimentações oficiais, com vínculo ao documento. A CONFERIR: não foi possível comprovar o vínculo. PENDENTE: item sem cadastro. O relatório não lança entradas nem altera saldos.</p>';
  return '<section class="page landscape nt-manager-receipts">'+head+(i===0?metrics:'')+
    '<div class="sectionline"><span>RELAÇÃO DE RECEBIMENTOS'+(i?' · CONTINUAÇÃO':'')+
    '</span><span>'+ntPlain(periodLabel)+'</span></div>'+table+note+'__NT_MANAGER_FOOT__</section>';
 });
}

function ntManagerReport(materials,movements,from,to,periodLabel,receiptDocs=[]){
 const byCode=new Map(materials.map(m=>[String(m.codigo),m]));
 const receiptData=ntManagerReceiptRows(receiptDocs,movements,from,to);
 const used=new Map(),kinds={SAIDA:0,ENTRADA:0,DEVOLUCAO:0},people=new Set();
 let ignored=0,valueOfOutbound=0;
 for(const mv of movements){
  if(testeIdentificado(mv)){ignored++;continue}
  const kind=String(mv.tipo||'');

/* RELATÓRIO GERAL DO DIA
   Fontes: materiais + movimentações + registros documentais de recebimento e produção.
   Somente getDocsFromServer: nenhum ajuste ou movimentação no Firebase. */
function ntDayNumber(v){
 const n=Number(v);
 return Number.isFinite(n)?n:0;
}
function ntDayValidSaldo(v){
 return v!==null&&v!==undefined&&v!==''&&Number.isFinite(Number(v))?Number(v):null;
}
function ntDaySortMovement(a,b){
 const getTime=m=>{
  const stamp=m.criadoEm;
  if(stamp&&typeof stamp.toMillis==='function')return stamp.toMillis();
  if(stamp&&Number.isFinite(Number(stamp.seconds)))return Number(stamp.seconds)*1000+(Number(stamp.nanoseconds)||0)/1e6;
  const t=Date.parse(String(m.timeClient||''));
  return Number.isFinite(t)?t:0;
 };
 return getTime(a)-getTime(b)||String(a.timeClient||'').localeCompare(String(b.timeClient||''))||String(a.id||'').localeCompare(String(b.id||''));
}
function ntDayMachineRows(production){
 return (production||[]).flatMap(r=>(r.itens||[]).map(x=>({
  codigoMaquina:String(x.codigoMaquina||'—'),
  produto:String(x.nomeMaquina||x.modelo||'—'),
  unidade:String(x.unidadeMedida||'—'),
  lote:String(x.lote||x.ordemProducao||'—'),
  pedida:ntDayNumber(x.quantidadePedida),concluida:ntDayNumber(x.quantidadeConcluida),
  ordemProducao:String(x.ordemProducao||'—'),
  observacao:String(r.observacao||'')
 })));
}

function ntRepoLocalDay(r){
 let stamp=String(r?.criadoEmLocal||'').trim(),d=stamp?new Date(stamp):null;
 if((!d||!Number.isFinite(d.getTime()))&&r?.criadoEm){
  const t=r.criadoEm;
  if(typeof t.toDate==='function')d=t.toDate();
  else if(Number.isFinite(Number(t.seconds)))d=new Date(Number(t.seconds)*1000);
 }
 if(!d||!Number.isFinite(d.getTime()))return '';
 try{
  const x=new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Fortaleza',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);
  const p=Object.fromEntries(x.filter(t=>t.type!=='literal').map(t=>[t.type,t.value]));
  return p.year+'-'+p.month+'-'+p.day;
 }catch(_){return ''}
}
function ntRepoLocalHour(r){
 const s=String(r?.criadoEmLocal||'').trim(),d=s?new Date(s):null;
 if(!d||!Number.isFinite(d.getTime()))return '—';
 try{return new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Fortaleza',hour:'2-digit',minute:'2-digit',hour12:false}).format(d)}
 catch(_){return '—'}
}


/* Relatórios emitidos: somente a versão mais recente de cada data entra no PDF geral.
   Versões anteriores continuam no histórico; exclusão é documental, nunca apaga estoque. */
function ntReposDailyVersions(records){
 const byDay=new Map();
 for(const r of (records||[])){
  const d=ntRepoLocalDay(r);
  if(!d||!Array.isArray(r.itens))continue;
  const prev=byDay.get(d);
  if(!prev||String(r.criadoEmLocal||'').localeCompare(String(prev.criadoEmLocal||''))>0||
    (String(r.criadoEmLocal||'')===String(prev.criadoEmLocal||'')&&String(r.numero||'')>String(prev.numero||'')))byDay.set(d,r);
 }
 return byDay;
}

function ntGeneralDayModel(date,materials,movements,receiptDocs,productionDocs,reposDocs=[]){
 const byCode=new Map(materials.map(x=>[String(x.codigo),x]));
 const recognized=new Set(['SAIDA','ENTRADA','DEVOLUCAO']);
 const cancelledMovements=(movements||[]).filter(m=>m.estornado);
 // Historico completo serve somente para conferir a posicao real do saldo.
 // Apenas movimentos operacionais entram nos indicadores e tabelas.
 const history=ntArmEffectiveMovements(movements)
  .filter(m=>!m.anulado&&!testeIdentificado(m)&&['SAIDA','ENTRADA','DEVOLUCAO','AJUSTE'].includes(String(m.tipo)))
  .sort(ntDaySortMovement);
 const all=history.filter(m=>recognized.has(String(m.tipo)));
 const operating=all;
 const balanceHistoryByCode=new Map();
 for(const event of history){
  const code=String(event.codigo||'');
  if(!code)continue;
  if(!balanceHistoryByCode.has(code))balanceHistoryByCode.set(code,[]);
  balanceHistoryByCode.get(code).push(event);
 }
 const requested=operating.filter(m=>m.tipo==='SAIDA');
 const incoming=operating.filter(m=>m.tipo==='ENTRADA');
 const receipts=receiptDocs.filter(x=>x.dataRecebimento===date);
 const production=productionDocs.filter(x=>x.dataProducao===date);
 const latest=ntReposDailyVersions(Array.isArray(reposDocs)?reposDocs:[]).get(date);
 const repos=latest&&!latest.excluidoDoGeral?[latest]:[];
 const machineRows=ntDayMachineRows(production);
 const entranceById=new Map(operating.filter(m=>m.tipo==='ENTRADA'&&m.id).map(m=>[String(m.id),m]));
 const receiptRows=receipts.flatMap(r=>(r.itens||[]).map(x=>{
  const codigo=String(x.codigo||''),movimentacaoId=String(x.movimentacaoId||''),move=entranceById.get(movimentacaoId);
  const linked=!!(movimentacaoId&&move&&String(move.codigo)===codigo&&String(move.reciboId||'')===String(r.numero||'')&&
    Math.abs(ntQty(move)-ntDayNumber(x.quantidadeRecebida))<0.0001);
  return {
   fornecedor:String(r.fornecedor||'—'),pedidoCompra:String(r.pedidoCompra||'—'),
   notaFiscal:String(r.notaFiscal||'—'),codigo,
   nome:String(x.nome||byCode.get(codigo)?.nome||'—'),
   unidade:String(byCode.get(codigo)?.unidadeMedida||x.unidadeMedida||'—'),
   prevista:ntDayNumber(x.quantidadeNota),recebida:ntDayNumber(x.quantidadeRecebida),
   semCadastro:!!x.semCadastro,statusEntrada:String(x.statusEntrada||''),
   movimentacaoId,entradaConfirmada:linked,
   observacao:String(r.observacao||''),numero:String(r.numero||'')
  };
 }));
 const stockMap=new Map();
 for(const mv of all){
  const code=String(mv.codigo||'');
  if(!code)continue;
  if(!stockMap.has(code)){
   const m=byCode.get(code);
   stockMap.set(code,{codigo:code,nome:String(m?.nome||mv.nome||'—'),
    unidade:String(m?.unidadeMedida||'—'),saida:0,entrada:0,devolucao:0,
    historico:[],inicio:null,inicialCalculado:null,fim:null,outras:null,ajustes:0,ajusteInvalido:false,residual:null,validar:false});
  }
  const row=stockMap.get(code);
  row.historico.push(mv);
  if(!testeIdentificado(mv)){
   if(mv.tipo==='SAIDA')row.saida=rnd(row.saida+ntQty(mv));
   if(mv.tipo==='ENTRADA')row.entrada=rnd(row.entrada+ntQty(mv));
   if(mv.tipo==='DEVOLUCAO')row.devolucao=rnd(row.devolucao+ntQty(mv));
  }
 }
 const stockRows=[...stockMap.values()].map(row=>{
  const events=balanceHistoryByCode.get(String(row.codigo))||row.historico;
  const first=events[0],last=events[events.length-1];
  row.inicio=ntDayValidSaldo(first.antes);row.fim=ntDayValidSaldo(last.depois);
  // Conferências não são operações de entrada/saída e não entram nas contagens
  // nem nos rankings. São usadas somente para conciliar saldos históricos.
  const counts=events.filter(m=>m.tipo==='AJUSTE');
  let reconciled=0;
  for(const event of counts){
   const before=ntDayValidSaldo(event.antes),after=ntDayValidSaldo(event.depois),
    delta=Number(event.delta);
   if(before===null||after===null||!Number.isFinite(delta)||
      Math.abs(rnd(after-before-delta))>0.0001){
    row.ajusteInvalido=true;
   }else reconciled=rnd(reconciled+delta);
  }
  row.ajustes=reconciled;
  if(row.inicio!==null&&row.fim!==null){
   const movementDelta=rnd(row.entrada+row.devolucao-row.saida);
   row.outras=rnd(row.fim-row.inicio-movementDelta);
   row.residual=rnd(row.outras-reconciled);
   // Só a diferença não explicada por registros válidos exige revisão.
   row.validar=row.ajusteInvalido||Math.abs(row.residual)>0.0001;
  }else{
   // Dados antigos sem saldo antes/depois não podem parecer conciliados.
   row.validar=true;
  }
  // Inicial reconstruido contabilmente a partir do fechamento:
  // final registrado + retiradas - entradas - devolucoes.
  // Nao representa uma contagem historica e nao muda o Firebase.
  if(!row.validar&&row.fim!==null){
   const calculated=rnd(row.fim+row.saida-row.entrada-row.devolucao);
   if(!Number.isFinite(calculated)||calculated<0)row.validar=true;
   else row.inicialCalculado=calculated;
  }
  delete row.historico;
  return row;
 }).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')||a.codigo.localeCompare(b.codigo));
 const receivedByCode=new Map(),registeredByCode=new Map();
 for(const x of receiptRows){if(!x.codigo)continue;receivedByCode.set(x.codigo,rnd((receivedByCode.get(x.codigo)||0)+x.recebida))}
 for(const x of incoming){const code=String(x.codigo||'');registeredByCode.set(code,rnd((registeredByCode.get(code)||0)+ntQty(x)))}
 const compareCodes=[...new Set([...receivedByCode.keys(),...registeredByCode.keys()])].sort();
 const comparisons=compareCodes.map(code=>{
  const doc=receivedByCode.get(code)||0,stock=registeredByCode.get(code)||0;
  const item=byCode.get(code),seen=receiptRows.find(x=>x.codigo===code);
  const docItems=receiptRows.filter(x=>x.codigo===code&&x.recebida>0);
  const allLinked=docItems.length>0&&docItems.every(x=>x.entradaConfirmada);
  return {codigo:code,nome:String(item?.nome||seen?.nome||'—'),
   unidade:String(item?.unidadeMedida||seen?.unidade||'—'),
   recebido:doc,entradas:stock,diferenca:rnd(doc-stock),
   situacao:!doc?'Sem recebimento documental no dia':!stock?'Sem entrada registrada no dia':
    allLinked&&Math.abs(doc-stock)<.0001?'Entradas integradas e vinculadas':
    allLinked?'Entradas vinculadas; há outras movimentações':
    Math.abs(doc-stock)>.0001?'Quantidades diferentes; verificar vínculos':'Quantidades iguais; vínculo não confirmado'};
 });
 const totalMachines=machineRows.reduce((n,r)=>n+r.concluida,0);
 const totalAsked=machineRows.reduce((n,r)=>n+r.pedida,0);
 const requests=new Set(requested.map(x=>String(x.pedido||'').trim()).filter(Boolean));
 return {date,materialsCount:materials.length,materialCatalog:materials,machineRows,receiptRows,receipts,repos,
  requests:[...requested].sort(ntDaySortMovement),
  operationalRows:operating.map(m=>({id:m.id||'',timeClient:m.timeClient||'',codigo:m.codigo||'',nome:m.nome||'',tipo:m.tipo,quantidade:ntQty(m),solicitante:m.solicitante||'',pedido:m.pedido||''})),
  stockRows,comparisons,production,
  totals:{machines:totalMachines,machinesRequested:totalAsked,orders:requests.size,cancelledMoves:cancelledMovements.length,
   reposReports:repos.length,reposLines:repos.reduce((sum,r)=>sum+r.itens.length,0),
   requestsLines:requested.length,requestsMaterials:new Set(requested.map(x=>String(x.codigo))).size,
   suppliers:new Set(receipts.map(r=>String(r.fornecedor||'').trim()).filter(Boolean)).size,
   receipts:receipts.length,receiptLines:receiptRows.length,
   receiptDifferences:receiptRows.filter(x=>Math.abs(x.prevista-x.recebida)>.0001).length,
   pendingCodes:receiptRows.filter(x=>!x.codigo).length,
   stockItems:new Set(operating.map(m=>String(m.codigo)).filter(Boolean)).size,stockNotReconciled:stockRows.filter(x=>x.validar).length,
   stockEntries:incoming.length,returnLines:operating.filter(m=>m.tipo==='DEVOLUCAO').length,
   notes:comparisons.filter(x=>Math.abs(x.diferenca)>.0001).length}
 };
}

 if(!allRecords.length)return []; // não inserir página vazia no Relatório Geral
 const divergences=allRecords.reduce((n,r)=>n+(r.itens||[]).filter(x=>Math.abs(rnd(Number(x.quantidadeRecebida||0)-Number(x.quantidadeNota||0)))>0.00001).length,0);
 const totalLines=allRecords.reduce((n,r)=>n+(r.itens||[]).length,0);
 const metrics='<div class="metrics nt-rx-metrics">'+[['DATA DE REFERÊNCIA',ntDate(date)],['ENTREGAS',allRecords.length],['LINHAS DE MATERIAL',totalLines],['DIVERGÊNCIAS',divergences]].map(x=>
  '<div class="metric"><small>'+ntPlain(x[0])+'</small><strong>'+ntPlain(x[1])+'</strong></div>').join('')+'</div>';
 // Orçamento conservador de altura: reserva área para cabeçalho, métricas, rodapé e nota final.
 const budget=index=>index===0?128:152; // A4 paisagem: cabeçalho, indicadores e rodapé reservados
 const rowHeight=x=>{
  const size=Math.max(String(x.nome||'').length/39,String(x.codigo||'').length/13);
  const warning=x.semCadastro||!['ESTOQUE_ATUALIZADO',''].includes(String(x.statusEntrada||''));
  return 7.7+Math.max(0,Math.ceil(size)-1)*3.5+(warning?4:0);
 };
 const cost=items=>26+items.reduce((n,x)=>n+rowHeight(x),0);
 let current={parts:[],used:0};
 const nextPage=()=>{if(current.parts.length)sheets.push(current);current={parts:[],used:0}};
 for(let ri=0;ri<allRecords.length;ri++){
  const r=allRecords[ri],all=Array.isArray(r.itens)?r.itens:[];
  let offset=0;
  do{
   let chunk=all.length?all.slice(offset,offset+14):[];
   // Mantém a entrega inteira na mesma página quando possível.
   if(current.parts.length&&current.used+cost(chunk)>budget(sheets.length))nextPage();
   // Nomes longos e avisos de pendência podem exigir mais espaço por linha.
   while(chunk.length>1&&cost(chunk)>budget(sheets.length))chunk.pop();
   if(current.parts.length&&current.used+cost(chunk)>budget(sheets.length))nextPage();
   current.parts.push({r,ri,chunk,continuation:offset>0});
   current.used+=cost(chunk);
   offset+=chunk.length;
  }while(offset<all.length);
 }
 nextPage();
 if(!sheets.length)sheets.push({parts:[],used:0});
 for(let pageIndex=0;pageIndex<sheets.length;pageIndex++){
  const parts=sheets[pageIndex].parts;
  const heading=ntTop('RECEBIMENTO DE MATERIAIS','Consolidado diário · entregas identificadas por fornecedor, nota e pedido.',date);
  let content='';
  for(const part of parts){
   const r=part.r,items=part.chunk,ri=part.ri;
   const banner='<div class="nt-rx-banner"><div class="nt-rx-badge">ENTREGA '+ntPlain(String(ri+1).padStart(2,'0'))+
    (part.continuation?'<small>CONTINUAÇÃO</small>':'')+'</div><div class="nt-rx-body">'+
    '<div class="nt-rx-vendor"><small>FORNECEDOR</small><strong>'+ntPlain(r.fornecedor||'Não informado')+'</strong>'+
    '<em>RESP.: Almoxarifado</em></div><div class="nt-rx-side"><div class="nt-rx-refs">'+
    '<span>PC: <b>'+ntPlain(r.pedidoCompra||'—')+'</b></span><i></i>'+
    '<span>NF: <b>'+ntPlain(r.notaFiscal||'—')+'</b></span></div>'+
    '<span class="nt-rx-when">'+ntPlain(ntDate(r.dataRecebimento))+'</span></div></div></div>';
   const rows=items.map(x=>{
    const diff=rnd(Number(x.quantidadeRecebida||0)-Number(x.quantidadeNota||0));
    const warning=x.semCadastro||x.statusEntrada==='PENDENTE_CADASTRO'?'PENDENTE DE CADASTRO':
     x.statusEntrada==='NAO_ENTROU'?'SEM ENTRADA NO ESTOQUE':
     x.statusEntrada&&x.statusEntrada!=='ESTOQUE_ATUALIZADO'?'VÍNCULO DE ENTRADA NÃO CONFIRMADO':'';
    return '<tr><td class="nt-rx-code">'+ntPlain(x.codigo||'SEM CÓD.')+'</td>'+
     '<td class="nt-rx-name">'+ntPlain(x.nome||'—')+(warning?'<small class="nt-rx-warn">'+warning+'</small>':'')+'</td>'+
     '<td>'+ntPlain(x.unidadeMedida||'—')+'</td>'+
     '<td class="nt-rx-numeric">'+ntPlain(fmt(x.quantidadeNota))+'</td>'+
     '<td class="nt-rx-numeric">'+ntPlain(fmt(x.quantidadeRecebida))+'</td>'+
     '<td class="nt-rx-numeric'+(diff?' nt-rx-diff':'')+'">'+ntPlain(fmt(diff))+'</td></tr>';
   }).join('');
   content+=banner+'<table class="nt-rx-table"><colgroup><col style="width:16%"><col style="width:38%">'+
    '<col style="width:7%"><col style="width:13%"><col style="width:13%"><col style="width:13%"></colgroup>'+
    '<thead><tr><th>CÓDIGO</th><th>MATERIAL</th><th>UN.</th><th>QTD. NF</th><th>RECEBIDO</th><th>DIF.</th></tr></thead>'+
    '<tbody>'+(rows||'<tr><td colspan="6" class="empty">Nenhum material informado.</td></tr>')+'</tbody></table>';
  }
  if(!parts.length)content='<p class="note">Não foram registrados recebimentos nesta data.</p>';
  if(pageIndex===sheets.length-1&&parts.length){
   content+='<div class="nt-rx-note">'+(divergences?'Divergências encontradas: <b>'+divergences+'</b> linha(s). ':'Sem divergências entre quantidades de nota fiscal e recebidas. ')+
    'A diferença corresponde à quantidade recebida menos a quantidade da NF. Entradas integradas de materiais cadastrados atualizam o estoque; itens sem cadastro ficam pendentes.</div>';
  }
  pages.push('<section class="page landscape nt-general-receipt">'+heading+(pageIndex===0?metrics:'')+content+marker+'</section>');
 }
 return pages;
}

function ntGeneralProductionPages(machineRows,date,marker){
 const pages=[],empty=message=>'<p class="note" style="margin-top:8mm">'+ntPlain(message)+'</p>';
 // Ordem operacional estável por código; usada por ambos os PDFs, sem modificar os registros.
 const ordered=[...(Array.isArray(machineRows)?machineRows:[])].sort((a,b)=>{
  const codeA=String(a.codigoMaquina||'').trim(),codeB=String(b.codigoMaquina||'').trim();
  const missingA=!codeA||codeA==='—',missingB=!codeB||codeB==='—';
  if(missingA!==missingB)return missingA?1:-1;
  return codeA.localeCompare(codeB,'pt-BR',{numeric:true,sensitivity:'base'})||
   String(a.lote||'').localeCompare(String(b.lote||''),'pt-BR',{numeric:true})||
   String(a.produto||'').localeCompare(String(b.produto||''),'pt-BR');
 });
 // Indicadores sao totais do dia, nunca subtotais que confundem ao mudar de pagina.
 const completed=ordered.reduce((sum,x)=>sum+Number(x.concluida||0),0);
 const distinct=new Set(ordered.map(x=>x.codigoMaquina==='—'?x.produto:x.codigoMaquina)).size;
 const lots=new Set(ordered.map(x=>x.lote).filter(x=>x!=='—')).size;
 // Capacidade controlada do A4 paisagem, com distribuicao equilibrada:
 // 13 linhas cabem em 1 folha; 14+ linhas sao divididas sem pagina quase vazia.
 const sheets=Math.max(1,Math.ceil(ordered.length/13));
 const perPage=Math.max(1,Math.ceil(ordered.length/sheets));
 for(let i=0;i<sheets;i++){
  const part=ordered.slice(i*perPage,(i+1)*perPage);
  const summaries='<div class="metrics nt-gp-metrics">'+[
   ['MÁQUINAS CONCLUÍDAS',fmt(completed)],['PRODUTOS IDENTIFICADOS',String(distinct)],
   ['LOTES IDENTIFICADOS',String(lots)],['DATA DE REFERÊNCIA',ntDate(date)]
  ].map(x=>'<div class="metric"><small>'+ntPlain(x[0])+'</small><strong>'+ntPlain(x[1])+'</strong></div>').join('')+'</div>';
  const table=part.length?ntTable(
   ['CÓD. MÁQUINA','PRODUTO','UN.','QTDE. FEITA','LOTE / OP'],[16,42,8,15,19],
   part.map(x=>[x.codigoMaquina,x.produto,x.unidade,fmt(x.concluida),x.lote])):
   empty('Nenhuma máquina registrada como produzida nesta data.');
  const unknown=part.filter(x=>x.codigoMaquina==='—'||x.unidade==='—').length;
  const observation=unknown?'<p class="note">Há '+unknown+' registro(s) antigos sem código da máquina ou unidade cadastrados. Os campos não foram preenchidos automaticamente para evitar informações incorretas.</p>':'';
  const body=summaries+
   '<div class="sectionline"><span>RELAÇÃO DE PRODUTOS FABRICADOS</span><span>'+part.length+' máquina(s) nesta página</span></div>'+
   table+observation+
   '<p class="note">Produção informada pelo setor responsável. Este relatório não realiza movimentações de estoque.</p>';
  pages.push('<section class="page landscape nt-general-production">'+ntTop('PRODUÇÃO DE MÁQUINAS','Produção concluída, identificada por produto, código e lote.',date)+body+marker+'</section>');
 }
 return pages;
}

/* Consulta de QR diario: leitura somente no Firestore; nunca movimenta o estoque.
   O dia filtra SAIDAS. O saldo e o saldo ATUAL consultado no servidor, nao o saldo historico. */
function ntDailyQrPrevious(date){
 const parts=String(date||'').split('-').map(Number);
 if(parts.length!==3||parts.some(x=>!Number.isInteger(x)))throw Error('Data invalida');
 const d=new Date(Date.UTC(parts[0],parts[1]-1,parts[2]-1,12));
 return d.toISOString().slice(0,10);
}
function ntDailyQrData(date,materialRows,selectedMoves,previousMoves,stamp){
 const products=new Map((materialRows||[]).map(m=>[String(m.codigo||'').trim(),m]));
 const valid=rows=>ntArmEffectiveMovements(rows||[]).filter(m=>
  String(m.tipo||'')==='SAIDA'&&!m.anulado&&!testeIdentificado(m));
 const today=valid(selectedMoves);
 const prev=valid(previousMoves);
 const prevCodes=new Set(prev.map(x=>String(x.codigo||'').trim()).filter(Boolean));
 const data=new Map();
 for(const move of today){
  const code=String(move.codigo||'').trim();
  if(!code)throw Error('Existe uma saida sem codigo no dia consultado. Verifique o historico.');
  const row=data.get(code)||{codigo:code,ocorrencias:0,retirado:0,anterior:prevCodes.has(code)};
  row.ocorrencias++;
  const q=ntQty(move);
  if(!Number.isFinite(q)||q<=0)throw Error('Quantidade de saida invalida no codigo '+code);
  row.retirado=rnd(row.retirado+q);
  data.set(code,row);
 }
 const faltantes=[],invalidos=[];
 const itens=[...data.values()].map(x=>{
  const material=products.get(x.codigo);
  if(!material){faltantes.push(x.codigo);return null}
  const saldo=Number(material.quantidade);
  if(!Number.isFinite(saldo)||saldo<0){invalidos.push(x.codigo);return null}
  return {...x,nome:String(material.nome||'SEM DESCRICAO'),unidade:String(material.unidadeMedida||'—'),
   saldo:rnd(saldo),conferido:material.conferido===true};
 }).filter(Boolean);
 if(faltantes.length||invalidos.length)throw Error('Nao foi possivel confirmar saldos oficiais. Codigos sem cadastro: '+
  (faltantes.join(', ')||'nenhum')+'; saldos invalidos: '+(invalidos.join(', ')||'nenhum')+'.');
 itens.sort((a,b)=>Number(b.anterior)-Number(a.anterior)||
  a.nome.localeCompare(b.nome,'pt-BR')||a.codigo.localeCompare(b.codigo));
 return {date,previous:ntDailyQrPrevious(date),consultadoEm:stamp,itens,
  retiradas:today.length,repetidosAntes:itens.filter(x=>x.anterior).length,
  repetidosNoDia:itens.filter(x=>x.ocorrencias>1).length};
}
function ntDailyQrPopupInit(){
 // Executada exclusivamente na aba de impressao, sem acesso ao banco de dados.
 const ready=document.getElementById('ntqStatus');
 const button=document.getElementById('ntqPrint');
 try{
  const Core=window.NTQRCodeCore;
  if(typeof Core!=='function')throw Error('Gerador de QR Code indisponivel');
  const targets=Array.from(document.querySelectorAll('[data-ntq-code]'));
  for(const box of targets){
   const code=box.getAttribute('data-ntq-code');
   const qr=new Core(-1,0);
   qr.addData(code);qr.make();
   const count=qr.getModuleCount(),quiet=4,total=count+quiet*2;
   let path='';
   for(let y=0;y<count;y++)for(let x=0;x<count;x++){
    if(qr.isDark(y,x))path+='M'+(x+quiet)+' '+(y+quiet)+'h1v1h-1z';
   }
   box.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QR Code" viewBox="0 0 '+
    total+' '+total+'"><rect width="'+total+'" height="'+total+'" fill="#fff"/><path fill="#122e3a" d="'+path+'"/></svg>';
  }
  if(ready)ready.textContent=targets.length+' QR Code(s) prontos. Selecione A4 paisagem e salve como PDF.';
  if(button)button.disabled=false;
 }catch(e){
  if(ready)ready.textContent='FALHA NO QR CODE: '+String(e.message||e)+'. Nao imprima antes de corrigir.';
  if(button)button.disabled=true;
 }
}

 '.ntq-toolbar button:disabled{opacity:.55;cursor:not-allowed}',
 '@media print{html,body{margin:0!important;padding:0!important;background:#fff!important}.ntq-toolbar{display:none!important}.ntq-sheet{width:297mm!important;height:196mm!important;min-height:0!important;margin:0!important;box-shadow:none!important;break-inside:avoid-page!important;page-break-inside:avoid!important}.ntq-card,.ntq-ribbon,.ntq-saldo,.ntq-metric{print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important}}'
 ].join('\n');
 // Mesma biblioteca de QR offline ja presente no sistema; o QR contem somente o codigo.
 const engine=atob(ntQrEngine).replace(/<\/script/gi,'<\\/script');
 return '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">'+
  '<meta name="viewport" content="width=device-width,initial-scale=1">'+
  '<title>New Termisa · QR Codes · '+ntDate(model.date)+'</title><style>'+css+'\n'+localStyles+'</style></head><body>'+
  '<div class="ntq-toolbar"><button type="button" disabled id="ntqPrint" onclick="window.print()">Imprimir / Salvar PDF</button>'+
  '<span id="ntqStatus">Preparando QR Codes... Para impressão: A4 paisagem.</span></div>'+
  pages.join('')+
  '<scr'+'ipt>'+engine+'</scr'+'ipt>'+
  '<scr'+'ipt>('+ntDailyQrPopupInit.toString()+')();</scr'+'ipt>'+
  '</body></html>';
}
function ntDailyQrOpenPDF(){
 if(!user||!serverReady||!navigator.onLine){notice('Conecte-se ao Firebase para gerar os QR Codes com saldo atual.',true);return}
 const selected=dateFilter;
 const popup=window.open('','_blank');
 if(!popup){notice('Permita pop-ups para abrir o PDF com QR Codes.',true);return}
 popup.document.open();
 popup.document.write('<!doctype html><html lang="pt-BR"><meta charset="utf-8"><body style="font:16px Arial;padding:26px">Consultando saidas e saldos oficiais no Firebase...</body></html>');
 popup.document.close();
 (async()=>{
  try{
   const previous=ntDailyQrPrevious(selected);
   const [matSnap,daySnap,prevSnap]=await Promise.all([
    getDocsFromServer(collection(db,'nt_web_materiais')),
    getDocsFromServer(query(collection(db,'nt_web_movimentos'),where('dia','==',selected))),
    getDocsFromServer(query(collection(db,'nt_web_movimentos'),where('dia','==',previous)))
   ]);
   const model=ntDailyQrData(selected,matSnap.docs.map(d=>d.data()),
    daySnap.docs.map(d=>({...d.data(),id:d.id})),
    prevSnap.docs.map(d=>({...d.data(),id:d.id})),
    new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',
       hour:'2-digit',minute:'2-digit'}));
   const html=ntDailyQrHTML(model);
   popup.document.open();popup.document.write(html);popup.document.close();
  }catch(e){
   popup.document.open();popup.document.write('<!doctype html><html lang="pt-BR"><meta charset="utf-8">'+
    '<body style="font:16px Arial;padding:26px"><h2>PDF nao gerado</h2><p>O Firebase nao confirmou todos os saldos. '+ntPlain(e.message||e)+'</p></body></html>');popup.document.close();
   notice('QR Codes por dia: '+String(e.message||e),true);
  }
 })();
}

async function ntRequestsIndividualOpen(){
 const selected=dateFilter,popup=window.open('','_blank');
 if(!popup){notice('Permita pop-ups para visualizar o relatório.',true);return}
 popup.document.write('<!doctype html><html lang="pt-BR"><meta charset="utf-8"><body style="font:16px Arial;padding:26px">Consultando pedidos do Firebase...</body></html>');popup.document.close();
 try{
  const model=await ntGeneralDayFetch(selected);
  popup.document.open();popup.document.write(ntRequestsIndividualPDF(model));popup.document.close();
 }catch(e){
  popup.document.open();popup.document.write('<!doctype html><html lang="pt-BR"><meta charset="utf-8"><body><h2>Consulta indisponível</h2><p>Não foi possível consultar os pedidos.</p></body></html>');popup.document.close();
  notice(e.message||'Falha ao consultar pedidos',true);
 }
}

/* Inteligência do estoque no FINAL do relatório diário.
   Usa apenas informações já lidas no Firebase e movimentos do DIA selecionado.
   Barras CSS + gráfico SVG sem dependências externas, para impressão em PDF. */
function ntGeneralDailyIntelligencePages(model,date,marker){
 const requests=Array.isArray(model.requests)?model.requests:[];
 const stockRows=Array.isArray(model.stockRows)?model.stockRows:[];
 const stockMap=new Map(stockRows.map(r=>[String(r.codigo),r]));
 const used=new Map();
 const unitAlias={'UNIDADE':'UN','UNIDADES':'UN','UND':'UN','UN.':'UN','PEÇA':'UN','PEÇAS':'UN','QUILOGRAMA':'KG','QUILOGRAMAS':'KG','METRO':'M','METROS':'M','LITRO':'L','LITROS':'L','M²':'M2'};
 for(const mv of requests){
  const codigo=String(mv.codigo||'').trim();
  if(!codigo)continue;
  const previous=stockMap.get(codigo);
  const raw=String(previous?.unidade||'—').trim().toUpperCase();
  const unidade=unitAlias[raw]||raw||'—';
  const current=used.get(codigo)||{
   codigo,nome:String(previous?.nome||mv.nome||codigo),unidade,quantidade:0,operacoes:0
  };
  const amount=Number(ntQty(mv));
  current.operacoes++;
  if(Number.isFinite(amount)&&amount>0)current.quantidade=rnd(current.quantidade+amount);
  used.set(codigo,current);
 }
 const byUnit=new Map(),missing=[];
 for(const row of used.values()){
  if(!row.unidade||row.unidade==='—'||row.unidade==='-'||row.quantidade<=0){
   missing.push(row);continue;
  }
  if(!byUnit.has(row.unidade))byUnit.set(row.unidade,[]);
  byUnit.get(row.unidade).push(row);
 }
 const groups=[...byUnit.entries()].map(([unit,items])=>{
  items.sort((a,b)=>b.quantidade-a.quantidade||a.nome.localeCompare(b.nome,'pt-BR')||a.codigo.localeCompare(b.codigo));
  return {unit,items,total:rnd(items.reduce((sum,x)=>sum+x.quantidade,0)),
   operations:items.reduce((sum,x)=>sum+x.operacoes,0)};
 }).sort((a,b)=>b.items.length-a.items.length||(['UN','KG','M','L','M2'].indexOf(a.unit)>>>0)-(['UN','KG','M','L','M2'].indexOf(b.unit)>>>0)||a.unit.localeCompare(b.unit));
 const primary=groups.find(g=>g.unit==='UN')||groups[0]||null;
 const others=groups.filter(g=>g!==primary);
 const totalOperations=requests.length;
 const stockIn=Number(model.totals?.stockEntries)||0;
 const returns=Number(model.totals?.returnLines)||0;
 const movements=totalOperations+stockIn+returns;
 const onlyOnce=[...used.values()].filter(x=>x.operacoes===1).length;
 const repeated=[...used.values()].filter(x=>x.operacoes>1).length;
 const zero=stockRows.filter(x=>x.saida>0&&x.fim!==null&&Number(x.fim)===0)
  .sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
 // A percentagem e confiavel quando ha somente saídas: sem entradas, devolucoes,
 // ajustes ou divergencias que distorceriam o saldo de referencia.
 const pressure=stockRows.filter(x=>Number(x.saida)>0&&Number(x.inicio)>0&&
  x.entrada===0&&x.devolucao===0&&x.ajustes===0&&!x.validar&&
  x.fim!==null&&Number.isFinite(Number(x.fim))).
  map(x=>({...x,percent:100*Number(x.saida)/Number(x.inicio)})).
  filter(x=>x.percent>=50&&x.percent<=100.0001).
  sort((a,b)=>b.percent-a.percent||a.nome.localeCompare(b.nome,'pt-BR'));
 const notReconciled=Number(model.totals?.stockNotReconciled)||0;
 const plain=value=>ntPlain(String(value??''));
 const num=value=>plain(fmt(value));
 const blank='<p class="nt-di-empty">Sem registros suficientes para este indicador no dia.</p>';
 const metrics=items=>'<div class="nt-di-metrics">'+items.map(([title,value])=>
  '<div class="nt-di-metric"><small>'+plain(title)+'</small><strong>'+plain(value)+'</strong></div>').join('')+'</div>';
 const bar=(row,max)=>{const width=max>0?100*row.quantidade/max:0;
  return '<div class="nt-di-barrow"><div class="nt-di-barlabel"><b>'+plain(row.nome)+'</b>'+
   '<small>'+plain(row.codigo)+' · '+row.operacoes+' '+(row.operacoes===1?'retirada':'retiradas')+'</small></div>'+
   '<div class="nt-di-track"><span style="width:'+width.toFixed(1)+'%"></span></div>'+
   '<strong>'+num(row.quantidade)+' '+plain(row.unidade)+'</strong></div>';
 };
 const mainBars=primary?primary.items.slice(0,6).map(row=>bar(row,primary.items[0].quantidade)).join(''):blank;
 const donutData=[{name:'Retiradas',value:totalOperations,color:'#12888f'},
  {name:'Entradas',value:stockIn,color:'#3c86c4'},
  {name:'Devoluções',value:returns,color:'#e1a457'}];
 const radius=35,circ=2*Math.PI*radius;
 let offset=0;
 const arcs=donutData.filter(item=>item.value>0&&movements>0).map(item=>{
  const length=circ*item.value/movements;
  const svg='<circle cx="50" cy="50" r="'+radius+'" fill="none" stroke="'+item.color+
   '" stroke-width="13" transform="rotate(-90 50 50)" stroke-dasharray="'+length.toFixed(3)+' '+
   (circ-length).toFixed(3)+'" stroke-dashoffset="'+(-offset).toFixed(3)+'"/>';
  offset+=length;return svg;
 }).join('');
 const donut='<svg class="nt-di-donut" viewBox="0 0 100 100" role="img" aria-label="Operações de entrada, retirada e devolução">'+
  '<circle cx="50" cy="50" r="35" fill="none" stroke="#dce8eb" stroke-width="13"/>'+arcs+
  '<text x="50" y="48" text-anchor="middle" font-size="18" font-weight="700" fill="#184755">'+movements+'</text>'+
  '<text x="50" y="60" text-anchor="middle" font-size="7.5" fill="#557482">OPERAÇÕES</text></svg>';
 const legend=donutData.map(item=>'<div class="nt-di-legendrow"><i style="background:'+item.color+'"></i><span>'+
  item.name+'</span><b>'+item.value+'</b></div>').join('');
 const lead=primary?.items[0];
 const leadShare=lead&&primary.total>0?(100*lead.quantidade/primary.total):0;
 const messages=[
  ['MAIOR CONSUMO EM '+(primary?.unit||'—'),lead?
   lead.nome+': '+fmt(lead.quantidade)+' '+lead.unidade+' ('+leadShare.toFixed(1).replace('.',',')+
   '% do consumo em '+lead.unidade+').':'Nenhuma saída com unidade definida.'],
  ['FREQUÊNCIA DE RETIRADAS',onlyOnce+' material(is) retirado(s) uma vez; '+repeated+
   ' com duas ou mais operações no dia.'],
  ['ATENÇÃO AO SALDO',zero.length?zero.length+' material(is) movimentado(s) terminaram o dia com saldo zerado.':
   'Nenhum material retirado terminou o dia com saldo histórico igual a zero.']
 ];
 const diagnose='<div class="nt-di-insighthead">DIAGNÓSTICOS DO DIA</div>'+
  '<div class="nt-di-insights">'+messages.map(([title,body])=>
   '<div class="nt-di-insight"><small>'+plain(title)+'</small><p>'+plain(body)+'</p></div>').join('')+'</div>';
 const overview=metrics([
  ['RETIRADAS (OPERAÇÕES)',totalOperations],['MATERIAIS DISTINTOS',used.size],
  ['ENTRADAS (OPERAÇÕES)',stockIn],['DEVOLUÇÕES (OPERAÇÕES)',returns]
 ]);
 const chartTitle=primary?'MAIORES RETIRADAS EM '+plain(primary.unit):'QUANTIDADES RETIRADAS';
 const pageOne='<div class="nt-di-eyebrow">VISÃO EXECUTIVA · '+plain(ntDate(date))+'</div>'+overview+
  '<div class="nt-di-chartgrid">'+
   '<div class="nt-di-panel"><h2>'+chartTitle+'</h2>'+
    '<p>Top 6 por quantidade. As barras usam somente '+plain(primary?.unit||'unidades cadastradas')+
    '; maior barra = 100% nesta unidade.</p><div class="nt-di-bars">'+mainBars+'</div></div>'+
   '<div class="nt-di-panel"><h2>MOVIMENTAÇÕES OPERACIONAIS</h2>'+
    '<p>Entradas, retiradas e devoluções registradas no período.</p>'+
    '<div class="nt-di-ringbox">'+donut+'<div class="nt-di-legend">'+legend+'</div></div>'+
    '<div class="nt-di-usage"><span>Uma retirada</span><b>'+onlyOnce+' materiais</b>'+
    '<span>Duas ou mais</span><b>'+repeated+' materiais</b></div>'+
    '<div class="nt-di-unitnote"><b>Leitura correta:</b> 1 retirada de 1.000 UN conta como uma operação.'+
    ' As quantidades aparecem no ranking ao lado.</div></div></div>'+diagnose+
  '<div class="nt-di-footnote">Fonte: retiradas confirmadas do dia no Firebase. Ranking por quantidade '+
  'dentro de cada unidade de medida, sem somar UN, KG, M ou L. '+
  (missing.length?missing.length+' material(is) sem unidade válida ficaram fora dos gráficos de quantidade. ':'')+
  'Outras unidades e riscos de estoque constam na análise detalhada quando aplicável.</div>';
 const pages=['<section class="page landscape nt-general-stock-intel">'+
  ntTop('INTELIGÊNCIA DO ESTOQUE','Visão executiva diária · volumes, operações e sinais de atenção.',date)+
  pageOne+marker+'</section>'];
 // Quando ha movimento expressivo ou risco, a segunda pagina amplia a precisão sem compactar letras.
 const detail=used.size>6||groups.length>1||zero.length>0||pressure.length>0||notReconciled>0||counted>0||(Array.isArray(model.receipts)&&model.receipts.length>0);
 if(detail){
  const groupRows=groups.slice(0,6).map(g=>
   '<div class="nt-deep-unitrow"><b>'+plain(g.unit)+'</b><span>'+g.items.length+' item(ns)</span>'+
   '<span>'+g.operations+' retiradas</span><strong>'+num(g.total)+' '+plain(g.unit)+'</strong></div>').join('');
  const extraGroups=others.slice(0,2);
  const otherCharts=extraGroups.map(g=>'<div class="nt-deep-section"><h3>MAIORES SAÍDAS EM '+plain(g.unit)+'</h3>'+
   '<div class="nt-di-bars">'+g.items.slice(0,2).map(item=>bar(item,g.items[0].quantidade)).join('')+
   '</div></div>').join('');
  const moreMain=primary&&primary.items.length>6&&extraGroups.length<=1?'<div class="nt-deep-section"><h3>OUTRAS RETIRADAS EM '+plain(primary.unit)+'</h3>'+
   '<div class="nt-di-bars">'+primary.items.slice(6,9).map(item=>bar(item,primary.items[0].quantidade)).join('')+
   '</div></div>':'';
  const zeroRows=zero.slice(0,3).map(x=>'<div class="nt-deep-alertline"><b>'+plain(x.nome)+'</b>'+
   '<span>'+plain(x.codigo)+' · saldo final 0 '+plain(x.unidade)+'</span></div>').join('');
  const pressureRows=pressure.slice(0,3).map(x=>'<div class="nt-deep-alertline"><b>'+plain(x.nome)+'</b>'+
   '<span>'+plain(x.codigo)+' · '+plain(x.percent.toFixed(1).replace('.',','))+
   '% do saldo inicial retirado · final '+num(x.fim)+' '+plain(x.unidade)+'</span></div>').join('');

  // Documentos de fornecedores nao equivalem a movimentacoes de entrada.
  // Resumo derivado dos registros do dia, sem modificar estoques ou historicos.
  const receiptDocs=Array.isArray(model.receipts)?model.receipts:[];
  const receiptRows=Array.isArray(model.receiptRows)?model.receiptRows:[];
  const pending=x=>!!x.semCadastro||x.statusEntrada==='PENDENTE_CADASTRO'||!String(x.codigo||'').trim();
  const pendingCount=receiptRows.filter(pending).length;
  const linkedCount=receiptRows.filter(x=>x.entradaConfirmada).length;
  const rxMetric=(label,value)=>'<div class="nt-deep-rx-metric"><small>'+plain(label)+
   '</small><strong>'+num(value)+'</strong></div>';
  const receiptSummaries=receiptDocs.slice(0,3).map(r=>{
   const rows=receiptRows.filter(x=>String(x.numero||'')===String(r.numero||''));
   const awaiting=rows.filter(pending).length;
   const linked=rows.filter(x=>x.entradaConfirmada).length;
   const review=Math.max(0,rows.length-awaiting-linked);
   const state=[linked?linked+' vinculada(s)':'',awaiting?awaiting+' aguard. cadastro':'',
    review?review+' a conferir':''].filter(Boolean).join(' · ')||'Sem itens';
   return '<div class="nt-deep-rx-row"><b>'+plain(r.fornecedor||'Fornecedor não informado')+
    '</b><span>'+num(rows.length)+' linha(s)</span><em>'+plain(state)+'</em></div>';
  }).join('');
  const receiptBox='<div class="nt-deep-rx">'+
   '<div><h2>CONTROLE DE RECEBIMENTOS</h2>'+
   '<p class="nt-deep-rx-desc">Documentação e entradas efetivas são indicadores diferentes.</p>'+
   '<div class="nt-deep-rx-metrics">'+
    rxMetric('RECEBIMENTOS DOCUMENTADOS',receiptDocs.length)+
    rxMetric('ENTRADAS NO ESTOQUE',stockIn)+
    rxMetric('LINHAS DE MATERIAIS',receiptRows.length)+
    rxMetric('AGUARDANDO CADASTRO',pendingCount)+
   '</div></div><div><div class="nt-deep-rx-subhead">SITUAÇÃO DOS DOCUMENTOS NO DIA</div>'+
   (receiptSummaries||'<p class="nt-deep-rx-help">Nenhum recebimento documentado nesta data.</p>')+
   (receiptDocs.length>3?'<p class="nt-deep-rx-help">Outros '+num(receiptDocs.length-3)+
    ' recebimento(s) constam no relatório de recebimentos.</p>':'')+
   '<p class="nt-deep-rx-help">'+num(linkedCount)+
   ' linha(s) com vínculo confirmado. Materiais sem cadastro não entram automaticamente no estoque.'+
   '</p></div></div>';
  const pageTwo='<div class="nt-di-eyebrow">ANÁLISE DETALHADA · '+plain(ntDate(date))+'</div>'+
   metrics([
    ['SALDOS ZERADOS APÓS SAÍDA',zero.length],
    ['CONSUMO ≥ 50% DO INICIAL',pressure.length],
    ['DIVERGÊNCIAS DE SALDO',notReconciled],
    ['LINHAS RECEBIDAS',Number(model.totals?.receiptLines)||0]
   ])+
   '<div class="nt-deep-columns">'+
    '<div class="nt-deep-panel"><h2>CONSUMO POR UNIDADE DE MEDIDA</h2>'+
     '<p>Totais separados: não somar unidades incompatíveis.</p>'+
     '<div class="nt-deep-unitlist">'+(groupRows||blank)+'</div>'+
     (groups.length>6?'<p class="nt-deep-muted">Outras '+(groups.length-6)+' unidade(s) também foram movimentadas.</p>':'')+
     '<h2 class="nt-deep-subhead">OUTRAS FAIXAS DE CONSUMO</h2>'+
     (otherCharts||moreMain||'<p class="nt-deep-muted">Todas as retiradas com unidade conhecida foram da mesma medida.</p>')+
     (others.length>2?'<p class="nt-deep-muted">Outras unidades adicionais detalhadas no cadastro e nas movimentações.</p>':'')+
     (otherCharts&&moreMain?moreMain:'')+
     (missing.length?'<div class="nt-deep-muted">'+missing.length+

/* Reposição: páginas equivalentes ao PDF individual; somente documentos
   efetivamente emitidos no histórico na data local do relatório. */
function ntGeneralReposPages(repos,date,marker,catalog,consultadoEm){
 const pages=[];
 const byCode=new Map((Array.isArray(catalog)?catalog:[]).map(m=>[String(m.codigo??''),m]));
 const consultedLabel=ntReposQueryDate(consultadoEm);
 for(const doc of (repos||[])){
  const rows=Array.isArray(doc.itens)?doc.itens:[];
  if(!rows.length)continue;
  let chunks=[],group=[],used=0;
  for(const item of rows){
   const weight=1+Math.max(0,Math.ceil(String(item.nome||'').length/47)-1)*.7;
   // Paisagem A4: limite conservador de linhas para manter a tabela e o rodapé na mesma folha.
   if(group.length&&used+weight>15.5){chunks.push(group);group=[];used=0}
   group.push(item);used+=weight;
  }
  if(group.length)chunks.push(group);
  chunks.forEach((part,i)=>{
   const first=i===0,last=i===chunks.length-1;
   const meta=first?'<div class="nt-day-repos-meta"><div><small>DATA E HORA</small><strong>'+ntPlain(ntDate(date))+' · '+ntPlain(ntRepoLocalHour(doc))+'</strong></div>'+

    '<div><small>SOLICITADO POR</small><strong>Almoxarifado</strong></div></div>':'';
   const intro='<div class="sectionline"><span>MATERIAIS PARA AQUISIÇÃO'+(first?'':' · CONTINUAÇÃO')+'</span><span>'+rows.length+' '+(rows.length===1?'ITEM':'ITENS')+'</span></div>';
   const table=ntTable(['CÓDIGO','MATERIAL','UN.','SALDO ATUAL'],[18,52,10,20],part.map(x=>{
    const current=ntReposActualByCode(x.codigo,byCode);
    return [String(x.codigo||''),String(x.nome||''),current.unidade,
     current.saldo==null?'—':fmt(current.saldo)];
   }));
   const dataNote='<p class="note nt-repos-stock-date"><b>Saldo atual e unidade:</b> consultados no Firebase em '+ntPlain(consultedLabel)+'. O saldo não representa necessariamente o saldo da data original da solicitação.</p>';
   const end=last?'<div class="sectionline"><span>ENCAMINHAMENTO</span></div>'+
    '<p class="note">Solicita-se análise para aquisição dos materiais relacionados. A definição das quantidades e a autorização de compra cabem à chefia e ao setor de Compras. Este registro não comprova compra ou recebimento.</p>':'';
   pages.push('<section class="page landscape nt-general-repos">'+
    ntTop('RELATÓRIO DE REPOSIÇÃO DE MATERIAIS','Relação de materiais solicitados para análise e aquisição.',date)+intro+meta+table+dataNote+end+marker+'</section>');
  });
 }
 return pages;
}

function ntGeneralDayPDF(model){
 const date=model.date,pages=[],marker='__NT_GERAL_RODAPE__';
 const empty=message=>'<p class="note" style="margin-top:8mm">'+ntPlain(message)+'</p>';
 function page(title,subtitle,body,wide,extraClass=''){
  pages.push('<section class="page '+(wide?'landscape':'portrait')+(extraClass?' '+extraClass:'')+'">'+ntTop(title,subtitle,date)+body+marker+'</section>');
 }
 const totals=model.totals;
 const highlights=[
  ['MÁQUINAS CONCLUÍDAS',fmt(totals.machines)],
  ['RETIRADAS',String(totals.requestsLines)],
  ['RECEBIMENTOS',String(totals.receipts)],
  ['REPOSIÇÕES SOLICITADAS',String(totals.reposReports||0)],
  ['MATERIAIS DISTINTOS',String(totals.stockItems)]
 ];
 const blocks='<div class="metrics">'+highlights.map(x=>'<div class="metric"><small>'+ntPlain(x[0])+'</small><strong>'+ntPlain(x[1])+'</strong></div>').join('')+'</div>';
 const lines=[
  ['PRODUÇÃO',fmt(totals.machines)+' máquina(s) concluída(s).'],
  ['MATERIAIS ENTREGUES',totals.requestsLines+' retirada(s) realizadas de '+totals.requestsMaterials+' material(is) diferente(s).'],
  ['RECEBIMENTOS',totals.receipts+' entrega(s) documentada(s), envolvendo '+totals.receiptLines+' linha(s) de material.'],
  ['REPOSIÇÕES',(totals.reposReports||0)
    ?totals.reposReports+' solicitação(ões) de reposição emitida(s), com '+totals.reposLines+' linha(s) de material. Confira os documentos após o recebimento.'
    :'Nenhuma solicitação de reposição emitida nesta data. Isso não significa que não haja materiais precisando de compra.'],
  ['MOVIMENTAÇÕES DO ESTOQUE',(totals.requestsLines+totals.stockEntries+totals.returnLines)+' operações confirmadas: '+totals.requestsLines+' retirada(s), '+totals.stockEntries+' entrada(s) e '+totals.returnLines+' devolução(ões), envolvendo '+totals.stockItems+' material(is) distinto(s).']
 ];
 if(totals.cancelledMoves)lines.push(['RETIFICAÇÕES OPERACIONAIS',totals.cancelledMoves+' movimentação(ões) excluída(s) das contagens após estorno de estoque auditado. Os saldos históricos das demais operações permanecem registrados como eram no dia.']);
 const executive='<div class="nt-day-summary-rows">'+lines.map(([label,message])=>
  '<div class="nt-day-summary-row"><strong>'+ntPlain(label)+'</strong><span>'+ntPlain(message)+'</span></div>').join('')+'</div>';
 const alarms=[];
 if(totals.receiptDifferences>0)alarms.push(totals.receiptDifferences+' diferença(s) entre NF e recebimento.');
 if(totals.pendingCodes>0)alarms.push(totals.pendingCodes+' item(ns) recebido(s) sem cadastro.');
 if(totals.stockNotReconciled>0)alarms.push(totals.stockNotReconciled+' saldo(s) com divergência histórica a conferir.');
 const concerns=alarms.length?'<div class="nt-day-summary-warn"><strong>PONTOS DE ATENÇÃO</strong><p>'+alarms.map(ntPlain).join(' ')+'</p></div>':'';
 const readout='<div class="sectionline"><span>PANORAMA DO DIA</span><span>'+ntPlain(ntDate(date))+'</span></div>'+
 executive+concerns+
 '<p class="note">Este documento reúne os registros do dia selecionado. Solicitação de reposição não significa compra ou recebimento; o saldo depende das movimentações oficiais.</p>';
 page('RELATÓRIO GERAL DO DIA · '+ntDate(date),'Referente ao dia '+ntDate(date)+' · Produção, saídas, recebimentos e reposições.',blocks+readout,true,'nt-general-summary');

 // A inteligência diária é incluída somente na última folha, após os saldos.
 if(model.machineRows?.length)pages.push(...ntGeneralProductionPages(model.machineRows,date,marker));
 if(model.requests?.length)pages.push(...ntGeneralRequestsPages(model,date,marker));
 // Uma única seção com o MESMO design do relatório próprio de Recebimento.
 // Dados documentais aparecem aqui; os saldos permanecem na seção de Estoque.
 // A conferência por código segue disponível no Excel, sem duplicar no PDF.
 const receiptDocs=model.receipts;
 if(receiptDocs.length){
  pages.push(...ntGeneralReceiptPagesAudited(receiptDocs,model.receiptRows,date,marker));
 }
 if(model.repos?.length)pages.push(...ntGeneralReposPages(model.repos,date,marker,model.materialCatalog,model.catalogConsultedAt));
 if(model.stockRows?.length)pages.push(...ntGeneralStockPages(model.stockRows,date,marker));
 if(model.stockRows?.length||model.requests?.length||model.receipts?.length)pages.push(...ntGeneralDailyIntelligencePages(model,date,marker));
 return ntHtml('Relatório Geral do Dia · '+ntDate(date),pages.map((p,i)=>p.replace(marker,ntFooter(i+1,pages.length))));
}

/* Conferência preventiva antes de emitir: não altera estoque nem esconde problemas. */
function ntReportWarnings(model,scope='general'){
 const warnings=[];
 if(scope==='general'||scope==='production'){
  const seen=new Set(),duplicates=new Set();
  for(const row of model.machineRows||[]){
   const code=String(row.codigoMaquina||'').trim().toUpperCase();
   const lot=String(row.lote||'').trim().toUpperCase();
   if(!code||code==='—'||!lot||lot==='—'){warnings.push('Há produção sem código ou lote informado.');continue}
   const key=code+'|'+lot;
   if(seen.has(key))duplicates.add(code+' / '+lot);
   seen.add(key);
  }
  if(duplicates.size)warnings.push('Produção com código e lote repetidos: '+[...duplicates].slice(0,4).join(', ')+'.');
 }
 if(scope==='general'||scope==='receipt'){
  const unlinked=(model.receiptRows||[]).filter(x=>x.statusEntrada==='ESTOQUE_ATUALIZADO'&&!x.entradaConfirmada).length;
  if(unlinked)warnings.push(unlinked+' linha(s) de recebimento com entrada no estoque sem vínculo individual confirmado.');
 }
 if((scope==='general'||scope==='stock')&&Number(model.totals?.cancelledMoves||0)>0)
  warnings.push(model.totals.cancelledMoves+' movimento(s) estornado(s) nesta data. As contagens foram retificadas, mas os saldos históricos antes/depois dos outros lançamentos não foram reescritos.');
 if(scope==='general'||scope==='stock'){
  const mismatched=(model.stockRows||[]).filter(x=>x.validar).length;
  if(mismatched)warnings.push(mismatched+' material(is) com saldo histórico a conferir.');
 }
 return [...new Set(warnings)];
}

   Não grava nada no ato de VERIFICAR. O ajuste errado já recuperou o saldo
   físico do código 080100326; não cria entrada/devolução duplicada.
   Se as evidências divergirem do histórico esperado, BLOQUEIA sem gravar. */
const NT_ARM_FIX={dia:'2026-10-27',errado:'080100326',certo:'080100190',quantidade:30,
 auditoria:'RETIFICACAO_PEDIDO_20261027_080100326_080100190'};
/* Retificação sem alterar movimentos antigos: os registros seguem no histórico.
   O movimento de saída novo tem ID determinístico e contém os IDs retificados na
   observação. Isso permite reconciliar os PDFs com trilha auditável, inclusive se
   as regras do Firestore não permitirem UPDATE em movimentos passados. */
function ntArmEffectiveMovements(movements){
 const rows=Array.isArray(movements)?movements:[];
 const fix=NT_ARM_FIX,marker=rows.find(m=>String(m.id||'')===fix.auditoria&&
  String(m.codigo||'')===fix.certo&&m.tipo==='SAIDA'&&Number(m.quantidade)===fix.quantidade&&
  String(m.dia||'')===fix.dia&&String(m.observacao||'').startsWith(fix.auditoria+'|'));
 if(!marker)return rows;
 const pieces=String(marker.observacao).split('|');
 if(pieces.length<4||!pieces[1]||!pieces[2]||pieces[1]===pieces[2])return rows;
 const omit=new Set([pieces[1],pieces[2]]);
 return rows.filter(m=>!omit.has(String(m.id||'')));
}
