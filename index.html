/* Inventário: apresentação compacta; somente leitura, preservando o tema aprovado */

/* Filtros sob demanda: a lista só é expandida quando solicitada */
.inventory-filter-panel{margin-top:11px;border-top:1px solid #33536e;padding-top:10px}
.inventory-filter-panel summary{color:#d8ecff;cursor:pointer;font-weight:650;display:flex;align-items:center;justify-content:space-between;gap:12px;list-style:none;min-height:29px}

.inventory-filter-panel[open] summary::before{content:'▾'}
.inventory-filter-panel summary .filter-title{margin-right:auto}
.inventory-filter-panel summary .filter-count{color:#a9c0d6;font-size:.77rem;font-weight:450;white-space:nowrap}
.inventory-filter-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0 2px}
.inventory-filter-grid .field{margin:0}
.inventory-filter-grid label{font-size:.82rem}
.inventory-filter-grid select{background:#071d33;color:#ebf5ff;border:1px solid #4b718f;border-radius:12px;padding:10px;width:100%;min-width:0;outline:none}
.inventory-filter-grid select:focus{border-color:#61b1ff}
/* Resumo do inventário propositalmente reduzido para abrir espaço aos materiais */
.inventory-summary{padding:12px 15px;margin-bottom:12px}
.inventory-summary .summary-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.inventory-summary .summary-head b{font-size:.96rem}
.inventory-summary .summary-head .summary-percent{color:#acd9ff;font-variant-numeric:tabular-nums;white-space:nowrap}
.inventory-meter{height:7px;margin:8px 0 7px;background:#071d33;border:1px solid #355675;border-radius:20px;overflow:hidden}
.inventory-meter-fill{height:100%;background:#3a97eb;border-radius:20px;transition:width .15s linear}
.inventory-mini-stats{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 10px;font-size:.81rem}
.inventory-mini-stats span:last-child{white-space:nowrap}
.inventory-details{margin-top:10px;border-top:1px solid #33536e;padding-top:10px}
.inventory-details summary{color:#c2dcf4;cursor:pointer;font-weight:600;font-size:.9rem;list-style-position:inside}
.inventory-rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 15px;margin-top:10px}
.inventory-rows .inventory-meter{height:6px;margin:5px 0 0}
.inventory-line{font-size:.82rem;color:#c2d7e9}
.inventory-line .line-count{float:right;color:#a9c0d6}

@media(max-width:570px){.inventory-filter-grid{grid-template-columns:1fr;gap:8px}.inventory-rows{grid-template-columns:1fr}.inventory-summary .summary-head{align-items:center}.inventory-summary{padding:12px 13px}}

.nt-qr-modal-shell{display:flex;flex-direction:column;width:100%;max-height:calc(92vh - 24px);min-height:0}
.nt-qr-modal-head{flex:none;padding:17px 20px 8px}

.nt-repos-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}
.nt-repos-choices{border:1px solid #385b78;border-radius:12px;min-height:100px;max-height:45vh;overflow:auto;overscroll-behavior:contain}
.nt-repos-line{display:grid;grid-template-columns:24px minmax(0,1fr);align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid #385b784b}
.nt-repos-line:last-child{border-bottom:0}
.nt-repos-line label{cursor:pointer;min-width:0}
.nt-repos-line input[type=checkbox]{width:19px;height:19px;accent-color:#45b5f8}
.nt-repos-code{display:block;color:#a9c5dd;font-size:.8rem;margin-top:3px}
.nt-repos-footer{position:sticky;bottom:0;z-index:2;background:#102b48;padding:12px 0 2px;border-top:1px solid #466b85;margin-top:12px}

/* AJUSTE PONTUAL 2026-10-22: alinhamento da navegacao inferior em celular.
   Apenas CSS de apresentacao. Nao altera Firebase, estoque nem logica de negocio. */
@media (max-width: 700px) {
  #navigation.bar {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 0;
    overflow-x: hidden;
    padding-left: 4px;
    padding-right: 4px;
  }
  #navigation.bar button {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: initial;
    min-width: 0;
    min-height: 58px;
    padding: 8px 0 9px;
    font-size: clamp(9px, 2.7vw, 12px);
    line-height: 1.22;
    text-align: center;
    white-space: nowrap;
  }
  #navigation.bar button span {
    display: block;
    font-size: 1.18rem;
    line-height: 1.2;
    margin-bottom: 4px;
  }
  #navigation.bar button[data-go="fechamento"] {
    font-size: clamp(9px, 2.45vw, 11px);
  }
}

/* Central de Relatórios: apresentação independente do estoque. */
.nt-rc-head{margin-bottom:17px}.nt-rc-head h2{font-size:1.52rem;letter-spacing:-.3px;margin:0 0 5px}
.nt-rc-eyebrow{color:#78cddc;text-transform:uppercase;font-size:.72rem;letter-spacing:1.4px;font-weight:750;margin-bottom:6px}
.nt-rc-date{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:17px}.nt-rc-date .field{margin:0}
.nt-rc-group{font-size:.86rem;text-transform:uppercase;letter-spacing:.8px;color:#b5d3e8;margin:17px 0 10px;font-weight:750}
.nt-rc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.nt-rc-card{background:linear-gradient(120deg,#143456,#102b48);border:1px solid #385b78;border-radius:15px;padding:15px;min-width:0;display:flex;flex-direction:column;gap:6px}
.nt-rc-card h3{font-size:1rem;font-weight:730;line-height:1.2}.nt-rc-card p{font-size:.79rem;color:#b3cadf;line-height:1.48;flex:1}
.nt-rc-card .buttons{margin-top:8px;display:flex;flex-direction:column;gap:7px}.nt-rc-card .btn{font-size:.83rem;padding:10px 8px;width:100%;flex:none}
.nt-rc-flag{font-size:.7rem;letter-spacing:.3px;color:#81d6c5;font-weight:600}
.nt-rc-note{background:#102b48;border:1px solid #385b78;border-radius:13px;padding:13px;margin-top:17px;color:#bcd5e9;font-size:.8rem;line-height:1.5}
.nt-rc-lines{margin-top:12px;border-top:1px solid #33536e;padding-top:12px}.nt-rc-lines details{border-bottom:1px solid #33536e;padding:9px 0}.nt-rc-lines summary{cursor:pointer;font-weight:700}
@media(max-width:560px){.nt-rc-grid{grid-template-columns:1fr}.nt-rc-card{padding:14px}.nt-rc-date{grid-template-columns:1fr}}

/* Logomarca original New Termisa: apenas a área da marca; interface preservada. */
/* Moldura da marca: mesmas proporcoes do emblema de referencia, sem mudar o cabeçalho. */
.mark{display:flex;align-items:center;justify-content:center;background:#163B5B;border:2px solid #365574;overflow:hidden;width:60px;height:60px;min-width:60px;flex:0 0 60px;padding:0;border-radius:20px}
.mark img{display:block;flex:0 0 auto;width:78%;height:auto;max-height:92%;object-fit:contain;object-position:center;transform:none}
header .brand{min-width:0}
header .brand>div:last-child{min-width:0}
/* Distância idêntica da borda aos três botões de movimentação. */
#moveForm.card,.nt-receipt-movement{margin-top:14px}

/* Histórico de movimentações: seletor de data e menu compacto por lançamento. */
.nt-history-controls{display:flex;align-items:flex-end;gap:10px;margin:14px 0 12px;flex-wrap:wrap}
.nt-history-controls label{display:block;color:#bad0e4;font-size:.81rem;font-weight:650;margin-bottom:5px}
.nt-history-controls input[type=date]{color:#f4faff;background:#0a223a;border:1px solid #406381;border-radius:12px;padding:11px 13px;min-height:45px;max-width:230px;color-scheme:dark;width:100%}

.nt-hist-row{align-items:center!important;gap:8px!important;padding:12px 13px!important;overflow:visible}

.nt-hist-actions>summary::-webkit-details-marker{display:none}
.nt-hist-actions[open]>summary,.nt-hist-actions>summary:hover{background:#28618b;border-color:#69a3d4}
.nt-hist-menu{position:absolute;right:0;top:39px;z-index:40;min-width:174px;background:#0c2944;border:1px solid #497da7;box-shadow:0 13px 28px #00172fbb;border-radius:12px;padding:5px}
.nt-hist-menu button{display:block;width:100%;padding:10px 12px;border:0;border-radius:8px;background:transparent;color:#f2f8ff;text-align:left;font-size:.83rem;font-weight:650}
.nt-hist-menu button:hover,.nt-hist-menu button:focus{background:#214d70}
.nt-hist-row:nth-last-child(-n+2) .nt-hist-menu{top:auto;bottom:39px}
.nt-hist-menu .nt-hist-delete{color:#ffc1c5}
.nt-hist-cancelled{opacity:.72}
.nt-hist-cancelled .nt-hist-state{display:inline-block;margin-top:6px;color:#ffd59a;font-size:.76rem;font-weight:750}
@media(max-width:450px){.nt-history-controls input[type=date]{max-width:100%}.nt-hist-menu{right:0}.nt-hist-right{min-width:42px}}

/* Ação discreta no rodapé: mantém os formulários como foco principal. */
.nt-history-shortcut{display:flex;justify-content:flex-end;margin:5px 2px 17px}
.nt-history-shortcut-button{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:7px 11px;min-height:35px;width:auto;max-width:100%;border:1px solid #3e6482;border-radius:10px;background:#123552;color:#bcd3e7;font-size:.78rem;font-weight:650;line-height:1.1;letter-spacing:.005em}
.nt-history-shortcut-button:focus-visible,.nt-history-shortcut-button:hover{background:#1d486a;border-color:#70a5ce;color:#f5fbff}
.nt-history-shortcut-icon{font-size:1.12rem;line-height:1;color:#9ecdf0}
</style></head>

function loader(x){busy=x;$('busy').classList.toggle('show',x)}function panel(x){$('modal').innerHTML=x;$('modalwrap').classList.add('show')}function close(){ $('modalwrap').classList.remove('show');ntClearTemporarySelections() }
function ntClearTemporarySelections(){ntLabelCodes.clear();ntReposSelected.clear()}
function isReady(){if(!user)throw Error('Entre na sua conta primeiro.');if(!navigator.onLine||!serverReady)throw Error('Sem conexão confirmada com o Firebase. Não foi salvo.');if(busy)throw Error('Já existe uma operação em andamento. Aguarde.')}
async function consultarSaldosServidor(codigos, esperados={}){
  const unicos=[...new Set(codigos.map(String))];
  if(!unicos.length)return;
  const respostas=[];
  for(let inicio=0;inicio<unicos.length;inicio+=30){
    const grupo=unicos.slice(inicio,inicio+30);
    const q=query(collection(db,'nt_web_materiais'),where('codigo','in',grupo));
    const consulta=await getDocsFromServer(q);
    for(const registro of consulta.docs)respostas.push(registro.data());
  }
  if(respostas.length!==unicos.length)throw Error('Alguns materiais não foram encontrados na verificação de leitura.');
  for(const registro of respostas){
    const esperado=esperados[String(registro.codigo)];
    if(esperado && esperado.quantidade!==undefined && Math.abs(Number(registro.quantidade)-Number(esperado.quantidade))>0.00001)
      throw Error('Quantidade ainda não confirmada na nuvem: '+registro.codigo);
    if(esperado && esperado.conferido!==undefined && registro.conferido!==esperado.conferido)
      throw Error('Conferência ainda não confirmada na nuvem: '+registro.codigo);
  }
  for(const registro of respostas){
    const i=mats.findIndex(r=>String(r.codigo)===String(registro.codigo));
    if(i>=0)mats[i]=registro;else mats.push(registro);
  }
  mats.sort((a,b)=>String(a.nome).localeCompare(String(b.nome),'pt-BR'));
  cloudOk=true;serverReady=true;status('● Sincronizado',true);draw();
}
async function execute(fn,codigos=[],esperados={}){
  let gravado=false;
  try{
    isReady();loader(true);await fn();gravado=true;
    await consultarSaldosServidor(codigos,esperados);
    notice(codigos.length?'Dados atualizados e confirmados no Firebase!':'Gravação confirmada no Firebase!');
    return true;
  }catch(e){
    notice((gravado?'Dados gravados, mas ainda não foi possível confirmar a atualização da tela. NÃO repita a operação. Atualize a página e verifique o histórico.':'Gravação não confirmada: '+(e.message||'erro desconhecido')),true);
    return false;
  }finally{loader(false)}
}

function parseConfig(str){let s=str.trim();let ob;if(s.startsWith('{')){try{ob=JSON.parse(s)}catch(_){ /* formulário aceita também objeto JS copiado do console */ }}if(!ob){let p={};for(const k of ['apiKey','authDomain','projectId','appId','messagingSenderId','storageBucket','measurementId']){const re=new RegExp('(?:["\\\']?'+k+'["\\\']?)\\s*:\\s*["\\\']([^"\\\']+)["\\\']');const m=s.match(re);if(m)p[k]=m[1]}ob=p}if(!ob.apiKey||!ob.projectId||!ob.appId||!ob.authDomain)throw Error('Copie toda a configuração Web (apiKey, authDomain, projectId e appId).');return ob}

function normMaterial(s){return String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function filterMaterialSelect(id){
  const search=$(id+'Search'),select=$(id),hint=$(id+'SearchHint');if(!search||!select)return;
  const terms=normMaterial(search.value).split(/\s+/).filter(Boolean);
  const found=terms.length?mats.filter(x=>{const text=normMaterial([x.codigo,x.nome,x.rua,x.posicao,`${x.rua||''}-${x.posicao||''}`].join(' '));return terms.every(t=>text.includes(t))}):mats;
  const oldValue=select.value;
  select.innerHTML=`<option value="">${found.length?'Escolha um dos resultados…':'Nenhum material encontrado'}</option>`+found.slice(0,80).map(x=>`<option value="${esc(x.codigo)}">${esc(x.codigo)} · ${esc(x.nome)}</option>`).join('');
  if(oldValue&&found.some(x=>String(x.codigo)===oldValue))select.value=oldValue;
  if(hint)hint.textContent=found.length?`${found.length} encontrado(s)${found.length>80?' · exibindo os primeiros 80; refine a busca':''}. Toque na lista para escolher.`:'Nenhum material encontrado. Tente outro trecho do nome ou código.';
  if(id==='moveCode'&&!select.value&&$('stockHint'))$('stockHint').textContent='Selecione o material na lista filtrada.';
}

/* Histórico por data, consultando o Firebase; ações discretas no fim de cada linha. */
let ntHistoryRequest=0;
const ntHistoryLabels={todos:'movimentações',pedido:'pedidos',retirada:'retiradas',entrada:'entradas',devolucao:'devoluções'};
let ntHistoryScope='todos';
function ntHistoryNormalizeScope(scope){return Object.prototype.hasOwnProperty.call(ntHistoryLabels,scope)?scope:'todos'}
function ntHistoryIsPedidoOriginal(m){
 return String(m.tipo||'')==='SAIDA'&&(
  ['PEDIDO','SEPARACAO_PEDIDO'].includes(String(m.origem||'').toUpperCase())||
  /^pedido separado(?:\b|$)/i.test(String(m.observacao||'').trim())
 );
}
function ntHistoryMatchesScope(m,scope,pedidoIds){
 const type=String(m.tipo||''),isPedido=pedidoIds.has(String(m.id||''));
 if(scope==='pedido')return type==='SAIDA'&&isPedido;
 if(scope==='retirada')return type==='SAIDA'&&!isPedido;
 if(scope==='entrada')return type==='ENTRADA';
 if(scope==='devolucao')return type==='DEVOLUCAO';
 return true;
}
async function ntShowTodayMovements(selected=ntMetaDate||dateFilter||day(),scope=ntHistoryScope){
 if(!user||!serverReady||!navigator.onLine)throw Error('Sem conexão confirmada com o Firebase.');
 const date=/^\d{4}-\d{2}-\d{2}$/.test(String(selected))&&selected<=day()?selected:day();
 const currentScope=ntHistoryNormalizeScope(scope);
 ntMetaDate=date;ntHistoryScope=currentScope;
 const request=++ntHistoryRequest;
 const heading='Histórico de '+ntHistoryLabels[currentScope];
 const controls='<div class="nt-history-controls"><div><label for="ntHistoryDate">Selecionar o dia</label>'+
  '<input id="ntHistoryDate" aria-label="Escolher data do histórico" type="date" max="'+esc(day())+'" value="'+esc(date)+'"></div>'+
  '<p class="nt-hint">Escolha uma data para consultar somente '+(currentScope==='todos'?'os lançamentos':ntHistoryLabels[currentScope])+' daquele dia.</p></div>';
 panel('<h2>'+heading+'</h2>'+controls+'<p class="small">Consultando registros do Firebase...</p>');
 const [snap,edits]=await Promise.all([
  getDocsFromServer(query(collection(db,'nt_web_movimentos'),where('dia','==',date))),ntMetaRead()
 ]);
 if(request!==ntHistoryRequest)return;
 const original=snap.docs.map(d=>({...d.data(),id:d.id}));
 const pedidoIds=new Set(original.filter(ntHistoryIsPedidoOriginal).map(m=>String(m.id)));
 const entries=ntMetaMoves(original,edits)
  .filter(m=>(!m.anulado||m.estornado)&&ntHistoryMatchesScope(m,currentScope,pedidoIds))
  .sort((a,b)=>ntDaySortMovement(b,a));
 const list=entries.map(m=>{
  const voided=!!m.estornado;
  const editable=!voided&&['SAIDA','ENTRADA','DEVOLUCAO'].includes(m.tipo)&&!m.reciboId&&m.origem!=='RECEBIMENTO_INTEGRADO';
  const linked=!voided&&m.tipo==='ENTRADA'&&(m.reciboId||m.origem==='RECEBIMENTO_INTEGRADO');
  const actions=editable?'<details class="nt-hist-actions"><summary aria-label="Opções de '+esc(m.nome||m.codigo)+'" title="Editar ou excluir">⋮</summary>'+
   '<div class="nt-hist-menu"><button type="button" data-action="nt-meta-edit" data-code="'+esc(m.id)+'">✎ Editar</button>'+
   '<button type="button" class="nt-hist-delete" data-action="nt-cancel-move" data-code="'+esc(m.id)+'">Excluir item</button></div></details>':
   (linked?'<span class="small" title="Corrija esta entrada no Histórico de Recebimentos">NF</span>':'');
  return '<div class="item nt-hist-row'+(voided?' nt-hist-cancelled':'')+'"><div class="nt-hist-info"><strong>'+esc(m.nome||m.codigo||'Material')+'</strong>'+
   '<p class="small">'+esc(m.tipo||'')+' · '+esc(m.codigo||'—')+' · '+esc(m.solicitante||m.operador||'')+
   (m.pedido?' · '+esc(m.pedido):'')+' · '+esc(formatDate(m))+'</p>'+
   (voided?'<span class="nt-hist-state">Excluído e estornado · histórico preservado</span>':'')+
   '</div><div class="nt-hist-right"><b class="nt-hist-qty '+(Number(m.delta)<0?'red':'green')+'">'+
   (Number(m.delta)>0?'+':'')+esc(fmt(Number(m.delta)||0))+'</b>'+actions+'</div></div>';
 }).join('');
 panel('<h2>'+heading+'</h2>'+controls+
  '<p class="small" style="margin-bottom:12px"><strong>'+entries.length+' lançamento(s)</strong> em '+esc(ntDate(date))+'. As exclusões exigem estorno auditado.</p>'+
  '<div class="list" style="max-height:56vh;overflow-y:auto;padding-right:3px">'+(list||'<div class="small">Nenhum registro de '+ntHistoryLabels[currentScope]+' encontrado neste dia.</div>')+'</div>'+
  '<div class="buttons" style="margin-top:12px"><button class="btn ghost" data-action="close">Fechar</button></div>');
}
function inventoryPct(conferidos,total){return total?Math.round(conferidos*1000/total)/10:0}
function inventoryBar(conferidos,total){const pct=inventoryPct(conferidos,total);return `<div class="inventory-meter" role="progressbar" aria-label="Progresso da conferência" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><div class="inventory-meter-fill" style="width:${pct}%"></div></div>`}
function missingLocation(x){return !String(x.rua||'').trim()||!String(x.posicao||'').trim()}
function inventorySummary(filterMarkup=''){
  const total=mats.length,done=mats.filter(x=>!!x.conferido).length;
  const area=[...'ABCDEFGH'].map(street=>({name:'Rua '+street,items:mats.filter(x=>x.rua===street&&!missingLocation(x))}));
  area.push({name:'Sem localização',items:mats.filter(missingLocation)});
  return `<div class="card inventory-summary"><div class="summary-head"><b>Inventário de materiais</b><b class="summary-percent">${inventoryPct(done,total).toLocaleString('pt-BR')}%</b></div>
  ${inventoryBar(done,total)}<div class="inventory-mini-stats small"><span>${done} conferidos · ${total-done} pendentes</span><span>${total} materiais</span></div>
  ${filterMarkup}
  <details class="inventory-details"><summary>Conferência por rua</summary><div class="inventory-rows">${area.map(a=>{const n=a.items.filter(x=>!!x.conferido).length;return `<div><div class="inventory-line"><span>${a.name}</span><span class="line-count">${n}/${a.items.length} · ${inventoryPct(n,a.items.length).toLocaleString('pt-BR')}%</span></div>${inventoryBar(n,a.items.length)}</div>`}).join('')}</div></details></div>`;
}

function ntLabelLocation(m) {
  if(!String(m.posicao??'').trim())return 'POSIÇÃO PENDENTE';
  return String(m.posicao).trim();
}
function ntLabelSelectPanel() {
  if(!user || !cloudOk){notice('Aguarde os materiais serem carregados do Firebase.',true);return;}
  // A cada abertura de etiquetas, iniciar uma nova seleção vazia.
  ntLabelCodes.clear();
  const sorted=[...mats].sort((a,b)=>String(a.nome||'').localeCompare(String(b.nome||''),'pt-BR'));
  const rows=sorted.map(m=>{
    const code=String(m.codigo),loc=ntLabelLocation(m);
    return '<label data-label-entry="'+esc(normMaterial(code+' '+m.nome+' '+loc))+'" style="display:flex;gap:9px;align-items:flex-start;padding:9px 4px;border-bottom:1px solid #345775;cursor:pointer">'+
      '<input data-label-toggle="'+esc(code)+'" type="checkbox" '+(ntLabelCodes.has(code)?'checked':'')+' style="margin-top:4px;width:18px;height:18px;accent-color:#3496f5;flex:none">'+
      '<span style="min-width:0"><b>'+esc(m.nome)+'</b><span class="small" style="display:block">'+esc(code)+' · '+esc(loc)+'</span></span></label>';
  }).join('');
  panel('<div class="nt-qr-modal-shell"><div class="nt-qr-modal-head"><h2>Etiquetas QR Code</h2><p class="small">Selecione os materiais para criar etiquetas com QR Code, posição numérica, código e nome completo. A rua permanece no cadastro do sistema.</p>'+
    '<div class="field"><label for="ntLabelSearch">Pesquisar materiais</label><input id="ntLabelSearch" type="search" placeholder="Digite nome, código ou posição" autocomplete="off"></div>'+
    '<div class="buttons"><button class="btn alt" type="button" data-action="nt-label-all">Marcar todos</button><button class="btn alt" type="button" data-action="nt-label-visible">Marcar filtrados</button><button class="btn ghost" type="button" data-action="nt-label-clear">Limpar</button></div>'+
    '<p id="ntLabelCount" class="small" style="margin:10px 0 5px"></p></div>'+
    '<div class="nt-qr-modal-list" aria-label="Materiais para etiquetar">'+rows+'</div>'+
    '<div class="nt-qr-modal-footer"><p class="small" style="margin:0 0 9px">Impressão em A4. O padrão já vem pronto e pode ser personalizado na prévia.</p>'+
    '<div class="buttons"><button class="btn" type="button" data-action="nt-label-print">Gerar etiquetas selecionadas</button><button class="btn ghost" type="button" data-action="close">Voltar</button></div></div></div>');
  ntRefreshLabelPanel();
}
function ntRefreshLabelPanel() {
  const terms=normMaterial($('ntLabelSearch')?.value||'').split(/\s+/).filter(Boolean);
  let visible=0;
  document.querySelectorAll('[data-label-entry]').forEach(el=>{
    const yes=terms.every(x=>el.dataset.labelEntry.includes(x));
    el.style.display=yes?'flex':'none';if(yes)visible++;
    const ch=el.querySelector('[data-label-toggle]');if(ch)ch.checked=ntLabelCodes.has(ch.dataset.labelToggle);
  });
  if($('ntLabelCount'))$('ntLabelCount').textContent=ntLabelCodes.size+' selecionado(s) de '+mats.length+' · '+visible+' visíveis';
}
function ntBatchLabelSelect(mode) {
  if(mode==='clear')ntLabelCodes.clear();
  if(mode==='all')mats.forEach(m=>ntLabelCodes.add(String(m.codigo)));
  if(mode==='visible')document.querySelectorAll('[data-label-entry]').forEach(el=>{
    if(el.style.display!=='none'){const ch=el.querySelector('[data-label-toggle]');if(ch)ntLabelCodes.add(ch.dataset.labelToggle)}
  });
  ntRefreshLabelPanel();
}

function ntPrintLabels(items) {
  if(!user||!cloudOk){notice('Aguarde a leitura do estoque no Firebase.',true);return;}
  if(!items.length){notice('Selecione pelo menos um material.',true);return;}
  const invalid=items.filter(m=>!(/^\d{9}$/.test(String(m.codigo||''))));
  if(invalid.length){notice('Código inválido para etiqueta: '+invalid[0].codigo+'. Confira o cadastro.',true);return;}
  const popup=window.open('','_blank');
  if(!popup){notice('O navegador bloqueou a janela. Permita pop-ups para abrir o modelador.',true);return;}
  const labelItems=items.map(m=>({codigo:String(m.codigo),nome:String(m.nome||'SEM DESCRIÇÃO'),posicao:String(m.posicao||'')}));
  labelItems.sort((a,b)=>{const na=Number(a.posicao),nb=Number(b.posicao);return (Number.isFinite(na)&&Number.isFinite(nb)?na-nb:0)||a.nome.localeCompare(b.nome,'pt-BR')});
  const data=JSON.stringify(labelItems).replace(/</g,'\\u003c');
  const runner='('+ntModelerBoot.toString()+')';

ue=\"63\"></div>\n    <div class=\"field\"><label for=\"columns\">Nº de colunas</label><select id=\"columns\"><option value=\"1\">1 coluna</option><option value=\"2\" selected>2 colunas</option><option value=\"3\">3 colunas</option></select></div>\n    <div class=\"field\"><label for=\"copies\">Cópias por material</label><input id=\"copies\" type=\"number\" value=\"1\" min=\"1\" max=\"10\" step=\"1\"></div>\n    <div class=\"field\"><label for=\"qrSize\">Tamanho do QR (mm)</label><input id=\"qrSize\" type=\"number\" value=\"36\" min=\"20\" max=\"75\" step=\"1\"></div>\n    <div class=\"field\"><label for=\"qrAlign\">Posição do QR</label><select id=\"qrAlign\"><option value=\"left\">À esquerda</option><option value=\"right\">À direita</option></select></div>\n   </div></fieldset>\n   <fieldset><legend>Campos da etiqueta</legend>\n    <label class=\"switch\"><input type=\"checkbox\" id=\"showPosition\" checked> Mostrar posição (só número)</label>\n    <label class=\"switch\"><input type=\"checkbox\" id=\"showCode\" checked> Mostrar código do material</label>\n    <label class=\"switch\"><input type=\"checkbox\" id=\"showName\" checked> Mostrar nome completo</label>\n    <label class=\"switch\"><input type=\"checkbox\" id=\"showLogo\" checked> Mostrar logo pequena</label>\n   </fieldset>\n   <fieldset><legend>Fonte e legibilidade</legend><div class=\"fields\">\n    <div class=\"field\"><label for=\"fontPosition\">Fonte posição (pt)</label><input type=\"number\" id=\"fontPosition\" min=\"12\" max=\"32\" value=\"19\"></div>\n    <div class=\"field\"><label for=\"fontCode\">Fonte código (pt)</label><input type=\"number\" id=\"fontCode\" min=\"10\" max=\"23\" value=\"13\"></div>\n    <div class=\"field span2\"><label for=\"fontName\">Fonte nome (pt)</label><input type=\"number\" id=\"fontName\" min=\"8\" max=\"20\" value=\"10.5\" step=\"0.5\"></div>\n   </div></fieldset>\n  </div>\n  <div id=\"warning\" class=\"alert\" role=\"alert\"></div>\n  <div class=\"sidebar-actions\ function ntModelerBoot(){
 'use strict';
 const $=id=>document.getElementById(id);
 const escapes={"&":"&amp;","<":"&lt;",">":"&gt;",'"':'&quot;',"'":"&#39;"};
 const esc=v=>String(v??'').replace(/[&<>"']/g,m=>escapes[m]);
 const defaults={width:95,height:63,columns:2,copies:1,qrSize:36,qrAlign:'left',fontPosition:19,fontCode:13,fontName:10.5,showPosition:true,showCode:true,showName:true,showLogo:true};
 const numbers=['width','height','columns','copies','qrSize','fontPosition','fontCode','fontName'];
 const toggles=['showPosition','showCode','showName','showLogo'];
 let pageNo=0, pageCount=0, activeTimer=null, lastOk=false, cachedQR=new Map(), warnings=0;
 const read=()=>{
  const o={};for(const k of numbers)o[k]=Number($(k).value);
  for(const k of toggles)o[k]=$(k).checked;
  o.qrAlign=$('qrAlign').value;return o;
 };
 const inRange=(value,low,high)=>Number.isFinite(value)&&value>=low&&value<=high;
 const configError=o=>{
  if(!inRange(o.width,55,194)||!inRange(o.height,48,130)||!inRange(o.qrSize,20,75)||!inRange(o.copies,1,10)||!Number.isInteger(o.copies))return 'Confira as dimensões, o tamanho do QR Code e a quantidade de cópias.';
  if(![1,2,3].includes(o.columns))return 'Escolha entre 1 e 3 colunas.';
  if(!inRange(o.fontPosition,12,32)||!inRange(o.fontCode,10,23)||!inRange(o.fontName,8,20))return 'Confira os tamanhos das fontes.';
  if(o.columns*o.width+(o.columns-1)*3>194+1e-6)return 'Não cabe no A4: reduza a largura ou a quantidade de colunas. A área útil do papel é 194 mm.';
  if(o.height>281)return 'A altura escolhida não cabe no A4.';
  if(o.columns>1 && o.width<69)return 'Para duas ou três colunas, a largura mínima recomendada é 69 mm para preservar a leitura.';
  return '';
 };
 const makeQR=code=>{
  if(cachedQR.has(code))return cachedQR.get(code);
  if(typeof window.NTQRCodeCore!=='function')throw new Error('Biblioteca QR offline não iniciou.');
  const qr=new window.NTQRCodeCore(-1,0);qr.addData(code);qr.make();
  const modules=qr.getModuleCount(),quiet=4,total=modules+quiet*2;
  let path='';for(let y=0;y<modules;y++)for(let x=0;x<modules;x++)if(qr.isDark(y,x))path+='M'+(x+quiet)+' '+(y+quiet)+'h1v1h-1z';
  const svg='<svg aria-label="QR Code do material '+esc(code)+'" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+total+' '+total+'"><rect width="'+total+'" height="'+total+'" fill="#fff"/><path fill="#000" d="'+path+'"/></svg>';
  cachedQR.set(code,svg);return svg;
 };
 const card=(m,o,qrMM,nameMM)=>{
  const loc=String(m.posicao||'').trim();
  const txtPos=loc && /^\d+$/.test(loc)?String(Number(loc)):loc||'PENDENTE';
  const pos= o.showPosition?'<div><div class="tag-key">POSIÇÃO</div><div class="tag-position'+(!loc?' pending':'')+'">'+esc(txtPos)+'</div></div>':'';
  const num= o.showCode?'<div><div class="tag-key">CÓDIGO DO MATERIAL</div><div class="tag-number">'+esc(m.codigo)+'</div></div>':'';
  const description= o.showName?'<div class="tag-name-section" style="--description-height:'+nameMM+'mm"><div class="tag-key">DESCRIÇÃO COMPLETA</div><div class="tag-name-text">'+esc(m.nome||'SEM DESCRIÇÃO')+'</div></div>':'';
  const logo=o.showLogo?'<span class="tag-logo" aria-label="New Termisa"></span>':'';
  return '<article class="tag" style="--card-w:'+o.width+'mm;--card-h:'+o.height+'mm;--qr-w:'+qrMM+'mm;--font-position:'+o.fontPosition+'pt;--font-code:'+o.fontCode+'pt;--font-name:'+o.fontName+'pt">'+
    '<div class="tag-header"><strong>CONTROLE DE MATERIAIS</strong>'+logo+'</div>'+
    '<div class="tag-main'+(o.qrAlign==='right'?' reverse':'')+'"><div class="tag-qrbox"><div class="tag-qr">'+makeQR(m.codigo)+'</div></div><div class="tag-info">'+pos+(pos&&num?'<div class="tag-sep"></div>':'')+num+description+'</div></div>'+
    '<div class="tag-foot">NEW TERMISA · ALMOXARIFADO</div></article>';
 };
 const fitNames=()=>{
  let count=0;const elements=Array.from(document.querySelectorAll('.tag-name-text'));
  for(const el of elements){
   const parent=el.closest('.tag-name-section');const item=el.closest('.tag');
   if(!parent||!item)continue;
   const min=8, max=Number(item.style.getPropertyValue('--font-name').replace('pt',''))||10.5;
   const available=parent.clientHeight-el.previousElementSibling.offsetHeight-3;
   if(available<=0){item.classList.add('missing-fit');count++;continue}
   let fs=max;el.style.fontSize=fs+'pt';
   while(fs>min && el.scrollHeight>available+1){fs=Math.max(min,fs-.5);el.style.fontSize=fs+'pt'}
   // The name must remain complete even for extremely long imported descriptions.

 const showWarning=(msg)=>{const b=$('warning');b.textContent=msg;b.classList.toggle('show',!!msg)};

  const opts=read(),error=configError(opts);
  const sheets=$('sheets');if(error){$('stats').textContent='Ajuste as dimensões para visualizar';sheets.innerHTML='';$('pageCounter').textContent='0 / 0';showWarning(error);$('print').disabled=true;lastOk=false;return}
  const rows=Math.floor((281+3)/(opts.height+3));const capacity=rows*opts.columns;
  if(capacity<1){showWarning('A altura escolhida não permite imprimir etiquetas na folha A4.');$('print').disabled=true;lastOk=false;return}

  const html=[];
  for(let p=0;p<nPages;p++){
   const section=entries.slice(p*capacity,(p+1)*capacity).map(m=>card(m,opts,qrMM,nameMM)).join('');
   html.push('<section class="paper'+(p===pageNo?' active':'')+'" style="--columns:'+opts.columns+';--card-w:'+opts.width+'mm;--card-h:'+opts.height+'mm">'+section+'</section>');
  }
  sheets.innerHTML=html.join('');
  document.documentElement.style.setProperty('--logo','url("'+NT_LOGO+'")');
  $('stats').textContent=entries.length+' etiquetas · '+capacity+' por folha · '+nPages+' página(s) · A4 210 × 297 mm';
  $('pageCounter').textContent=(pageNo+1)+' / '+pageCount;
  $('prev').disabled=pageNo===0;$('next').disabled=pageNo>=pageCount-1;
  showScale();
  requestAnimationFrame(()=>{warnings=fitNames();lastOk=warnings===0;showWarning(warnings?warnings+' etiqueta(s) com nome longo não cabem no tamanho escolhido. Aumente a altura ou reduza a fonte do nome para não cortar texto.':'');$('print').disabled=!lastOk});
 };
 const showScale=()=>{
  const stack=$('paperStack'),view=$('view'),sheets=$('sheets');const paper=document.querySelector('.paper.active');
  if(!paper){stack.style.width='0';stack.style.height='0';return}
  const paperWidth=210*96/25.4,paperHeight=297*96/25.4;
  const avail=Math.max(260,view.clientWidth-24);
  const scale=Math.min(1.15,avail/paperWidth);
  // scale the whole stack, preserve true millimetre dimensions for the print stylesheet.
  sheets.style.transform='scale('+scale+')';sheets.style.transformOrigin='top left';
  stack.style.width=(paperWidth*scale)+'px';stack.style.height=(paperHeight*scale)+'px';
 };
 const goto=next=>{if(next<0||next>=pageCount)return;pageNo=next;const papers=document.querySelectorAll('.paper');papers.forEach((paper,i)=>paper.classList.toggle('active',i===pageNo));$('pageCounter').textContent=(pageNo+1)+' / '+pageCount;$('prev').disabled=pageNo===0;$('next').disabled=pageNo>=pageCount-1;showScale()};
 const schedule=()=>{clearTimeout(activeTimer);$('print').disabled=true;activeTimer=setTimeout(render,120)};
 for(const id of [...numbers,...toggles,'qrAlign'])$(id).addEventListener('input',schedule);
 $('prev').addEventListener('click',()=>goto(pageNo-1));$('next').addEventListener('click',()=>goto(pageNo+1));
 $('reset').addEventListener('click',()=>{for(const k of numbers)$(k).value=defaults[k];for(const k of toggles)$(k).checked=defaults[k];$('qrAlign').value=defaults.qrAlign;pageNo=0;render()});
 $('print').addEventListener('click',()=>{if(!lastOk)return;document.getElementById('sheets').style.transform='none';window.print();showScale()});
 $('customize').addEventListener('click',()=>{const box=$('configGroups');const open=box.classList.toggle('is-open');$('customize').textContent=open?'Ocultar personalização ▴':'Personalizar etiqueta (opcional) ▾';});
 window.addEventListener('afterprint',showScale);window.addEventListener('resize',showScale);

}

function materialList(){

  const matches=mats.filter(x=>{
    const byStatus=materialStatus==='todos'||
      (materialStatus==='conferidos'&&!!x.conferido)||
      (materialStatus==='pendentes'&&!x.conferido)||
      (materialStatus==='sem-localizacao'&&missingLocation(x))||
      (materialStatus==='estoque-baixo'&&Number(x.quantidade)<=Number(x.minimo||0));
    const byStreet=materialStreet==='todas'||(materialStreet==='sem'&&missingLocation(x))||x.rua===materialStreet;
    const queryText=normMaterial(filter),searchText=normMaterial([x.codigo,x.nome,x.rua,x.posicao].join(' '));
    return byStatus&&byStreet&&(!queryText||searchText.includes(queryText));
  });

    if(missingA!==missingB)return missingA?1:-1;
    const street=String(a.rua||'').localeCompare(String(b.rua||''),'pt-BR');

  const statuses=[['todos',`Todos (${mats.length})`],['pendentes',`Aguardando conferência (${pending})`],['conferidos',`Conferidos (${done})`],['sem-localizacao',`Sem localização (${noPlace})`],['estoque-baixo',`Estoque baixo (${low})`]];

function ntHistoryShortcut(scope='todos'){return '<div class="nt-history-shortcut"><button type="button" class="nt-history-shortcut-button" data-scope="'+ntHistoryNormalizeScope(scope)+'" data-action="nt-meta-history" title="Escolher data, editar ou excluir um lançamento" aria-label="Abrir histórico para editar ou excluir item"><span class="nt-history-shortcut-icon" aria-hidden="true">✎</span><span>Editar / excluir item</span></button></div>'}
function moveView(){return `${mainNotice()}<h2>Registrar movimentação</h2><div class="buttons">${['SAIDA','ENTRADA','DEVOLUCAO'].map(t=>`<button class="btn ${kind===t?'':'alt'}" data-type="${t}">${t==='SAIDA'?'Retirada':t==='ENTRADA'?'Entrada':'Devolução'}</button>`).join('')}</div>${kind==='ENTRADA'?ntReceiptView():`<form id="moveForm" class="card"><div class="field"><label>Material</label>${itemSelect('moveCode')}</div><div id="stockHint" class="small">Selecione o material.</div><div class="field"><label>Quantidade</label><input id="moveQty" type="text" inputmode="decimal" required placeholder="Ex.: 5 ou 1,5"></div><div class="field"><label>Solicitante / responsável</label><input id="movePerson" required></div><div class="field"><label>Pedido / referência (opcional)</label><input id="moveOrder"></div><div class="field"><label>Observação</label><input id="moveObs"></div><button class="btn" type="submit">Confirmar e salvar na nuvem</button></form>`}${ntHistoryShortcut(kind==='SAIDA'?'retirada':kind.toLowerCase())}`}
function orderView(){return `${mainNotice()}<h2>Separação de pedido</h2><div class="card"><div class="field"><label>Solicitante</label><input id="orderPerson" value="${esc(window.orderPerson||'')}"></div><div class="field"><label>Número / referência do pedido</label><input id="orderNumber" value="${esc(window.orderNumber||'')}"></div><div class="field"><label>Material</label>${itemSelect('cartCode')}</div><div class="field"><label>Quantidade</label><input id="cartQty" inputmode="decimal" placeholder="Quantidade"></div><button class="btn alt" data-action="add-cart">Adicionar ao pedido</button></div><div class="card"><h2>Itens do pedido (${cart.length})</h2>${cart.map((x,i)=>`<div class="item"><div><strong>${esc(material(x.codigo)?.nome||x.codigo)}</strong><p class="small">${fmt(x.qtd)} · ${esc(x.codigo)}</p></div><button class="btn danger" data-remove="${i}">Remover</button></div>`).join('')||'<div class="small">Adicione materiais acima.</div>'}<div class="gap"></div><button class="btn" data-action="finish-cart" ${cart.length?'':'disabled'}>Finalizar e descontar todos os itens</button></div>${ntHistoryShortcut('pedido')}`}function testeIdentificado(m){const fields=[m.solicitante,m.pedido,m.observacao].map(x=>String(x??'')).join(' ').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();return /\bnao\s+contabilizar\b|\bsimulac(?:ao|oes)\b|\bteste\s+(?:do\s+)?sistema\b|\bhomologac(?:ao|oes)\b/.test(fields)}
function dayRows(moves=todayMoves){const result=new Map();for(const m of moves){const code=String(m.codigo??'');const r=result.get(code)||{codigo:code,nome:String(m.nome??''),unidade:String(m.unidade??''),saida:0,devolucao:0,entrada:0,ajuste:0,testeSaida:0,testeDevolucao:0,testeEntrada:0,testes:0,solicitantes:new Set()};const quant=Math.abs(Number(m.quantidade??m.delta??0)),q=Number.isFinite(quant)?quant:0,isTest=testeIdentificado(m);if(m.tipo==='AJUSTE')r.ajuste+=Number(m.delta)||0;else if(isTest){r.testes++;if(m.tipo==='SAIDA')r.testeSaida+=q;else if(m.tipo==='DEVOLUCAO')r.testeDevolucao+=q;else if(m.tipo==='ENTRADA')r.testeEntrada+=q}else{if(m.tipo==='SAIDA')r.saida+=q;else if(m.tipo==='DEVOLUCAO')r.devolucao+=q;else if(m.tipo==='ENTRADA')r.entrada+=q}if(m.solicitante)r.solicitantes.add(m.solicitante);result.set(code,r)}return [...result.values()].map(r=>({...r,saida:rnd(r.saida),devolucao:rnd(r.devolucao),entrada:rnd(r.entrada),ajuste:rnd(r.ajuste),testeSaida:rnd(r.testeSaida),testeDevolucao:rnd(r.testeDevolucao),testeEntrada:rnd(r.testeEntrada),consumoLiquido:rnd(r.saida-r.devolucao)})).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'))}

// Reposição: snapshots dos documentos emitidos são gravados EXCLUSIVAMENTE em nt_web_auditoria.
// Não existe escrita, transação nem ajuste em nt_web_materiais ou nt_web_movimentos neste módulo.
const ntReposSelected=new Set();
let ntReposEditingId=null;
const NT_REPOS_ACTION='RELATORIO_REPOSICAO_EMITIDO';
function ntReposEntry(){return `<div class="card" style="margin-bottom:12px"><h2>Reposição de materiais</h2><p class="small" style="margin-top:8px">Selecione os materiais para solicitar análise de compra. A quantidade a comprar é opcional e fica em branco no relatório quando não for informada.</p><div class="nt-repos-actions"><button class="btn" type="button" data-action="nt-repos-new">Criar relatório de reposição</button><button class="btn alt" type="button" data-action="nt-repos-history">Histórico dos relatórios</button></div><p class="small" style="margin-top:10px">Apenas documentos e histórico. Não altera saldos nem conferências.</p></div>`}
function ntReposModal(){
 if(!user||!cloudOk){notice('Aguarde a sincronização dos materiais.',true);return}
 ntReposSelected.clear();ntReposEditingId=null;
 const sorted=[...mats].sort((a,b)=>String(a.nome||'').localeCompare(String(b.nome||''),'pt-BR'));
 const rows=sorted.map(m=>{const code=String(m.codigo),name=String(m.nome||'');return `<div class="nt-repos-line" data-repos-row="${esc(normMaterial(code+' '+name))}"><input aria-label="Incluir ${esc(name)}" type="checkbox" data-repos-check="${esc(code)}"><label data-repos-tick="${esc(code)}"><b>${esc(name)}</b><span class="nt-repos-code">${esc(code)}</span></label></div>`}).join('');
 panel(`<h2>Relatório de reposição</h2><p class="small">Marque os materiais que precisam de reposição. A chefia e Compras definirão as quantidades. Não altera o estoque.</p><div class="field"><label for="ntReposSearch">Buscar material</label><input id="ntReposSearch" type="search" autocomplete="off" placeholder="Código ou parte do nome"></div><div class="buttons"><button type="button" class="btn alt" data-action="nt-repos-suggest">Sugerir compra</button><button type="button" class="btn ghost" data-action="nt-repos-visible">Marcar filtrados</button><button type="button" class="btn ghost" data-action="nt-repos-clear">Limpar</button></div><p class="small" id="ntReposCount" style="margin:9px 0">0 materiais selecionados</p><div class="nt-repos-choices">${rows}</div><div class="nt-repos-footer"><div class="buttons"><button type="button" class="btn alt" data-action="nt-repos-preview">Visualizar PDF (sem salvar)</button><button type="button" class="btn" data-action="nt-repos-issue">Salvar relatório e gerar PDF</button><button type="button" class="btn ghost" data-action="close">Cancelar</button></div></div>`);
}
function ntReposSuggest(){
 ntReposModal();
 if(!$('ntReposCount'))return;
 ntReposSelected.clear();
 for(const m of mats){
  const q=Number(m.quantidade)||0,minimum=Number(m.minimo)||0;
  if(!(minimum>0)||q>minimum)continue;
  const code=String(m.codigo);
  ntReposSelected.add(code);
 }
 ntReposRefresh();
 if(!ntReposSelected.size)notice('Nenhum material encontrado no mínimo ou abaixo. Você pode selecionar materiais manualmente.');
}
function ntReposRefresh(){
 const terms=normMaterial($('ntReposSearch')?.value||'').split(/\s+/).filter(Boolean);
 document.querySelectorAll('[data-repos-row]').forEach(el=>{el.style.display=terms.every(t=>el.dataset.reposRow.includes(t))?'grid':'none';const cb=el.querySelector('[data-repos-check]');if(cb)cb.checked=ntReposSelected.has(cb.dataset.reposCheck)});
 const node=$('ntReposCount');if(node)node.textContent=`${ntReposSelected.size} material(is) selecionado(s)`;
}
function ntReposToggle(code,enable){if(enable)ntReposSelected.add(code);else ntReposSelected.delete(code);ntReposRefresh()}
function ntReposBatch(mode){if(mode==='clear'){ntReposSelected.clear()}
 else if(mode==='all')mats.forEach(m=>ntReposSelected.add(String(m.codigo)));
 else if(mode==='visible')document.querySelectorAll('[data-repos-row]').forEach(el=>{if(el.style.display!=='none'){const cb=el.querySelector('[data-repos-check]');if(cb)ntReposSelected.add(cb.dataset.reposCheck)}});
 ntReposRefresh()}
function ntReportMeasure(code,catalog=mats){
 const record=catalog instanceof Map?catalog.get(String(code)):catalog.find(m=>String(m.codigo)===String(code));
 return String(record?.unidadeMedida??'').trim()||'—';
}
function ntReposBuild(){
 if(!ntReposSelected.size)throw Error('Selecione pelo menos um material.');
 const picked=[...ntReposSelected].map(code=>{const m=material(code);if(!m)throw Error('Material não encontrado: '+code);
 return {codigo:String(m.codigo),nome:String(m.nome||'').trim(),unidadeMedida:ntReportMeasure(code),saldoAtual:Number(m.quantidade)||0,minimo:Number(m.minimo)||0};
 });
 return picked.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')||a.codigo.localeCompare(b.codigo));
}

/* Reposição: dados atuais do cadastro, somente leitura.
   O histórico da solicitação não é sobrescrito quando o PDF é consultado. */
function ntReposActualByCode(code,catalog){
 const key=String(code??'');
 const source=catalog instanceof Map?catalog.get(key):
  (Array.isArray(catalog)?catalog.find(m=>String(m.codigo??'')===key):null);
 if(!source)return {encontrado:false,unidade:'—',saldo:null};
 const measure=String(source.unidadeMedida??'').trim();
 const raw=source.quantidade;
 const saldo=raw!==null&&raw!==undefined&&raw!==''&&Number.isFinite(Number(raw))?Number(raw):null;
 return {encontrado:true,unidade:measure||'—',saldo};
}
async function ntReposCatalogFromServer(){
 if(!user||!serverReady||!navigator.onLine)throw Error('É preciso estar conectado ao Firebase para consultar os saldos atuais.');
 const snap=await getDocsFromServer(collection(db,'nt_web_materiais'));
 if(snap.metadata.fromCache||snap.metadata.hasPendingWrites)throw Error('A consulta do estoque não foi confirmada pelo servidor.');
 return {materiais:snap.docs.map(d=>d.data()),consultadoEm:new Date().toISOString()};
}
function ntReposQueryDate(iso){
 const date=iso?new Date(iso):new Date();
 if(!Number.isFinite(date.getTime()))return 'Data da consulta indisponível';
 try{return new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Fortaleza',dateStyle:'short',timeStyle:'short'}).format(date)}
 catch(_){return 'Data da consulta indisponível'}
}
function ntReposShowError(popup,message){
 if(!popup)return;
 popup.document.open();
 popup.document.write('<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Consulta não concluída</title><body style="font:16px Arial;padding:28px;color:#173b4a"><h2>Não foi possível confirmar o saldo atual</h2><p>'+ntPlain(message)+'</p><p>O relatório não foi exibido com saldos antigos para evitar informações incorretas.</p></body></html>');
 popup.document.close();
}

function ntReposReportHtml(snapshot,catalog,consultadoEm){
 // Individual e Geral usam rigorosamente o mesmo gerador de páginas.
 const date=ntRepoLocalDay(snapshot)||day(),marker='__NT_REPOS_INDIVIDUAL_RODAPE__';
 const pages=ntGeneralReposPages([snapshot],date,marker,catalog,consultadoEm);
 if(!pages.length)pages.push('<section class="page landscape nt-general-repos">'+ntTop('RELATÓRIO DE REPOSIÇÃO DE MATERIAIS','Relação de materiais para análise e aquisição.',date)+'<p class="note">Nenhum material selecionado para reposição.</p>'+marker+'</section>');
 return ntHtml('Reposição de materiais · New Termisa',pages.map((p,i)=>p.replace(marker,ntFooter(i+1,pages.length))));
}
function ntReposOpenPDF(snapshot,popup,catalog,consultadoEm){
 if(!popup){notice('O navegador bloqueou a janela de relatório. Permita pop-ups.',true);return false}
 popup.document.open();popup.document.write(ntReposReportHtml(snapshot,catalog,consultadoEm));popup.document.close();return true;
}
async function ntReposPreview(){
 let items;try{items=ntReposBuild()}catch(e){notice(e.message,true);return}
 const popup=window.open('','_blank');
 if(!popup){notice('Permita pop-ups para visualizar o relatório.',true);return}
 popup.document.write('<!doctype html><html lang="pt-BR"><meta charset="utf-8"><body style="font:16px Arial;padding:26px">Conferindo saldos e unidades no Firebase...</body></html>');popup.document.close();
 try{
  const atual=await ntReposCatalogFromServer();
  const snap={itens:items,criadoEmLocal:new Date().toISOString()};
  ntReposOpenPDF(snap,popup,atual.materiais,atual.consultadoEm);
 }catch(e){ntReposShowError(popup,e.message||'Falha ao consultar o estoque.');notice('Não foi possível consultar o estoque para a prévia.',true)}
}
async function ntReposIssue(){
 let items;try{items=ntReposBuild();isReady()}catch(e){notice(e.message,true);return}
 const popup=window.open('','_blank');if(!popup){notice('Permita pop-ups do site e tente novamente.',true);return}
 popup.document.write('<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Salvando relatório</title><body style="font-family:Arial;padding:32px">Salvando o relatório no histórico do Firebase...</body></html>');popup.document.close();
 const reportRef=doc(collection(db,'nt_web_auditoria'));
 const created=new Date().toISOString();
 const data={acao:NT_REPOS_ACTION,formato:'NEW_TERMISA_REPOSICAO_V1',numero:reportRef.id,criadoEmLocal:created,criadoEm:serverTimestamp(),operador:String(user.email||''),uid:String(user.uid||''),totalItens:items.length,itens:items};
 try{
   isReady();loader(true);
   // Consultar materiais confirmados pelo servidor antes de emitir. Não grava no catálogo.
   const live=await ntReposCatalogFromServer();
   const updatedItems=items.map(item=>{
    const atual=ntReposActualByCode(item.codigo,live.materiais);
    return {...item,unidadeMedida:atual.unidade,saldoAtual:atual.saldo};
   });
   // Uma nova sugestão acrescenta materiais à lista vigente do dia,
   // sem descartar os itens já solicitados. A edição continua permitindo remover itens.
   if(!ntReposEditingId){
    const reports=await ntManualLoad(NT_REPOS_ACTION);
    const latest=ntReposDailyVersions(reports).get(ntRepoLocalDay(data));
    if(latest&&!latest.excluidoDoGeral){
     const merged=new Map(latest.itens.map(it=>[String(it.codigo),it]));
     for(const it of updatedItems)merged.set(String(it.codigo),it);
     data.itens=[...merged.values()].sort((a,b)=>String(a.nome||'').localeCompare(String(b.nome||''),'pt-BR'));
     data.totalItens=data.itens.length;
    }else data.itens=updatedItems;
   }else data.itens=updatedItems;
   if(ntReposEditingId){
    const previous=ntReposHistoryCache.get(ntReposEditingId);
    if(!previous)throw Error('Documento original não encontrado; reabra o histórico.');
    await ntReposCorrection(ntReposEditingId,{itens:updatedItems},'Atualização de materiais solicitados');
    const amended={...previous,itens:updatedItems,totalItens:updatedItems.length};
    ntReposOpenPDF(amended,popup,live.materiais,live.consultadoEm);
    notice('Solicitação atualizada. Histórico anterior preservado.');
   }else{
    await setDoc(reportRef,data);
    ntReposOpenPDF(data,popup,live.materiais,live.consultadoEm);
    notice('Solicitação salva no histórico e PDF preparado.');
   }
   ntReposEditingId=null;close();
 }catch(e){
   popup.document.open();popup.document.write('<!doctype html><html lang="pt-BR"><meta charset="utf-8"><body style="font:16px Arial;padding:25px"><h2>Relatório não confirmado</h2><p>Não foi possível confirmar o salvamento do relatório no Firebase. A impressão não foi liberada para evitar documento sem histórico.</p><p>Confira suas permissões de acesso ao histórico (coleção de auditoria).</p></body></html>');popup.document.close();
   notice('Não foi possível confirmar o histórico: '+(e.message||'erro de permissão ou conexão')+'. Verifique antes de tentar novamente.',true);
 }finally{loader(false)}
}

/* Alterações documentais registradas como retificações auditáveis.
   Não existe exclusão de estoque, movimentos ou do documento original. */
function ntReposEdit(id){
 const record=ntReposHistoryCache.get(String(id));
 if(!record){notice('Atualize o histórico antes de editar.',true);return}
 ntReposModal();
 ntReposEditingId=String(id);
 for(const item of record.itens||[]){
  const code=String(item.codigo||'');
  if(!material(code))continue;
  ntReposSelected.add(code);
 }
 ntReposRefresh();
 const h=document.querySelector('#ntReposSearch')?.closest('.field');
 if(h)h.insertAdjacentHTML('beforebegin','<p class="small"><b>Editando solicitação emitida.</b> Inclua ou retire materiais e salve. A versão anterior será preservada no histórico de auditoria; o estoque não será alterado.</p>');
}
async function ntReposNew(){
 if(!user||!serverReady||!navigator.onLine){notice('Conecte-se ao Firebase para editar a lista do dia.',true);return}
 try{
  loader(true);
  const records=await ntManualLoad(NT_REPOS_ACTION);
  ntReposHistoryCache=new Map(records.map(r=>[String(r.numero),r]));
  const latest=ntReposDailyVersions(records).get(day());
  loader(false);
  if(latest&&!latest.excluidoDoGeral){ntReposEdit(latest.numero);return}
  ntReposModal();
 }catch(e){loader(false);notice('Não foi possível consultar a lista atual: '+(e.message||'erro de rede'),true)}
}
async function ntReposCorrection(id,depois,description){
 if(!user||!serverReady||!navigator.onLine)throw Error('Conecte-se ao Firebase para registrar a alteração.');
 const record=ntReposHistoryCache.get(String(id));
 if(!record)throw Error('Documento não está no histórico. Atualize a lista.');
 const ref=doc(collection(db,'nt_web_auditoria'));
 const change={acao:NT_MANUAL_EDIT_ACTION,documentoTipo:'reposition',documentoId:String(id),
  criadoEmLocal:new Date().toISOString(),criadoEm:serverTimestamp(),
  operador:String(user.email||''),uid:String(user.uid||''),
  antes:{itens:record.itens,excluidoDoGeral:!!record.excluidoDoGeral},depois,
  descricao:String(description||'Retificação documental')};
 await setDoc(ref,change);
}
async function ntReposVisibility(id){
 const record=ntReposHistoryCache.get(String(id));
 if(!record){notice('Atualize o histórico.',true);return}
 const hide=!record.excluidoDoGeral;
 const message=hide?
  'Excluir esta versão do Relatório Geral do Dia? O documento original permanecerá no histórico e nenhum estoque será alterado.':
  'Restaurar esta versão para participação no Relatório Geral? Apenas a versão mais recente de cada dia é exibida.';
 if(!window.confirm(message))return;
 try{
  loader(true);
  await ntReposCorrection(id,{excluidoDoGeral:hide},hide?'Exclusão lógica do relatório geral':'Restauração documental');
  notice(hide?'Versão excluída do PDF geral, com histórico preservado.':'Versão restaurada.');await ntReposHistory();
 }catch(e){notice('Não foi possível salvar a alteração: '+(e.message||'verifique permissões do Firebase'),true)}
 finally{loader(false)}
}

async function ntReposHistory(){
 if(!user||!serverReady){notice('Conecte-se ao Firebase para consultar o histórico.',true);return}
 panel('<h2>Histórico de relatórios de reposição</h2><p class="small">Buscando relatórios emitidos no Firebase...</p>');
 try{
   const records=await ntManualLoad(NT_REPOS_ACTION);
   const latest=ntReposDailyVersions(records);
   const status=r=>r.excluidoDoGeral?'Excluído do PDF geral':latest.get(ntRepoLocalDay(r))?.numero===r.numero?'Versão do relatório geral':'Versão anterior preservada';
   ntReposHistoryCache=new Map(records.map(r=>[r.numero,r]));
   const rows=records.map(r=>`<div class="nt-repos-history"><div><b>${esc(new Date(r.criadoEmLocal).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}))}</b><div class="small">${r.itens.length} materiais · ${esc(status(r))}</div></div><div class="buttons"><button class="btn alt" type="button" data-action="nt-repos-open-history" data-code="${esc(r.numero)}">PDF</button><button class="btn alt" type="button" data-action="nt-repos-edit" data-code="${esc(r.numero)}">Editar</button><button class="btn ghost" type="button" data-action="nt-repos-visibility" data-code="${esc(r.numero)}">${r.excluidoDoGeral?'Restaurar':'Excluir página'}</button></div></div>`).join('');
   panel(`<h2>Histórico de relatórios de reposição</h2><p class="small">Somente a versão mais recente de cada dia é incluída no PDF Geral. Você pode editar ou excluir uma página do relatório sem apagar os registros originais nem alterar o estoque. ${records.length} versão(ões) no histórico.</p><div class="card" style="max-height:53vh;overflow-y:auto;padding:0 10px">${rows||'<p class="small" style="padding:12px">Nenhum relatório de reposição salvo até agora.</p>'}</div><div class="buttons" style="margin-top:12px"><button class="btn alt" data-action="nt-repos-new">Editar lista de hoje</button><button class="btn ghost" data-action="close">Fechar</button></div>`);
 }catch(e){panel(`<h2>Histórico de relatórios</h2><div class="alert">Não foi possível consultar o histórico no Firebase. Confira as permissões da coleção de auditoria.</div><p class="small">${esc(e.message||'Erro de leitura')}</p><button class="btn" data-action="close">Fechar</button>`)}
}
let ntReposHistoryCache=new Map();
async function ntReposOpenHistory(id){
 const entry=ntReposHistoryCache.get(String(id));
 if(!entry){notice('Relatório não encontrado no histórico. Consulte novamente.',true);return}
 const popup=window.open('','_blank');
 if(!popup){notice('Permita pop-ups para abrir o histórico.',true);return}
 popup.document.write('<!doctype html><html lang="pt-BR"><meta charset="utf-8"><body style="font:16px Arial;padding:26px">Consultando o saldo atual no Firebase...</body></html>');popup.document.close();
 try{
  const live=await ntReposCatalogFromServer();
  ntReposOpenPDF(entry,popup,live.materiais,live.consultadoEm);
 }catch(e){ntReposShowError(popup,e.message||'Falha na consulta.');notice('Não foi possível consultar o estoque atual para esse relatório.',true)}
}

}

function ntPlain(v){return esc(v??'')}
function ntDate(s){const p=String(s||'').split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:String(s||'')}
function ntTime(m){let d=m.criadoEm?.toDate?.()||new Date(m.timeClient||0);return Number.isFinite(d.getTime())?d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'--:--'}
function ntQty(m){const n=Number(m.quantidade);return Number.isFinite(n)&&n>0?n:Math.abs(Number(m.delta)||0)}
function ntChunk(items,budget){ // evita cortar nomes compridos quando existir muitos pedidos na mesma data
 let pages=[],one=[],used=0,index=0;
 for(const item of items){
  const longest=Math.max(String(item.nome||'').length/33,String(item.solicitante||'').length/22,String(item.pedido||'').length/18);
  const extra=Math.max(0,Math.ceil(longest)-1);const weight=1+0.65*extra;
  const capacity=index===0?budget[0]:budget[1];
  if(one.length&&used+weight>capacity){pages.push(one);one=[];used=0;index++}
  one.push(item);used+=weight;
 }
 if(one.length||!pages.length)pages.push(one);
 return pages;
}

function ntTop(title,subtitle,date,compact=false){return `<div class="rhead"><img src="${NT_LOGO}" alt="New Termisa"><div class="company"><b>${compact?'FECHAMENTO DIÁRIO':'ALMOXARIFADO / NEW TERMISA'}</b>${ntPlain(ntDate(date))}</div></div><div class="line"></div><h1 class="heading">${ntPlain(title)}</h1><p class="desc">${ntPlain(subtitle)}</p>`}
function ntFooter(num,total){return `<div class="footer"><span>NEW TERMISA &nbsp;|&nbsp; ALMOXARIFADO</span><span>PÁGINA ${num} DE ${total}</span></div>`}
function ntTable(heads,widths,rows){return `<table><colgroup>${widths.map(w=>`<col style="width:${w}%">`).join('')}</colgroup><thead><tr>${heads.map((x,i)=>`<th class="${i===4&&heads.length===7?'right':''}">${ntPlain(x)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(row=>`<tr>${row.map((v,i)=>`<td class="${i===1?'code':i===2?'name':i===4&&heads.length===7?'qty':''}">${ntPlain(v)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${heads.length}" class="empty">Nenhum registro encontrado para esta data.</td></tr>`}</tbody></table>`}

 const mixedFix=landscape&&portrait?'.page.portrait{page:ntlandscape;width:297mm;padding:7mm 15mm 13mm}':'';
 // Chrome/Android pode dividir uma folha virtual de 210mm em duas folhas
 // fisicas: reservar folga real para notas e rodapes, sem ocultar conteudo.
 const printCss=`<style>@page{size:A4 ${orientation};margin:0}
 @media print{
   html,body{margin:0!important;padding:0!important;background:#fff!important}
   .toolbar{display:none!important}

   .nt-general-stock td{padding:1.25mm 1.5mm!important;line-height:1.25!important}
   .nt-general-requests .note,.nt-general-stock .note{margin-top:2mm!important}
   .nt-general-stock-deep .nt-deep-panel{min-height:0!important;padding:2mm 3mm!important}
   .nt-general-stock-deep .nt-deep-unitrow{padding:.55mm 0!important}
   .nt-general-stock-deep .nt-di-barrow{min-height:4.9mm!important}
   .nt-general-stock-deep .nt-di-bars{gap:.7mm!important}
   .nt-general-stock-deep .nt-deep-subhead{margin:1.5mm 0 1mm!important}
   .nt-general-stock-deep .nt-deep-alertline{padding:1.1mm 1.7mm!important;margin:.8mm 0!important}

   .page.landscape.nt-general-stock-intel,
   .page.landscape.nt-general-stock-deep{height:196mm!important;min-height:196mm!important;padding-top:6mm!important;padding-bottom:18mm!important}
   .nt-general-stock-intel .nt-di-panel{min-height:60mm!important}
   .nt-general-stock-intel .nt-di-donut{width:42mm!important;height:42mm!important}
   .nt-general-stock-intel .nt-di-insight{min-height:0!important;padding:1.6mm 2.6mm!important}

   .nt-general-stock-intel .nt-di-footnote{font-size:7pt!important;line-height:1.16!important;margin-top:1.2mm!important;padding-top:1mm!important}

   .page.landscape.nt-general-stock-intel .footer,

 }</style>`;
 return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${ntPlain(title)}</title>${ntReportCSS()}${printCss}</head><body><div class="toolbar"><button onclick="window.print()">Imprimir / Salvar em PDF</button>Para impressão: <strong>A4 · ${orientationLabel}</strong>. Confirme a orientação e escolha <strong>Salvar como PDF</strong>.</div>${pages.join('')}</body></html>`;

function ntCIIcon(kind){
 const shapes={
  box:'<path d="M12 2 3 7v10l9 5 9-5V7L12 2Z"/><path d="m3 7 9 5 9-5M12 12v10"/>',
  order:'<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 7h6M9 11h6M9 15h2"/>',
  people:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 11a3 3 0 1 0-1-5.8M17 14a5 5 0 0 1 4 5v1"/>',
  layers:'<path d="m12 2-10 6 10 6 10-6-10-6ZM2 12l10 6 10-6M2 16l10 6 10-6"/>'
 };
 return '<span class="nt-ci-icon"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+shapes[kind]+'</svg></span>';
}
function ntCIChunks(rows){
 const pages=[];let page=[],weight=0;
 for(const row of rows){
  const lines=Math.max(1,Math.ceil(String(row.nome||'').length/32),
    Math.ceil(String(row.solicitante||'').length/21),Math.ceil(String(row.pedido||'').length/18));
  const w=1+Math.max(0,lines-1)*.82;
  if(page.length&&(page.length>=29||weight+w>29)){pages.push(page);page=[];weight=0}
  page.push(row);weight+=w;
 }
 if(page.length||!pages.length)pages.push(page);
 return pages;
}
function ntCI(movements,date,catalog=mats){
 const entries=ntArmEffectiveMovements(movements).filter(m=>m.tipo==='SAIDA'&&!m.anulado&&!testeIdentificado(m))
   .sort((a,b)=>String(a.timeClient||'').localeCompare(String(b.timeClient||'')));
 const requests=new Set(entries.map(m=>String(m.pedido||'').trim()).filter(Boolean));
 const people=new Set(entries.map(m=>String(m.solicitante||'').trim()).filter(Boolean));
 const kinds=new Set(entries.map(m=>String(m.codigo||'').trim()).filter(Boolean));
 const rows=entries.map(m=>({hora:ntTime(m),codigo:String(m.codigo||''),
  nome:String(m.nome||''),unidade:ntReportMeasure(m.codigo,catalog),
  quantidade:fmt(ntQty(m)),solicitante:String(m.solicitante||'Não informado'),
  pedido:String(m.pedido||'—')}));
 const chunks=ntCIChunks(rows),pages=[];
 const labels=[['box','ITENS ENTREGUES',rows.length],['order','PEDIDOS',requests.size],
  ['people','SOLICITANTES',people.size],['layers','MATERIAIS DISTINTOS',kinds.size]];
 for(let i=0;i<chunks.length;i++){
  const head=ntTop('COMUNICAÇÃO INTERNA','Saídas de materiais por solicitante, com rastreabilidade e referência de pedido.',date);
  const metrics=i===0?'<div class="metrics">'+labels.map(item=>'<div class="metric">'+ntCIIcon(item[0])+
   '<div><small>'+ntPlain(item[1])+'</small><strong>'+ntPlain(item[2])+'</strong></div></div>').join('')+'</div>':
   '<div class="sectionline"><span>CONTINUAÇÃO DOS LANÇAMENTOS</span><span>'+ntPlain(ntDate(date))+'</span></div>';
  const part=ntTable(['HORA','CÓDIGO','MATERIAL / DESCRIÇÃO','UN.','QTDE.','SOLICITANTE','PEDIDO / REF.'],
   [8,14,30,6,8,19,15],chunks[i].map(m=>[m.hora,m.codigo,m.nome,m.unidade,m.quantidade,m.solicitante,m.pedido]));
  const sign=i===chunks.length-1?'<div class="sign"><span>Conferido por: <i></i></span><span>Recebido por: <i></i></span></div>':'';
  pages.push('<section class="page portrait nt-ci-report">'+head+metrics+
   '<div class="sectionline"><span>'+(i?'MATERIAIS ENTREGUES · CONTINUAÇÃO':'RELAÇÃO DE MATERIAIS ENTREGUES')+
   '</span><span>'+ntPlain(ntDate(date))+'</span></div>'+part+sign+
   (!entries.length?'<p class="note">Não houve saídas operacionais registradas para a data selecionada.</p>':'')+
   ntFooter(i+1,chunks.length)+'</section>');
 }
 return ntHtml('Comunicação Interna · '+ntDate(date),pages);
}
function ntSaldosDoDia(movements){
 // O primeiro saldo "antes" e o último "depois" são históricos daquele dia,
 // não o saldo atual do catálogo. Sem registro confiável, mostra "—".
 const ordered=[...movements].sort((a,b)=>{
  const time=m=>{
   const t=m.criadoEm;
   if(t&&typeof t.toMillis==='function')return t.toMillis();
   if(t&&Number.isFinite(Number(t.seconds)))return Number(t.seconds)*1000+(Number(t.nanoseconds)||0)/1e6;
   const v=Date.parse(String(m.timeClient||''));
   return Number.isFinite(v)?v:0;
  };
  const c=time(a)-time(b);
  return c||String(a.timeClient||'').localeCompare(String(b.timeClient||''));
 });
 const found=new Map();
 for(const m of ordered){
  const code=String(m.codigo??'');
  if(!code)continue;
  const valid=v=>v!==null&&v!==undefined&&v!==''&&Number.isFinite(Number(v));
  const previous=found.get(code);
  if(!previous){found.set(code,{inicio:valid(m.antes)?Number(m.antes):null,fim:valid(m.depois)?Number(m.depois):null});}
  else{previous.fim=valid(m.depois)?Number(m.depois):null;}
 }
 return found;
}
function ntClosing(movements,date,catalog=mats){
 // Relatório executivo mostra SOMENTE movimentos operacionais reais.
 // Ajustes e simulações permanecem íntegros no histórico/auditoria, fora deste PDF.
 const operational=ntArmEffectiveMovements(movements).filter(m=>['SAIDA','ENTRADA','DEVOLUCAO'].includes(String(m.tipo))&&!testeIdentificado(m));
 const grouped=dayRows(operational),balances=ntSaldosDoDia(operational);
 const types={SAIDA:new Set(),DEVOLUCAO:new Set(),ENTRADA:new Set()};
 for(const m of operational)types[m.tipo].add(String(m.codigo));
 const measures=[
  ['MATERIAIS MOVIMENTADOS',String(grouped.length)],
  ['MATERIAIS COM SAÍDA',String(types.SAIDA.size)],
  ['MATERIAIS COM ENTRADA',String(types.ENTRADA.size)],
  ['MATERIAIS COM DEVOLUÇÃO',String(types.DEVOLUCAO.size)]
 ];
 const recs=grouped.map(g=>{
  const balance=balances.get(String(g.codigo||''));
  return {codigo:String(g.codigo||''),nome:String(g.nome||''),
   unidade:ntReportMeasure(g.codigo,catalog),saida:fmt(g.saida),
   devolucao:fmt(g.devolucao),consumo:fmt(g.consumoLiquido),entrada:fmt(g.entrada),
   saldoInicial:balance?.inicio==null?'—':fmt(balance.inicio),
   saldoFinal:balance?.fim==null?'—':fmt(balance.fim)};
 });
 const chunks=recs.length?ntChunk(recs,[8,10]):[];
 const orderedMovements=[...operational].sort((a,b)=>{
  const asTime=m=>{
   const timestamp=m.criadoEm;
   if(timestamp&&typeof timestamp.toMillis==='function')return timestamp.toMillis();
   const n=Date.parse(String(m.timeClient||''));
   return Number.isFinite(n)?n:0;
  };
  return asTime(a)-asTime(b)||String(a.timeClient||'').localeCompare(String(b.timeClient||''));
 });
 const movementChunks=orderedMovements.length?ntChunk(orderedMovements,[11,13]):[];
 const total=1+chunks.length+movementChunks.length;
 const overview=operational.length
 ?'<div class="sectionline"><span>LEITURA RÁPIDA</span></div><p class="note">Consumo líquido = saídas − devoluções, calculado individualmente por material. Entradas representam reposição do estoque.</p>'
 :'<div class="sectionline"><span>SEM MOVIMENTAÇÕES OPERACIONAIS</span></div><p class="note">Não há entradas, saídas ou devoluções registradas para a data selecionada.</p>';
 const summary='<section class="page portrait">'+ntTop('FECHAMENTO DIÁRIO','Resumo das entradas e saídas operacionais · '+ntDate(date),date)+
  '<div class="sectionline"><span>INDICADORES DO DIA</span><span>'+ntPlain(ntDate(date))+'</span></div>'+
  '<div class="metrics">'+measures.map(([name,count])=>'<div class="metric"><small>'+ntPlain(name)+'</small><strong>'+ntPlain(count)+'</strong></div>').join('')+'</div>'+
  overview+ntFooter(1,total)+'</section>';
 const details=chunks.map((chunk,i)=>{
  const body=ntTable(['CÓDIGO','MATERIAL / DESCRIÇÃO','UN.','SAÍDAS','DEVOL.','CONSUMO','ENTRADAS','SALDO INICIAL','SALDO FINAL'],
  [13,26,6,8,8,9,10,10,10],chunk.map(x=>[x.codigo,x.nome,x.unidade,x.saida,x.devolucao,x.consumo,x.entrada,x.saldoInicial,x.saldoFinal]));
  return '<section class="page landscape">'+ntTop('FECHAMENTO POR MATERIAL','Entradas, saídas, devoluções e saldos históricos.',date,true)+
   '<div class="sectionline"><span>'+(i?'MATERIAIS · CONTINUAÇÃO':'RELAÇÃO DE MATERIAIS')+'</span><span>'+ntPlain(ntDate(date))+'</span></div>'+
   body+'<p class="note">Consumo líquido = saídas − devoluções. Os saldos refletem os valores registrados nas operações.</p>'+
   ntFooter(i+2,total)+'</section>';
 });
 const tracePages=movementChunks.map((part,i)=>{
  const items=part.map(m=>[
   ntTime(m),String(m.codigo||''),String(m.nome||''),ntReportMeasure(m.codigo,catalog),
   String(m.tipo||''),fmt(ntQty(m)),m.antes==null?'—':fmt(m.antes),
   m.depois==null?'—':fmt(m.depois),String(m.solicitante||m.operador||'—')]);
  const body=ntTable(['HORA','CÓDIGO','MATERIAL','UN.','TIPO','QTDE.','ANTES','DEPOIS','RESPONSÁVEL'],
   [8,13,23,6,12,8,8,9,13],items);
  return '<section class="page landscape">'+ntTop('MOVIMENTAÇÕES DO DIA','Rastreabilidade dos lançamentos operacionais e saldos antes e depois.',date,true)+
   '<div class="sectionline"><span>DETALHAMENTO DAS OPERAÇÕES</span><span>'+ntPlain(ntDate(date))+'</span></div>'+
   body+'<p class="note">Quantidades e saldos históricos registrados no Firebase no momento da operação.</p>'+
   ntFooter(2+chunks.length+i,total)+'</section>';
 });
 return ntHtml('Fechamento Diário · '+ntDate(date),[summary,...details,...tracePages]);
}

 return `<div class="card" style="margin-bottom:12px"><h2>Relatório geral do inventário</h2>
 <p class="small" style="margin:7px 0 12px">Estoque completo da New Termisa: todos os materiais, inclusive os que não tiveram movimento hoje. Inclui código, descrição, unidade, rua/posição, saldo, mínimo, preço, valor e situação da conferência.</p>

function ntFullInventoryReport(items, generatedAt, operator) {
  // Apresentação gerencial. Só recebe registros consultados e gera HTML, sem gravar dados no Firebase.
  const when = generatedAt instanceof Date ? generatedAt : new Date(generatedAt);
  const emitted = Number.isFinite(when.getTime())
    ? when.toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'}) : 'Data não disponível';
  const asNum = v => Number.isFinite(Number(v)) ? Number(v) : 0;
  const brNum = v => new Intl.NumberFormat('pt-BR', {maximumFractionDigits:2}).format(asNum(v));
  const brPrice = v => new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'}).format(asNum(v));
  const moneyCol = v => new Intl.NumberFormat('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}).format(asNum(v));
  const place = m => String(m.rua||'').trim() && String(m.posicao||'').trim()
    ? String(m.rua).trim().toUpperCase() + '-' + String(m.posicao).trim().padStart(2,'0') : '—';
  const rows = [...items].map(m => ({
    code: String(m.codigo??''), name: String(m.nome??'').trim() || 'SEM DESCRIÇÃO',
    loc: place(m), category: String(m.unidade??'').trim() || '—', unit: String(m.unidadeMedida??'').trim() || '—',
    qty: asNum(m.quantidade), price: asNum(m.preco),
    min: asNum(m.minimo), checked: !!m.conferido
  })).map(x=>({...x,value:x.qty*x.price})).sort((a,b) => a.name.localeCompare(b.name,'pt-BR') || a.code.localeCompare(b.code,'pt-BR'));
  const total=rows.length, confirmed=rows.filter(r=>r.checked).length, pending=total-confirmed;
  const missing=rows.filter(r=>r.loc==='—').length;
  const low=rows.filter(r=>r.qty<=r.min).length;
  const value=rows.reduce((x,r)=>x+r.value,0), checkedValue=rows.filter(r=>r.checked).reduce((x,r)=>x+r.value,0);
  const pct=total?Math.round(confirmed/total*1000)/10:0;
  // Paginação com compensação para descrições compridas.
  const chunks=[];let part=[],units=0;
  for (const item of rows) {
    const wordCount=item.name.length;
    const weight=1+(wordCount>44?0.7:0)+(wordCount>65?0.65:0);
    if(part.length&&units+weight>15){chunks.push(part);part=[];units=0;}
    part.push(item); units+=weight;
  }
  if(part.length || !chunks.length)chunks.push(part);
  const pages=chunks.length+1;
  const ntFooterNew=(n)=>`<footer class="nto-foot"><span>NEW TERMISA / ALMOXARIFADO &nbsp;•&nbsp; Base: ${ntPlain(emitted)} &nbsp;•&nbsp; Saldos sujeitos à conferência</span><strong>${n} / ${pages}</strong></footer>`;
  const ntHeadNew=(title,subtitle)=>`<header class="nto-head"><div><div class="nto-brandline">NEW TERMISA &nbsp;/&nbsp; ALMOXARIFADO</div><h1>${ntPlain(title)}</h1><p>${ntPlain(subtitle)}</p></div><img src="${NT_LOGO}" alt="New Termisa"></header>`;
  const cards=[['MATERIAIS',total,'No cadastro'],['CONFERIDOS',confirmed,'Contagem validada'],['PENDENTES',pending,'Sem conferência'],['SEM LOCALIZAÇÃO',missing,'Endereço pendente'],['ESTOQUE BAIXO',low,'Mínimo ou abaixo']].map(([h,v,s])=>`<div class="nto-kpi"><small>${h}</small><b>${v}</b><span>${s}</span></div>`).join('');
  const cover=`<section class="nto-page">${ntHeadNew('RELATÓRIO GERAL DO INVENTÁRIO','Posição consolidada dos materiais cadastrados • Emissão: '+emitted)}
    <div class="nto-summary"><div><small>VALOR ESTIMADO DO ESTOQUE</small><strong>${brPrice(value)}</strong></div><div class="nto-confirmed"><small>VALOR DOS ITENS CONFERIDOS</small><b>${brPrice(checkedValue)}</b></div></div>
    <div class="nto-kpis">${cards}</div>
    <div class="nto-progress-head"><b>PROGRESSO DA CONFERÊNCIA FÍSICA</b><span>${confirmed} de ${total} materiais • ${String(pct).replace('.',',')}%</span></div>
    <div class="nto-meter"><div style="width:${pct}%"></div></div>
    <div class="nto-info"><b>LEITURA GERENCIAL</b><p>Este relatório reúne todos os materiais cadastrados, inclusive aqueles sem movimentações no dia.</p><p>Os materiais pendentes ainda não tiveram a quantidade validada por conferência física. Os valores são estimativas baseadas nos saldos e preços cadastrados.</p></div>
    <div class="nto-annex"><b>ANEXO • RELAÇÃO COMPLETA</b><p>${total} materiais organizados por nome, com código, localização, unidade, saldo, preço, valor e conferência. Não se somam quantidades de unidades diferentes.</p></div>${ntFooterNew(1)}</section>`;
  const list=chunks.map((chunk,index)=>{
    const first=chunks.slice(0,index).reduce((n,a)=>n+a.length,0)+1;
    const last=first+chunk.length-1;
    const trs=chunk.map(x=>`<tr>
      <td class="nto-code">${ntPlain(x.code)}</td><td class="nto-name">${ntPlain(x.name)}</td>
      <td>${ntPlain(x.loc)}</td><td>${ntPlain(x.category)}</td><td>${ntPlain(x.unit)}</td>
      <td class="nto-num nto-bold">${brNum(x.qty)}</td><td class="nto-num">${moneyCol(x.price)}</td>
      <td class="nto-num nto-bold">${moneyCol(x.value)}</td>
      <td class="nto-check ${x.checked?'nto-ok':'nto-pend'}">${x.checked?'SIM':'NÃO'}</td></tr>`).join('');
    return `<section class="nto-page">${ntHeadNew('RELAÇÃO COMPLETA DE MATERIAIS',`Listagem alfabética • ${total} materiais • Valores em reais (R$)`)}
    <div class="nto-tablehead"><b>REGISTROS ${first} A ${last} DE ${total}</b><span>Quantidades na unidade de cada material</span></div>
    <table class="nto-table"><colgroup><col style="width:11%"><col style="width:31%"><col style="width:8%"><col style="width:6%"><col style="width:6%"><col style="width:8%"><col style="width:10%"><col style="width:12%"><col style="width:8%"></colgroup>
    <thead><tr><th>CÓDIGO</th><th>MATERIAL / DESCRIÇÃO</th><th>LOCAL</th><th>CAT.</th><th>UN.</th><th class="nto-num">SALDO</th><th class="nto-num">PREÇO (R$)</th><th class="nto-num">VALOR (R$)</th><th class="nto-check">CONFER.</th></tr></thead><tbody>${trs}</tbody></table>${ntFooterNew(index+2)}</section>`;
  }).join('');
  const style=`<style>

/* Recebimentos e Produção: apenas registros documentais na auditoria.
   NUNCA modificar nt_web_materiais nem nt_web_movimentos. */
const NT_RECEIPT_ACTION='RELATORIO_RECEBIMENTO_REGISTRADO';
const NT_PRODUCTION_ACTION='RELATORIO_PRODUCAO_REGISTRADO';
const NT_MANUAL_EDIT_ACTION='RETIFICACAO_DOCUMENTAL_NEW_TERMISA';
/* Retificação documental de movimentos: preserva quantidade e saldo original. */
const NT_META_ACTION=NT_MANUAL_EDIT_ACTION;
let ntMetaDraft=null,ntMetaDate=null;
function ntMetaFields(x){return {solicitante:String(x.solicitante||''),pedido:String(x.pedido||''),observacao:String(x.observacao||'')}}
function ntMetaMoves(rows,edits){
 const map=new Map(rows.map(x=>[String(x.id||''),{...x}]));
 edits.filter(x=>x.acao===NT_META_ACTION&&x.documentoTipo==='movimento'&&x.documentoId&&x.depois)
 .sort((a,b)=>String(a.criadoEmLocal||'').localeCompare(String(b.criadoEmLocal||''))||String(a.numero||'').localeCompare(String(b.numero||'')))
 .forEach(e=>{const m=map.get(String(e.documentoId));if(!m||!['solicitante','pedido','observacao'].every(k=>typeof e.depois[k]==='string'))return;const voided=e.depois.excluido===true;map.set(String(e.documentoId),{...m,...ntMetaFields(e.depois),...(voided?{anulado:true,estornado:true,estornadoEm:e.criadoEmLocal||'',estornoId:String(e.movimentoEstornoId||'')}:{} )})});
 return [...map.values()];
}
async function ntMetaRead(){
 const snap=await getDocsFromServer(query(collection(db,'nt_web_auditoria'),where('acao','==',NT_META_ACTION)));
 return snap.docs.map(d=>({...d.data(),numero:d.id}));
}
async function ntMetaOpen(id){
 isReady();loader(true);
 try{

  if(!snap.exists())throw Error('Movimentação não encontrada.');

  if(!['SAIDA','ENTRADA','DEVOLUCAO'].includes(m.tipo)||m.anulado||m.reciboId||m.origem==='RECEBIMENTO_INTEGRADO')
   throw Error('Este lançamento é protegido; consulte o Histórico de Recebimentos, se for entrada vinculada.');
  const v=ntMetaMoves([m],await ntMetaRead())[0];if(v.anulado)throw Error('Movimentação já excluída/estornada. Não pode ser editada.');ntMetaDraft={id:m.id,old:ntMetaFields(v)};
  panel('<h2>Editar informações do lançamento</h2><p class="small">'+esc(m.tipo)+' · '+esc(m.codigo)+' · '+esc(m.nome||'')+'</p>'+
