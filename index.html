async function consultarSaldosServidor(codigos, esperados={}){
  const unicos=[...new Set(codigos.map(String))];
  if(!unicos.length)return;
  const respostas=[];
  for(let inicio=0;inicio<unicos.length;inicio+=30){
    const grupo=unicos.slice(inicio,inicio+30);
    const q=query(collection(db,'nt_web_materiais'),where('codigo','in',grupo));
    const consulta=await getDocsFromServer(q);
    for(const registro of consulta.docs)respostas.push(registro.data());
  }
  if(respostas.length!==unicos.length)throw Error('Alguns materiais não foram encontrados na verificação de leitura.');
  for(const registro of respostas){
    const esperado=esperados[String(registro.codigo)];
    if(esperado && esperado.quantidade!==undefined && Math.abs(Number(registro.quantidade)-Number(esperado.quantidade))>0.00001)
      throw Error('Quantidade ainda não confirmada na nuvem: '+registro.codigo);
    if(esperado && esperado.conferido!==undefined && registro.conferido!==esperado.conferido)
      throw Error('Conferência ainda não confirmada na nuvem: '+registro.codigo);
  }
  for(const registro of respostas){
    const i=mats.findIndex(r=>String(r.codigo)===String(registro.codigo));
    if(i>=0)mats[i]=registro;else mats.push(registro);
  }
  mats.sort((a,b)=>String(a.nome).localeCompare(String(b.nome),'pt-BR'));
  cloudOk=true;serverReady=true;status('● Sincronizado',true);draw();
}
async function execute(fn,codigos=[],esperados={}){

    notice(codigos.length?'Dados atualizados e confirmados no Firebase!':'Gravação confirmada no Firebase!');
    return true;
  }catch(e){
    notice((gravado?'Dados gravados, mas ainda não foi possível confirmar a atualização da tela. NÃO repita a operação. Atualize a página e verifique o histórico.':'Gravação não confirmada: '+(e.message||'erro desconhecido')),true);

  }finally{loader(false)}
}

function filterMaterialSelect(id){

function panelHome(){let pending=mats.filter(x=>!x.conferido).length;return `${mainNotice()}<div class="grid"><div class="card"><div class="label">Materiais cadastrados</div><div class="value">${mats.length}</div><div class="small">Códigos únicos</div></div><div class="card"><div class="label">Aguardando conferência</div><div class="value warn">${pending}</div><div class="small">Saldos a validar</div></div><div class="card"><div class="label">Sem localização</div><div class="value">${mats.filter(x=>!x.rua||!x.posicao).length}</div><div class="small">Preencher cadastro</div></div><div class="card"><div class="label">No mínimo ou abaixo</div><div class="value">${mats.filter(x=>x.quantidade<=x.minimo).length}</div><div class="small">Ponto de reposição</div></div></div><div class="section"><h2>Acesso rápido</h2></div><div class="buttons"><button class="btn" data-go="movimentar">+ Movimentar</button><button class="btn alt" data-go="pedidos">Separar pedido</button></div><div class="gap"></div><div class="card"><h2>Últimas movimentações</h2>${recent.length?recent.slice(0,6).map(m=>`<div class="item"><div><strong>${esc(m.nome)}</strong><p class="small">${esc(m.tipo)} · ${esc(m.operador||'')} · ${formatDate(m)}</p></div><b class="${m.delta<0?'red':'green'}">${m.delta>0?'+':''}${fmt(m.delta)}</b></div>`).join(''):'<div class="small">Nenhum movimento ainda.</div>'}</div>${mats.length===0?`<div class="notice"><b>Importe o catálogo privado de 218 materiais</b><div class="small">Abra a aba Segurança → Importar cadastro. Não publique o JSON no GitHub.</div></div>`:''}`}

function testeIdentificado(m){const fields=[m.solicitante,m.pedido,m.observacao].map(x=>String(x??'')).join(' ').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();return /\bnao\s+contabilizar\b|\bsimulac(?:ao|oes)\b|\bteste\s+(?:do\s+)?sistema\b|\bhomologac(?:ao|oes)\b/.test(fields)}
function dayRows(moves=todayMoves){const result=new Map();for(const m of moves){const code=String(m.codigo??'');const r=result.get(code)||{codigo:code,nome:String(m.nome??''),unidade:String(m.unidade??''),saida:0,devolucao:0,entrada:0,ajuste:0,testeSaida:0,testeDevolucao:0,testeEntrada:0,testes:0,solicitantes:new Set()};const quant=Math.abs(Number(m.quantidade??m.delta??0)),q=Number.isFinite(quant)?quant:0,isTest=testeIdentificado(m);if(m.tipo==='AJUSTE')r.ajuste+=Number(m.delta)||0;else if(isTest){r.testes++;if(m.tipo==='SAIDA')r.testeSaida+=q;else if(m.tipo==='DEVOLUCAO')r.testeDevolucao+=q;else if(m.tipo==='ENTRADA')r.testeEntrada+=q}else{if(m.tipo==='SAIDA')r.saida+=q;else if(m.tipo==='DEVOLUCAO')r.devolucao+=q;else if(m.tipo==='ENTRADA')r.entrada+=q}if(m.solicitante)r.solicitantes.add(m.solicitante);result.set(code,r)}return [...result.values()].map(r=>({...r,saida:rnd(r.saida),devolucao:rnd(r.devolucao),entrada:rnd(r.entrada),ajuste:rnd(r.ajuste),testeSaida:rnd(r.testeSaida),testeDevolucao:rnd(r.testeDevolucao),testeEntrada:rnd(r.testeEntrada),consumoLiquido:rnd(r.saida-r.devolucao)})).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'))}
function closeView(){const rows=dayRows(),withConsumption=rows.filter(r=>r.consumoLiquido>0).length,testCount=rows.reduce((total,r)=>total+r.testes,0);return `<h2>Fechamento diário detalhado</h2><div class="card"><div class="field"><label>Data da consulta</label><input type="date" id="dateInput" value="${dateFilter}"></div><div class="small">Registros confirmados no Firebase. Entradas, devoluções, ajustes e simulações separados.</div><div class="grid" style="margin-top:14px"><div><div class="value">${rows.length}</div><div class="small">Materiais com registros</div></div><div><div class="value">${withConsumption}</div><div class="small">Materiais com consumo líquido positivo</div></div><div><div class="value">${testCount}</div><div class="small">Lançamentos de teste identificados</div></div><div><div class="value">${rows.filter(r=>r.ajuste!==0).length}</div><div class="small">Materiais com ajuste de saldo</div></div></div><div class="buttons" style="margin-top:12px"><button class="btn" data-action="csv-day">Baixar fechamento CSV</button><button class="btn alt" data-action="csv-history">Histórico do dia</button></div><div class="buttons" style="margin-top:10px"><button class="btn" data-action="print-ci">Comunicação Interna · PDF</button><button class="btn alt" data-action="print-closing">Fechamento Diário · PDF</button></div><p class="small" style="margin-top:9px">Relatórios da New Termisa em versão legível para impressão A4 e PDF. Somente leitura do Firebase.</p><p class="small" style="margin-top:14px">Consumo operacional = saídas − devoluções, excluindo simulações identificadas. Não somamos unidades diferentes. Os registros são identificados como teste apenas quando os campos indicam claramente “Não contabilizar”, “Simulação”, “Teste do sistema” ou “Homologação”. Confira os lançamentos antes de contabilizar na empresa.</p></div><div class="list">${rows.map(r=>`<div class="card" style="margin-bottom:10px"><strong>${esc(r.nome)}</strong><p class="small">${esc(r.codigo)} · ${esc(r.unidade)} · ${esc([...r.solicitantes].join(', '))}</p><div style="margin-top:12px"><b>Consumo líquido operacional: ${fmt(r.consumoLiquido)} ${esc(r.unidade)}</b></div><div class="small" style="margin-top:4px">Saídas: ${fmt(r.saida)} · Devoluções: ${fmt(r.devolucao)} · Entradas: ${fmt(r.entrada)}</div><div class="small">Ajustes físicos: ${fmt(r.ajuste)}</div>${r.testes?`<div class="notice" style="margin-top:10px">Simulação identificada (${r.testes} registro(s)): saída ${fmt(r.testeSaida)} · devolução ${fmt(r.testeDevolucao)} · entrada ${fmt(r.testeEntrada)}. Não contabilizar como consumo real.</div>`:''}</div>`).join('')||'<div class="notice">Não houve movimentação nessa data.</div>'}</div>`}

function ntPlain(v){return esc(v??'')}
function ntDate(s){const p=String(s||'').split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:String(s||'')}
function ntTime(m){let d=m.criadoEm?.toDate?.()||new Date(m.timeClient||0);return Number.isFinite(d.getTime())?d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'--:--'}
function ntQty(m){const n=Number(m.quantidade);return Number.isFinite(n)&&n>0?n:Math.abs(Number(m.delta)||0)}
function ntChunk(items,budget){ // evita cortar nomes compridos quando existir muitos pedidos na mesma data
 let pages=[],one=[],used=0,index=0;
 for(const item of items){
  const longest=Math.max(String(item.nome||'').length/33,String(item.solicitante||'').length/22,String(item.pedido||'').length/18);
  const extra=Math.max(0,Math.ceil(longest)-1);const weight=1+0.65*extra;
  const capacity=index===0?budget[0]:budget[1];
  if(one.length&&used+weight>capacity){pages.push(one);one=[];used=0;index++}
  one.push(item);used+=weight;
 }
 if(one.length||!pages.length)pages.push(one);
 return pages;
}

function ntTop(title,subtitle,date,compact=false){return `<div class="rhead"><img src="${NT_LOGO}" alt="New Termisa"><div class="company"><b>${compact?'FECHAMENTO DIÁRIO':'ALMOXARIFADO / NEW TERMISA'}</b>${ntPlain(ntDate(date))}</div></div><div class="line"></div><h1 class="heading">${ntPlain(title)}</h1><p class="desc">${ntPlain(subtitle)}</p>`}
function ntFooter(num,total){return `<div class="footer"><span>NEW TERMISA &nbsp;|&nbsp; ALMOXARIFADO</span><span>PÁGINA ${num} DE ${total}</span></div>`}
function ntTable(heads,widths,rows){return `<table><colgroup>${widths.map(w=>`<col style="width:${w}%">`).join('')}</colgroup><thead><tr>${heads.map((x,i)=>`<th class="${i===4&&heads.length===7?'right':''}">${ntPlain(x)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(row=>`<tr>${row.map((v,i)=>`<td class="${i===1?'code':i===2?'name':i===4&&heads.length===7?'qty':''}">${ntPlain(v)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${heads.length}" class="empty">Nenhum registro encontrado para esta data.</td></tr>`}</tbody></table>`}
function ntHtml(title,pages){return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${ntPlain(title)}</title>${ntReportCSS()}</head><body><div class="toolbar"><button onclick="window.print()">Imprimir / Salvar em PDF</button>Confira o documento; na impressão, escolha <strong>Salvar como PDF</strong>.</div>${pages.join('')}</body></html>`}
function ntCI(movements,date){
 const entries=movements.filter(m=>m.tipo==='SAIDA'&&!testeIdentificado(m)).sort((a,b)=>String(a.timeClient||'').localeCompare(String(b.timeClient||'')));
 const requests=new Set(entries.map(m=>String(m.pedido||'').trim()).filter(Boolean));
 const people=new Set(entries.map(m=>String(m.solicitante||'').trim()).filter(Boolean));
 const kinds=new Set(entries.map(m=>String(m.codigo||'').trim()).filter(Boolean));
 const rows=entries.map(m=>({hora:ntTime(m),codigo:String(m.codigo||''),nome:String(m.nome||''),unidade:String(m.unidade||''),quantidade:fmt(ntQty(m)),solicitante:String(m.solicitante||'Não informado'),pedido:String(m.pedido||'—')}));
 const chunks=ntChunk(rows,[10,14]);let pages=[];
 for(let i=0;i<chunks.length;i++){
  const head=ntTop('COMUNICAÇÃO INTERNA','Saídas de materiais por solicitante, com rastreabilidade e referência de pedido.',date);
  const metrics=i===0?`<div class="metrics"><div class="metric"><small>ITENS ENTREGUES</small><strong>${rows.length}</strong></div><div class="metric"><small>PEDIDOS</small><strong>${requests.size}</strong></div><div class="metric"><small>SOLICITANTES</small><strong>${people.size}</strong></div><div class="metric"><small>MATERIAIS DISTINTOS</small><strong>${kinds.size}</strong></div></div>`:`<div class="sectionline"><span>CONTINUAÇÃO DOS LANÇAMENTOS</span><span>${ntPlain(ntDate(date))}</span></div>`;

function ntSaldosDoDia(movements){
 // O primeiro saldo "antes" e o último "depois" são históricos daquele dia,
 // não o saldo atual do catálogo. Sem registro confiável, mostra "—".
 const ordered=[...movements].sort((a,b)=>{
  const time=m=>{
   const t=m.criadoEm;
   if(t&&typeof t.toMillis==='function')return t.toMillis();
   if(t&&Number.isFinite(Number(t.seconds)))return Number(t.seconds)*1000+(Number(t.nanoseconds)||0)/1e6;
   const v=Date.parse(String(m.timeClient||''));
   return Number.isFinite(v)?v:0;
  };
  const c=time(a)-time(b);
  return c||String(a.timeClient||'').localeCompare(String(b.timeClient||''));
 });
 const found=new Map();
 for(const m of ordered){
  const code=String(m.codigo??'');
  if(!code)continue;
  const valid=v=>v!==null&&v!==undefined&&v!==''&&Number.isFinite(Number(v));
  const previous=found.get(code);
  if(!previous){found.set(code,{inicio:valid(m.antes)?Number(m.antes):null,fim:valid(m.depois)?Number(m.depois):null});}
  else{previous.fim=valid(m.depois)?Number(m.depois):null;}
 }
 return found;
}
function ntClosing(movements,date){

async function importCatalog(file){if(!file)return;let parsed;try{parsed=JSON.parse(await file.text())}catch(e){notice('JSON inválido.',true);return}if(parsed.formato!=='NEW_TERMISA_CATALOGO_218_V32'||!Array.isArray(parsed.materiais)||parsed.materiais.length!==218||new Set(parsed.materiais.map(i=>String(i.codigo))).size!==218){notice('Selecione o catálogo privado correto de 218 materiais.',true);return}if(!confirm('Importar os 218 itens em uma base VAZIA? Quantidades são referências não conferidas.'))return;await execute(async()=>{const snap=await getDocsFromServer(query(collection(db,'nt_web_materiais'),limit(1)));if(!snap.empty)throw Error('Já existem materiais! Importação bloqueada para não sobrescrever estoque.');const batch=writeBatch(db);for(const x of parsed.materiais){const code=String(x.codigo),qty=Number(x.quantidade)||0;if(qty<0||!Number.isFinite(qty))throw Error('Saldo inválido para '+code);batch.set(itemRef(code),{codigo:code,nome:String(x.nome),unidade:String(x.unidade||'MP'),rua:String(x.rua||''),posicao:String(x.posicao||''),minimo:Number(x.minimo)||0,preco:Number(x.custo)||0,quantidade:rnd(qty),baseV32:rnd(qty),conferido:false,origem:'App V32 não conferido',ultimoMovimentoId:'',criadoEm:serverTimestamp(),atualizadoEm:serverTimestamp()})}batch.set(doc(db,'nt_web_meta','catalogo'),{tipo:'APP_V32_218',quantidade:218,importadoPor:user.uid,importadoEm:serverTimestamp()});await batch.commit()})}
function rememberOrder(){window.orderPerson=$('orderPerson')?.value||window.orderPerson||'';window.orderNumber=$('orderNumber')?.value||window.orderNumber||''}
async function handleActions(e){const act=e.target.closest('[data-action]');if(!act)return;const a=act.dataset.action;try{if(a==='close'){close();return}if(a==='modal-count'){itemCount(act.dataset.code);return}if(a==='modal-edit'){itemEdit(act.dataset.code);return}if(a==='novo'){itemEdit();return}if(a==='logout'){await signOut(appAuth);return}if(a==='resetconfig'){if(confirm('Desconectar a configuração deste navegador?')){localStorage.removeItem('nt-firebase-web-config');location.reload()}return}if(a==='csv-stock'){stockCsv();return}if(a==='csv-day'){dayCsv();return}if(a==='csv-history'){eventsCsv();return}if(a==='print-ci'){ntOpenReport('ci');return}if(a==='print-closing'){ntOpenReport('closing');return}if(a==='backup'){await execute(fullBackup);return}if(a==='import'){$('arquivoCatalogo').click();return}if(a==='add-cart'){rememberOrder();const code=$('cartCode').value,q=rnd(nval($('cartQty').value)),m=material(code);if(!m||!(q>0)||!Number.isFinite(q))throw Error('Selecione material e quantidade válida.');if(!m.conferido)throw Error('Confira primeiro este material.');const ex=cart.find(x=>x.codigo===code),t=rnd((ex?.qtd||0)+q);if(t>m.quantidade)throw Error('Quantidade maior que saldo.');if(ex)ex.qtd=t;else cart.push({codigo:code,qtd:t});draw();return}if(a==='finish-cart'){rememberOrder();const person=window.orderPerson?.trim(),order=window.orderNumber?.trim();if(!person)throw Error('Informe o solicitante.');if(!cart.length)throw Error('Pedido vazio.');if(!confirm(`Finalizar ${cart.length} materiais para ${person}? Todos serão descontados juntos.`))return;const saved=await execute(async()=>{await doMoves(cart.map(r=>({...r,quantidade:r.qtd,tipo:'SAIDA'})),person,order,'Pedido separado');},cart.map(r=>r.codigo));if(saved){cart=[];window.orderPerson='';window.orderNumber='';draw()}return}}catch(err){notice(err.message,true)}}
function load(){if(location.protocol!=='https:' && location.hostname!=='localhost'){status('● Precisa publicar em HTTPS',false,true);$('app').innerHTML='<div class="alert"><b>Não use este arquivo diretamente de Downloads.</b><p class="small">Para sincronizar e proteger o estoque, publique apenas o index.html em um site HTTPS (ex.: GitHub Pages). Não registre movimentos neste arquivo local.</p></div>';return;}const raw=localStorage.getItem('nt-firebase-web-config') || JSON.stringify(EMBEDDED_FIREBASE_CONFIG);if(!raw){status('● Falta conectar',false,true);$('app').innerHTML=homeConfig();return}let cfg;try{cfg=JSON.parse(raw);if(cfg.projectId!=='new-termisa-estoque')throw Error('Projeto não autorizado. Utilize New Termisa Estoque, não o Firebase oficial.');const fb=initializeApp(cfg);appAuth=getAuth(fb);db=getFirestore(fb);}catch(e){status('● Configuração inválida',false,true);$('app').innerHTML=homeConfig();notice('Configuração não foi aceita: '+e.message,true);return}onAuthStateChanged(appAuth,u=>{user=u;if(!u){for(const f of unsubs)f();unsubs=[];if(bindDay.unsub)bindDay.unsub();mats=[];recent=[];todayMoves=[];cloudOk=false;serverReady=false;$('navigation').classList.add('hide');status('● Entre para acessar');$('app').innerHTML=loginView()}else{status('● Verificando nuvem');bindListeners()}})}
document.addEventListener('submit',async e=>{e.preventDefault();try{if(e.target.id==='configForm'){const data=parseConfig($('configText').value);localStorage.setItem('nt-firebase-web-config',JSON.stringify(data));location.reload();return}if(e.target.id==='loginForm'){loader(true);await signInWithEmailAndPassword(appAuth,$('email').value.trim(),$('senha').value);loader(false);return}if(e.target.id==='moveForm'){const code=$('moveCode').value,q=rnd(nval($('moveQty').value)),p=$('movePerson').value.trim(),ref=$('moveOrder').value.trim(),obs=$('moveObs').value.trim();if(!material(code)||!Number.isFinite(q)||q<=0||!p)throw Error('Preencha todos os campos corretamente.');if(!confirm(`${kind}: ${fmt(q)} de ${material(code).nome}\nSolicitante: ${p}\nSalvar no Firebase?`))return;const saved=await execute(()=>doMoves([{codigo:code,quantidade:q,tipo:kind}],p,ref,obs),[code]);if(saved)e.target.reset();return}if(e.target.id==='countForm'){const code=$('countCode').value,qty=rnd(nval($('countQty').value)),p=$('countPerson').value.trim();if(!Number.isFinite(qty)||qty<0||!p)throw Error('Informe contagem e responsável.');if(!confirm(`Confirmar saldo físico de ${fmt(qty)} para ${material(code)?.nome}?`))return;const saved=await execute(()=>adjustMaterial(code,qty,p),[code],{[code]:{quantidade:qty,conferido:true}});if(saved)close();return}if(e.target.id==='editForm'){await saveItem(e);return}}catch(err){loader(false);notice(err.message||'Operação falhou.',true)}});
document.addEventListener('click',async e=>{const go=e.target.closest('[data-go]');if(go){tab=go.dataset.go;draw();window.scrollTo({top:0});return}const del=e.target.closest('[data-remove]');if(del){rememberOrder();cart.splice(+del.dataset.remove,1);draw();return}const details=e.target.closest('[data-details]');if(details){detail(details.dataset.details);return}const b=e.target.closest('[data-type]');if(b){kind=b.dataset.type;draw();return}await handleActions(e)});
document.addEventListener('input',e=>{if(e.target.dataset.materialFilter){filterMaterialSelect(e.target.dataset.materialFilter);return}if(e.target.id==='searchInput'){filter=e.target.value;const pos=e.target.selectionStart;draw();$('searchInput')?.focus();$('searchInput')?.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{if(e.target.id==='moveCode'){const m=material(e.target.value);if($('stockHint'))$('stockHint').textContent=m?`Saldo: ${fmt(m.quantidade)} ${m.unidade} | ${m.rua||'Sem rua'}-${m.posicao||'?'} | ${m.conferido?'Conferido':'PENDENTE DE CONFERÊNCIA'}`:'Selecione o material.'}if(e.target.id==='dateInput'){dateFilter=e.target.value;bindDay();draw()}});
$('arquivoCatalogo').addEventListener('change',async e=>{try{isReady();await importCatalog(e.target.files?.[0])}catch(err){notice(err.message,true)}finally{e.target.value=''}});
window.addEventListener('online',()=>{serverReady=false;status('● Revalidando Firebase');if(user){for(const f of unsubs)f();bindListeners()}});window.addEventListener('offline',()=>{serverReady=false;status('● Sem internet',false,true)});
load();
</script></body></html>
