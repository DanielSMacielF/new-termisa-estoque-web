async function importOnlyMeasures(file){
 if(!file)return;
 isReady();
 const content=(await file.text()).replace(/^\uFEFF/,'');
 const lines=content.split(/\r?\n/).filter(x=>x.trim());
 const parse=line=>{const out=[];let value='',quoted=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(quoted&&line[i+1]==='"'){value+='"';i++}else quoted=!quoted}else if(ch===';'&&!quoted){out.push(value);value=''}else value+=ch}out.push(value);return out};
 const header=parse(lines.shift()||'').map(x=>x.trim());
 const codeIdx=header.indexOf('Código'),measureIdx=header.indexOf('Unidade de medida sugerida'),statusIdx=header.indexOf('Situação');
 if(codeIdx<0||measureIdx<0||statusIdx<0)throw Error('CSV inválido: use o arquivo de unidades conferidas.');
 const allowed=new Set(['UN','KG','G','M','M²','M2','L','ML','CX','PCT','PAR','ROL','JG']);
 const planned=[],seen=new Set();let skipped=0;
 for(const line of lines){
   const row=parse(line),code=(row[codeIdx]||'').trim(),unit=(row[measureIdx]||'').trim().toUpperCase(),state=(row[statusIdx]||'').trim();
   if(!/^\d{9}$/.test(code)||seen.has(code))throw Error('Código inválido ou duplicado no CSV: '+code);
   seen.add(code);
   if(state!=='CONFIRMADA NO CATÁLOGO'||!unit){skipped++;continue}
   if(!allowed.has(unit))throw Error('Unidade não permitida para '+code+': '+unit);
   const current=material(code);
   if(!current){skipped++;continue}
   if(current.unidadeMedida){if(current.unidadeMedida!==unit)throw Error('Unidade já cadastrada diferente para '+code+'. Operação cancelada.');skipped++;continue}
   planned.push({code,unit});
 }
 if(!planned.length){notice('Nenhuma unidade pendente para importar.');return}
 if(!confirm('Importar '+planned.length+' unidades de medida confirmadas? '+skipped+' linhas serão ignoradas. Esta operação altera SOMENTE unidadeMedida, sem tocar em quantidades, preços, nomes, categoria ou conferência.'))return;
 const batch=writeBatch(db);
 for(const x of planned)batch.update(itemRef(x.code),{unidadeMedida:x.unit});
 await batch.commit();
 notice('Unidades atualizadas: '+planned.length+'. Quantidades do estoque não foram alteradas.');
}

// Leitura opcional de QR Code: esta funcionalidade só localiza materiais.
// Nenhuma leitura altera saldos, pedidos ou conferência física.
let qrReader=null,qrReading=false;
function matchQrMaterial(raw){
  const value=String(raw??'').trim();
  const exact=mats.find(m=>String(m.codigo)===value);
  if(exact)return exact;
  const ids=new Set(value.match(/\b\d{6,16}\b/g)||[]);
  const hits=mats.filter(m=>ids.has(String(m.codigo)));
  return hits.length===1?hits[0]:null;
}
async function stopQr(){
  const inst=qrReader;qrReader=null;
  if(!inst)return;
  try{await inst.stop()}catch(_){ }
  try{inst.clear()}catch(_){ }
}
async function loadQrLibrary(){
  if(window.Html5Qrcode)return;
  await new Promise((resolve,reject)=>{
    const el=document.createElement('script');
    el.src='https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';
    el.onload=resolve;
    el.onerror=()=>reject(Error('Não foi possível carregar o leitor de QR Code. Verifique a internet.'));
    document.head.appendChild(el);
  });
  if(!window.Html5Qrcode)throw Error('Leitor QR indisponível neste navegador.');
}
async function openQr(target){
  if(!navigator.mediaDevices?.getUserMedia){
    notice('A câmera não está disponível neste navegador. Use o Chrome atualizado no celular.',true);return;
  }
  await stopQr();qrReading=false;
  panel('<h2>Ler QR Code do material</h2><p class="small">Aponte a câmera para a etiqueta. A leitura apenas seleciona o material: não altera o estoque.</p><div id="qr-reader" style="max-width:360px;margin:12px auto;background:#ffffff;color:#1d2939;border-radius:12px;overflow:hidden"></div><p class="small" id="qr-status">Solicitando acesso à câmera...</p><div class="buttons"><button class="btn ghost" type="button" data-action="qr-close">Fechar câmera</button></div>');
  try{
    await loadQrLibrary();
    if(!$('qr-reader'))return;
    const reader=new window.Html5Qrcode('qr-reader',{verbose:false});qrReader=reader;
    await reader.start({facingMode:'environment'}, {fps:10,qrbox:{width:220,height:220}},async raw=>{
      if(qrReading)return;qrReading=true;
      await stopQr();
      const m=matchQrMaterial(raw);
      if(!m){
        panel('<h2>QR lido, mas não identificado</h2><p class="small">Conteúdo encontrado:</p><p style="overflow-wrap:anywhere"><b>'+esc(raw)+'</b></p><p class="small">Ainda não existe um código igual no cadastro. Não vamos associar a outro material automaticamente.</p><div class="buttons"><button type="button" class="btn alt" data-action="scan-qr" data-scan-target="'+esc(target)+'">Ler novamente</button><button type="button" class="btn ghost" data-action="qr-close">Fechar</button></div>');
        qrReading=false;return;
      }
      close();
      if(target==='materiais'){
        filter=String(m.codigo);visibleMaterials=100;materialStatus='todos';materialStreet='todas';tab='materiais';draw();detail(m.codigo);
      }else{
        const input=$(target+'Search'),select=$(target);
        if(!input||!select){notice('Volte para a tela desejada e leia novamente.',true);return;}
        input.value=String(m.codigo);
        filterMaterialSelect(target);
        select.value=String(m.codigo);
        select.dispatchEvent(new Event('change',{bubbles:true}));
        notice('Material encontrado: '+m.nome+'. Confira a quantidade antes de salvar.');
      }
      qrReading=false;
    },()=>{});
    if($('qr-status'))$('qr-status').textContent='Câmera ativa. Aponte para o QR Code.';
  }catch(err){
    await stopQr();
    if($('qr-status'))$('qr-status').textContent='Não foi possível usar a câmera: '+(err?.message||err)+'. Confira a permissão do Chrome.';
    qrReading=false;
  }
}

if(a==='backup'){await execute(fullBackup);return}if(a==='import'){$('arquivoCatalogo').click();return}if(a==='add-cart'){rememberOrder();const code=$('cartCode').value,q=rnd(nval($('cartQty').value)),m=material(code);if(!m||!(q>0)||!Number.isFinite(q))throw Error('Selecione material e quantidade válida.');if(!m.conferido)throw Error('Confira primeiro este material.');const ex=cart.find(x=>x.codigo===code),t=rnd((ex?.qtd||0)+q);if(t>m.quantidade)throw Error('Quantidade maior que saldo.');if(ex)ex.qtd=t;else cart.push({codigo:code,qtd:t});draw();return}if(a==='finish-cart'){rememberOrder();const person=window.orderPerson?.trim(),order=window.orderNumber?.trim();if(!person)throw Error('Informe o solicitante.');if(!cart.length)throw Error('Pedido vazio.');if(!confirm(`Finalizar ${cart.length} materiais para ${person}? Todos serão descontados juntos.`))return;const saved=await execute(async()=>{await doMoves(cart.map(r=>({...r,quantidade:r.qtd,tipo:'SAIDA'})),person,order,'Pedido separado');},cart.map(r=>r.codigo));if(saved){cart=[];window.orderPerson='';window.orderNumber='';draw()}return}}catch(err){notice(err.message,true)}}
function load(){if(location.protocol!=='https:' && location.hostname!=='localhost'){status('● Precisa publicar em HTTPS',false,true);$('app').innerHTML='<div class="alert"><b>Não use este arquivo diretamente de Downloads.</b><p class="small">Para sincronizar e proteger o estoque, acesse o sistema somente pelo endereço HTTPS oficial da empresa. Não registre movimentos neste arquivo local.</p></div>';return;}const raw=localStorage.getItem('nt-firebase-web-config') || JSON.stringify(EMBEDDED_FIREBASE_CONFIG);if(!raw){status('● Falta conectar',false,true);$('app').innerHTML=homeConfig();return}let cfg;try{cfg=JSON.parse(raw);if(cfg.projectId!=='new-termisa-estoque')throw Error('Projeto não autorizado. Utilize New Termisa Estoque, não o Firebase oficial.');const fb=initializeApp(cfg);appAuth=getAuth(fb);db=getFirestore(fb);}catch(e){status('● Configuração inválida',false,true);$('app').innerHTML=homeConfig();notice('Configuração não foi aceita: '+e.message,true);return}onAuthStateChanged(appAuth,u=>{user=u;if(!u){for(const f of unsubs)f();unsubs=[];if(bindDay.unsub)bindDay.unsub();mats=[];recent=[];todayMoves=[];cloudOk=false;serverReady=false;$('navigation').classList.add('hide');status('● Entre para acessar');$('app').innerHTML=loginView()}else{status('● Verificando nuvem');bindListeners()}})}
document.addEventListener('submit',async e=>{e.preventDefault();try{if(e.target.id==='configForm'){const data=parseConfig($('configText').value);localStorage.setItem('nt-firebase-web-config',JSON.stringify(data));location.reload();return}if(e.target.id==='loginForm'){loader(true);await signInWithEmailAndPassword(appAuth,$('email').value.trim(),$('senha').value);loader(false);return}if(e.target.id==='moveForm'){if(kind==='ENTRADA')throw Error('Registre entradas pelo Recebimento integrado, incluindo fornecedor, PC e NF.');const code=$('moveCode').value,q=rnd(nval($('moveQty').value)),p=$('movePerson').value.trim(),ref=$('moveOrder').value.trim(),obs=$('moveObs').value.trim();if(!material(code)||!Number.isFinite(q)||q<=0||!p)throw Error('Preencha todos os campos corretamente.');if(!confirm(`${kind}: ${fmt(q)} de ${material(code).nome}\nSolicitante: ${p}\nSalvar no Firebase?`))return;const saved=await execute(()=>doMoves([{codigo:code,quantidade:q,tipo:kind}],p,ref,obs),[code]);if(saved)e.target.reset();return}if(e.target.id==='countForm'){const code=$('countCode').value,qty=rnd(nval($('countQty').value)),p=$('countPerson').value.trim();if(!Number.isFinite(qty)||qty<0||!p)throw Error('Informe contagem e responsável.');if(!confirm(`Confirmar saldo físico de ${fmt(qty)} para ${material(code)?.nome}?`))return;const saved=await execute(()=>adjustMaterial(code,qty,p),[code],{[code]:{quantidade:qty,conferido:true}});if(saved)close();return}if(e.target.id==='editForm'){await saveItem(e);return}}catch(err){loader(false);notice(err.message||'Operação falhou.',true)}});
document.addEventListener('click',async e=>{const tick=e.target.closest('[data-repos-tick]');if(tick){const c=tick.dataset.reposTick;ntReposToggle(c,!ntReposSelected.has(c));return}const summary=e.target.closest('summary');if(summary?.parentElement?.id==='inventoryFilterPanel'){filterPanelOpen=!summary.parentElement.open;return}const go=e.target.closest('[data-go]');if(go){if(tab==='movimentar'&&kind==='ENTRADA')ntReceiptCapture();ntClearTemporarySelections();close();tab=go.dataset.go;draw();window.scrollTo({top:0});return}const del=e.target.closest('[data-remove]');if(del){rememberOrder();cart.splice(+del.dataset.remove,1);draw();return}const details=e.target.closest('[data-details]');if(details){detail(details.dataset.details);return}const b=e.target.closest('[data-type]');if(b){if(kind==='ENTRADA')ntReceiptCapture();kind=b.dataset.type;draw();return}await handleActions(e)});
let ntMaterialSearchTimer=null;
document.addEventListener('input',e=>{if(e.target.id==='ntReposSearch'){ntReposRefresh();return}if(e.target.id==='ntLabelSearch'){ntRefreshLabelPanel();return}if(e.target.dataset.materialFilter){filterMaterialSelect(e.target.dataset.materialFilter);return}if(e.target.id==='searchInput'){
  filter=e.target.value;visibleMaterials=100;
  // Evita destruir o input em cada tecla repetida: segurar Backspace apaga continuamente.
  clearTimeout(ntMaterialSearchTimer);
  ntMaterialSearchTimer=setTimeout(()=>{
    const active=$('searchInput');if(!active||tab!=='materiais'||active.value!==filter)return;
    const pos=active.selectionStart;const end=active.selectionEnd;
    draw();const renewed=$('searchInput');if(renewed){renewed.focus({preventScroll:true});if(pos!==null&&end!==null)renewed.setSelectionRange(pos,end)}
  },320);
}});
document.addEventListener('change',async e=>{if(e.target.id==='ntHistoryDate'){const value=e.target.value;if(/^\d{4}-\d{2}-\d{2}$/.test(value)&&value<=day()){try{await ntShowTodayMovements(value,ntHistoryScope)}catch(err){notice('Não foi possível consultar a data: '+String(err.message||err),true)}}else notice('Escolha uma data válida até hoje.',true);return}if(e.target.id==='importMeasuresFile'){const file=e.target.files?.[0];try{await importOnlyMeasures(file)}catch(err){notice(err.message||'Falha ao importar unidades.',true)}finally{e.target.value=''}return}if(e.target.matches('[data-repos-check]')){ntReposToggle(e.target.dataset.reposCheck,e.target.checked);return}if(e.target.matches('[data-label-toggle]')){const code=e.target.dataset.labelToggle;if(e.target.checked)ntLabelCodes.add(code);else ntLabelCodes.delete(code);ntRefreshLabelPanel();return}if(e.target.id==='statusSelect'){filterPanelOpen=true;const v=e.target.value;if(['todos','pendentes','conferidos','sem-localizacao','estoque-baixo'].includes(v)){materialStatus=v;visibleMaterials=100;draw()}return}if(e.target.id==='streetSelect'){filterPanelOpen=true;const v=e.target.value;if(['todas','sem',...'ABCDEFGH'].includes(v)){materialStreet=v;visibleMaterials=100;draw()}return}if(e.target.id==='sortSelect'){filterPanelOpen=true;const v=e.target.value;if(['nome','localizacao'].includes(v)){materialSort=v;visibleMaterials=100;draw()}return}if(e.target.id==='moveCode'){const m=material(e.target.value);if($('stockHint'))$('stockHint').textContent=m?`Saldo: ${fmt(m.quantidade)} ${m.unidade} | ${m.rua||'Sem rua'}-${m.posicao||'?'} | ${m.conferido?'Conferido':'PENDENTE DE CONFERÊNCIA'}`:'Selecione o material.'}if(e.target.id==='ntManagerMonth'){if(/^\d{4}-\d{2}$/.test(e.target.value))ntManagerMonth=e.target.value;return}if(e.target.id==='dateInput'){dateFilter=e.target.value;bindDay();draw()}});
$('arquivoCatalogo').addEventListener('change',async e=>{try{isReady();await importCatalog(e.target.files?.[0])}catch(err){notice(err.message,true)}finally{e.target.value=''}});
window.addEventListener('online',()=>{serverReady=false;status('● Revalidando Firebase');if(user){for(const f of unsubs)f();bindListeners()}});window.addEventListener('offline',()=>{serverReady=false;status('● Sem internet',false,true)});
