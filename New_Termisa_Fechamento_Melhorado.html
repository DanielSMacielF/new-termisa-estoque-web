<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New Termisa - Fechamento detalhado</title><style>body{background:#061c32;color:#e8f3ff;font:16px system-ui,sans-serif;padding:28px;margin:0}main{max-width:640px;margin:auto;padding:18px;background:#123654;border-radius:14px;line-height:1.6}h2{margin-top:0}p{color:#c6daed}</style></head><body><main id="carregamento"><h2>New Termisa Almoxarifado</h2><p>Preparando a versão com fechamento diário detalhado...</p></main>
<script>
(async()=>{
  const main=document.getElementById('carregamento');
  const original='./New_Termisa_Estoque_Pedidos_Corrigidos.html';
  try{
    if(location.protocol!=='https:')throw Error('Abra esta versão pelo endereço GitHub Pages, depois de enviar o arquivo ao repositório.');
    const resposta=await fetch(original,{cache:'no-store'});
    if(!resposta.ok)throw Error('Não foi possível encontrar a versão-base no mesmo repositório (HTTP '+resposta.status+').');
    let html=await resposta.text();
    const patches={
      dayRows: String.raw`function testeIdentificado(m){const fields=[m.solicitante,m.pedido,m.observacao].map(x=>String(x??'')).join(' ').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();return /\bnao\s+contabilizar\b|\bsimulac(?:ao|oes)\b|\bteste\s+(?:do\s+)?sistema\b|\bhomologac(?:ao|oes)\b/.test(fields)}
function dayRows(){const result=new Map();for(const m of todayMoves){const code=String(m.codigo??'');const r=result.get(code)||{codigo:code,nome:String(m.nome??''),unidade:String(m.unidade??''),saida:0,devolucao:0,entrada:0,ajuste:0,testeSaida:0,testeDevolucao:0,testeEntrada:0,testes:0,solicitantes:new Set()};const quant=Math.abs(Number(m.quantidade??m.delta??0)),q=Number.isFinite(quant)?quant:0,isTest=testeIdentificado(m);if(m.tipo==='AJUSTE')r.ajuste+=Number(m.delta)||0;else if(isTest){r.testes++;if(m.tipo==='SAIDA')r.testeSaida+=q;else if(m.tipo==='DEVOLUCAO')r.testeDevolucao+=q;else if(m.tipo==='ENTRADA')r.testeEntrada+=q}else{if(m.tipo==='SAIDA')r.saida+=q;else if(m.tipo==='DEVOLUCAO')r.devolucao+=q;else if(m.tipo==='ENTRADA')r.entrada+=q}if(m.solicitante)r.solicitantes.add(m.solicitante);result.set(code,r)}return [...result.values()].map(r=>({...r,saida:rnd(r.saida),devolucao:rnd(r.devolucao),entrada:rnd(r.entrada),ajuste:rnd(r.ajuste),testeSaida:rnd(r.testeSaida),testeDevolucao:rnd(r.testeDevolucao),testeEntrada:rnd(r.testeEntrada),consumoLiquido:rnd(r.saida-r.devolucao)})).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'))}`,
      closeView: String.raw`function closeView(){const rows=dayRows(),withConsumption=rows.filter(r=>r.consumoLiquido>0).length,testCount=rows.reduce((total,r)=>total+r.testes,0);return \`<h2>Fechamento diário detalhado</h2><div class="card"><div class="field"><label>Data da consulta</label><input type="date" id="dateInput" value="\${dateFilter}"></div><div class="small">Registros confirmados no Firebase. Entradas, devoluções, ajustes e simulações separados.</div><div class="grid" style="margin-top:14px"><div><div class="value">\${rows.length}</div><div class="small">Materiais com registros</div></div><div><div class="value">\${withConsumption}</div><div class="small">Materiais com consumo líquido positivo</div></div><div><div class="value">\${testCount}</div><div class="small">Lançamentos de teste identificados</div></div><div><div class="value">\${rows.filter(r=>r.ajuste!==0).length}</div><div class="small">Materiais com ajuste de saldo</div></div></div><div class="buttons" style="margin-top:12px"><button class="btn" data-action="csv-day">Baixar fechamento CSV</button><button class="btn alt" data-action="csv-history">Histórico do dia</button></div><p class="small" style="margin-top:14px">Consumo operacional = saídas − devoluções, excluindo simulações identificadas. Não somamos unidades diferentes. Os registros são identificados como teste apenas quando os campos indicam claramente “Não contabilizar”, “Simulação”, “Teste do sistema” ou “Homologação”. Confira os lançamentos antes de contabilizar na empresa.</p></div><div class="list">\${rows.map(r=>\`<div class="card" style="margin-bottom:10px"><strong>\${esc(r.nome)}</strong><p class="small">\${esc(r.codigo)} · \${esc(r.unidade)} · \${esc([...r.solicitantes].join(', '))}</p><div style="margin-top:12px"><b>Consumo líquido operacional: \${fmt(r.consumoLiquido)} \${esc(r.unidade)}</b></div><div class="small" style="margin-top:4px">Saídas: \${fmt(r.saida)} · Devoluções: \${fmt(r.devolucao)} · Entradas: \${fmt(r.entrada)}</div><div class="small">Ajustes físicos: \${fmt(r.ajuste)}</div>\${r.testes?\`<div class="notice" style="margin-top:10px">Simulação identificada (\${r.testes} registro(s)): saída \${fmt(r.testeSaida)} · devolução \${fmt(r.testeDevolucao)} · entrada \${fmt(r.testeEntrada)}. Não contabilizar como consumo real.</div>\`:''}</div>\`).join('')||'<div class="notice">Não houve movimentação nessa data.</div>'}</div>\`}`,
      dayCsv: String.raw`function dayCsv(){download(csv([['Data','Código','Material','Unidade','Saídas operacionais','Devoluções operacionais','Consumo líquido operacional','Entradas operacionais','Ajustes de conferência','Saídas de simulação','Devoluções de simulação','Entradas de simulação','Nº registros de simulação','Solicitantes'],...dayRows().map(r=>[dateFilter,r.codigo,r.nome,r.unidade,r.saida,r.devolucao,r.consumoLiquido,r.entrada,r.ajuste,r.testeSaida,r.testeDevolucao,r.testeEntrada,r.testes,[...r.solicitantes].join(' | ')])]),\`NewTermisa_Fechamento_Detalhado_\${dateFilter}.csv\`,'text/csv;charset=utf-8')}`,
      eventsCsv: String.raw`function eventsCsv(){download(csv([['ID','Data','Horário','Código','Material','Tipo','Quantidade assinada','Saldo antes','Saldo depois','Solicitante','Pedido','Observação','Operador','Simulação identificada'],...todayMoves.map(r=>[r.id,r.dia,formatDate(r),r.codigo,r.nome,r.tipo,r.delta,r.antes,r.depois,r.solicitante,r.pedido,r.observacao||'',r.operador,testeIdentificado(r)?'SIM':'NÃO'])]),\`NewTermisa_Historico_Detalhado_\${dateFilter}.csv\`,'text/csv;charset=utf-8')}`
    };
    // Remove escaping added for the nested JavaScript template literals above.
    for(const [name,raw] of Object.entries(patches)){
      const originalFn=new RegExp('^function '+name+'\\(\\).*?$','m');
      if(!originalFn.test(html))throw Error('Esta versão-base mudou. Não foi possível corrigir com segurança: '+name+'.');
      const replacement=raw.replace(/\\`/g,'`').replace(/\\\$\{/g,'${');
      html=html.replace(originalFn,()=>replacement);
    }
    if(!html.includes('function testeIdentificado(m)')||!html.includes('function closeView()'))throw Error('Falha na validação da melhoria.');
    document.open();document.write(html);document.close();
  }catch(e){main.innerHTML='<h2>Atualização não carregada</h2><p>'+String(e.message).replace(/[<>&]/g,'')+'</p><p>Nenhum dado do estoque foi alterado. Abra a versão anterior para continuar.</p>';}
})();
</script></body></html>
