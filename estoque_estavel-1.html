async function consultarSaldosServidor(codigos, esperados={}){
  const unicos=[...new Set(codigos.map(String))];
  if(!unicos.length)return;
  const respostas=[];
  for(let inicio=0;inicio<unicos.length;inicio+=30){
    const grupo=unicos.slice(inicio,inicio+30);
    const q=query(collection(db,'nt_web_materiais'),where('codigo','in',grupo));
    const consulta=await getDocsFromServer(q);
    for(const registro of consulta.docs)respostas.push(registro.data());
  }
  if(respostas.length!==unicos.length)throw Error('Alguns materiais não foram encontrados na verificação de leitura.');
  for(const registro of respostas){
    const esperado=esperados[String(registro.codigo)];
    if(esperado && esperado.quantidade!==undefined && Math.abs(Number(registro.quantidade)-Number(esperado.quantidade))>0.00001)
      throw Error('Quantidade ainda não confirmada na nuvem: '+registro.codigo);
    if(esperado && esperado.conferido!==undefined && registro.conferido!==esperado.conferido)
      throw Error('Conferência ainda não confirmada na nuvem: '+registro.codigo);
  }
  for(const registro of respostas){
    const i=mats.findIndex(r=>String(r.codigo)===String(registro.codigo));
    if(i>=0)mats[i]=registro;else mats.push(registro);
  }
  mats.sort((a,b)=>String(a.nome).localeCompare(String(b.nome),'pt-BR'));
  cloudOk=true;serverReady=true;status('● Sincronizado',true);draw();
}
async function execute(fn,codigos=[],esperados={}){
  let gravado=false;

    isReady();loader(true);await fn();gravado=true;
    await consultarSaldosServidor(codigos,esperados);
    notice(codigos.length?'Dados atualizados e confirmados no Firebase!':'Gravação confirmada no Firebase!');
    return true;
  }catch(e){
    notice((gravado?'Dados gravados, mas ainda não foi possível confirmar a atualização da tela. NÃO repita a operação. Atualize a página e verifique o histórico.':'Gravação não confirmada: '+(e.message||'erro desconhecido')),true);
    return false;
  }finally{loader(false)}
}
function homeConfig(){return `<div class="pane"><div class="alert"><b>Configuração necessária</b><p class="small">Conecte ao Firebase do seu projeto antes de usar. O arquivo de cadastro fica separado para não ficar público.</p></div><form id="configForm" class="card"><h2>Conectar projeto Firebase</h2><p class="small">No Firebase: Configurações do projeto → Seus apps → Web → Configuração. Copie apenas o objeto <b>firebaseConfig</b>. Não envie sua senha.</p><div class="field"><label>Configuração Web do Firebase</label><textarea required id="configText" placeholder="const firebaseConfig = { apiKey: '...', authDomain: '...', projectId: '...', appId: '...' };"></textarea></div><button class="btn" type="submit">Salvar configuração neste navegador</button></form><p class="foot">Este endereço deve ser publicado em HTTPS. Não use a cópia local content:// para fazer lançamentos.</p></div>`}

function loginView(){return `<div class="pane"><div class="card"><h2>Entrar no estoque da empresa</h2><p class="small">Utilize a conta de e-mail e senha criada em Authentication no Firebase. A conta Google do Chrome não precisa ser a mesma.</p><form id="loginForm"><div class="field"><label>E-mail autorizado</label><input type="email" id="email" autocomplete="username" required></div><div class="field"><label>Senha</label><input type="password" id="senha" autocomplete="current-password" required></div><button class="btn" type="submit">Entrar no almoxarifado</button></form></div><div class="notice"><b>Controle de acesso</b><div class="small">Somente os UIDs permitidos nas regras do Firestore poderão consultar ou alterar o estoque.</div></div><button class="btn ghost" data-action="resetconfig">Trocar projeto Firebase</button></div>`}

function panelHome(){let pending=mats.filter(x=>!x.conferido).length;return `${mainNotice()}<div class="grid"><div class="card"><div class="label">Materiais cadastrados</div><div class="value">${mats.length}</div><div class="small">Códigos únicos</div></div><div class="card"><div class="label">Aguardando conferência</div><div class="value warn">${pending}</div><div class="small">Saldos a validar</div></div><div class="card"><div class="label">Sem localização</div><div class="value">${mats.filter(x=>!x.rua||!x.posicao).length}</div><div class="small">Preencher cadastro</div></div><div class="card"><div class="label">No mínimo ou abaixo</div><div class="value">${mats.filter(x=>x.quantidade<=x.minimo).length}</div><div class="small">Ponto de reposição</div></div></div><div class="section"><h2>Acesso rápido</h2></div><div class="buttons"><button class="btn" data-go="movimentar">+ Movimentar</button><button class="btn alt" data-go="pedidos">Separar pedido</button></div><div class="gap"></div><div class="card"><h2>Últimas movimentações</h2>${recent.length?recent.slice(0,6).map(m=>`<div class="item"><div><strong>${esc(m.nome)}</strong><p class="small">${esc(m.tipo)} · ${esc(m.operador||'')} · ${formatDate(m)}</p></div><b class="${m.delta<0?'red':'green'}">${m.delta>0?'+':''}${fmt(m.delta)}</b></div>`).join(''):'<div class="small">Nenhum movimento ainda.</div>'}</div>${mats.length===0?`<div class="notice"><b>Importe o catálogo privado de 218 materiais</b><div class="small">Abra a aba Segurança → Importar cadastro. Não publique o JSON no GitHub.</div></div>`:''}`}

function orderView(){return `${mainNotice()}<h2>Separação de pedido</h2><div class="card"><div class="field"><label>Solicitante</label><input id="orderPerson" value="${esc(window.orderPerson||'')}"></div><div class="field"><label>Número / referência do pedido</label><input id="orderNumber" value="${esc(window.orderNumber||'')}"></div><div class="field"><label>Material</label>${itemSelect('cartCode')}</div><div class="field"><label>Quantidade</label><input id="cartQty" inputmode="decimal" placeholder="Quantidade"></div><button class="btn alt" data-action="add-cart">Adicionar ao pedido</button></div><div class="card"><h2>Itens do pedido (${cart.length})</h2>${cart.map((x,i)=>`<div class="item"><div><strong>${esc(material(x.codigo)?.nome||x.codigo)}</strong><p class="small">${fmt(x.qtd)} · ${esc(x.codigo)}</p></div><button class="btn danger" data-remove="${i}">Remover</button></div>`).join('')||'<div class="small">Adicione materiais acima.</div>'}<div class="gap"></div><button class="btn" data-action="finish-cart" ${cart.length?'':'disabled'}>Finalizar e descontar todos os itens</button></div>`}
function dayRows(){const result=new Map;for(const m of todayMoves){const r=result.get(m.codigo)||{codigo:m.codigo,nome:m.nome,unidade:m.unidade,saida:0,entrada:0,ajuste:0,solicitantes:new Set()};if(m.tipo==='SAIDA')r.saida+=-m.delta;else if(m.tipo==='AJUSTE')r.ajuste+=m.delta;else r.entrada+=m.delta;if(m.solicitante)r.solicitantes.add(m.solicitante);result.set(m.codigo,r)}return [...result.values()].sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'))}

function draw(){if(!user)return;$('navigation').classList.remove('hide');for(const b of $('navigation').querySelectorAll('button'))b.classList.toggle('active',b.dataset.go===tab);$('app').innerHTML= !cloudOk?'<div class="alert">Não foi possível ler o estoque no Firebase. Confira as regras de segurança e o UID autorizado.</div>':({painel:panelHome,materiais:materialList,movimentar:moveView,pedidos:orderView,fechamento:closeView,seguranca:securityView})[tab]();}
function formatDate(m){let d=m.criadoEm?.toDate?.()||new Date(m.timeClient||Date.now());return d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function bindListeners(){for(const f of unsubs)f();unsubs=[];serverReady=false;cloudOk=false;unsubs.push(onSnapshot(query(collection(db,'nt_web_materiais'),orderBy('nome')),{includeMetadataChanges:true},snap=>{mats=snap.docs.map(d=>d.data());serverReady=!snap.metadata.fromCache&&!snap.metadata.hasPendingWrites&&navigator.onLine;cloudOk=true;status(serverReady?'● Sincronizado':'● Sem conexão confirmada',serverReady,!serverReady);draw()},e=>{status('● Acesso negado',false,true);cloudOk=false;draw();notice('Não conseguiu acessar materiais: '+e.message,true)}));unsubs.push(onSnapshot(query(collection(db,'nt_web_movimentos'),orderBy('criadoEm','desc'),limit(40)),snap=>{recent=snap.docs.map(d=>d.data());if(tab==='painel')draw()},e=>notice('Histórico: '+e.message,true)));bindDay()}
function bindDay(){if(bindDay.unsub)bindDay.unsub();todayMoves=[];bindDay.unsub=onSnapshot(query(collection(db,'nt_web_movimentos'),where('dia','==',dateFilter)),snap=>{todayMoves=snap.docs.map(d=>d.data()).sort((a,b)=>String(a.timeClient).localeCompare(String(b.timeClient)));if(tab==='fechamento')draw()},e=>notice('Fechamento: '+e.message,true))}
async function doMoves(rows,person,order,obs){if(!rows.length)throw Error('Selecione um material');if(!person)throw Error('Informe o solicitante.');if(rows.length>100)throw Error('Máximo de 100 itens por pedido.');for(const r of rows){if(!allowedTypes.includes(r.tipo)||!Number.isFinite(r.quantidade)||r.quantidade<=0)throw Error('Quantidade inválida.')}const refs=rows.map(x=>itemRef(x.codigo)),evts=rows.map(()=>moveRef()),when=new Date(),stamp=when.toISOString(),theDay=day();await runTransaction(db,async tx=>{const snaps=[];for(const ref of refs)snaps.push(await tx.get(ref));for(let j=0;j<rows.length;j++){const s=snaps[j],r=rows[j];if(!s.exists())throw Error('Material não existe no Firebase: '+r.codigo);const item=s.data();if(!item.conferido&&r.tipo==='SAIDA')throw Error('Confira fisicamente antes de retirar: '+item.nome);const before=Number(item.quantidade),delta=r.tipo==='SAIDA'?-r.quantidade:r.quantidade,after=rnd(before+delta);if(after<0)throw Error('Saldo insuficiente de '+item.nome+' ('+fmt(before)+').');const mv={id:evts[j].id,codigo:r.codigo,nome:item.nome,unidade:item.unidade,tipo:r.tipo,quantidade:r.quantidade,delta,antes:before,depois:after,solicitante:person,pedido:order||'',observacao:obs||'',operador:user.email||'',uid:user.uid,dia:theDay,timeClient:stamp,criadoEm:serverTimestamp()};tx.update(refs[j],{quantidade:after,ultimoMovimentoId:evts[j].id,atualizadoEm:serverTimestamp()});tx.set(evts[j],mv)}})}
async function adjustMaterial(code,qty,person){const r=itemRef(code),m=moveRef(),stamp=new Date().toISOString();await runTransaction(db,async tx=>{const s=await tx.get(r);if(!s.exists())throw Error('Material não localizado.');const x=s.data(),prev=Number(x.quantidade),delta=rnd(qty-prev);if(x.conferido && Math.abs(prev-qty)<0.00001)throw Error('A mesma quantidade já está conferida. Nenhum ajuste duplicado foi criado.');tx.update(r,{quantidade:qty,conferido:true,ultimoMovimentoId:m.id,conferidoPor:person,conferidoEm:serverTimestamp(),atualizadoEm:serverTimestamp()});tx.set(m,{id:m.id,codigo:code,nome:x.nome,unidade:x.unidade,tipo:'AJUSTE',quantidade:Math.abs(delta),delta,antes:prev,depois:qty,solicitante:person,pedido:'CONFERÊNCIA FÍSICA',observacao:'Ajuste de contagem física',operador:user.email||'',uid:user.uid,dia:day(),timeClient:stamp,criadoEm:serverTimestamp()})})}
function detail(code){const m=material(code);if(!m)return;panel(`<h2>${esc(m.nome)}</h2><p class="small">Código: ${esc(m.codigo)} · ${esc(m.unidade)}</p><div class="value">${fmt(m.quantidade)}</div><p class="small">${esc(m.rua||'Rua pendente')}-${esc(m.posicao||'?')} · ${m.conferido?'Conferido':'Não conferido'}</p><div class="gap"></div><div class="buttons"><button class="btn" data-action="modal-count" data-code="${esc(code)}">Conferir saldo</button><button class="btn alt" data-action="modal-edit" data-code="${esc(code)}">Editar cadastro</button><button class="btn ghost" data-action="close">Fechar</button></div>`)}
function itemEdit(code=null){const m=code?material(code):null;panel(`<h2>${m?'Editar cadastro':'Cadastrar material'}</h2><form id="editForm"><div class="field"><label>Código</label><input id="editCode" value="${esc(m?.codigo||'')}" ${m?'readonly':'required'} required></div><div class="field"><label>Nome completo</label><input id="editName" value="${esc(m?.nome||'')}" required></div><div class="field"><label>Unidade</label><input id="editUnit" value="${esc(m?.unidade||'MP')}" required></div><div class="field"><label>Rua A–H</label><select id="editStreet"><option value="">Sem localização</option>${'ABCDEFGH'.split('').map(x=>`<option ${x===m?.rua?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Número 1–50</label><input id="editPos" inputmode="numeric" value="${esc(m?.posicao||'')}"></div><div class="field"><label>Estoque mínimo</label><input id="editMin" inputmode="decimal" value="${esc(m?.minimo??0)}"></div><div class="field"><label>Preço R$</label><input id="editPrice" inputmode="decimal" value="${esc(m?.preco??0)}"></div>${!m?'<div class="alert">O novo item começa com saldo zero. Faça a conferência física após cadastrar.</div>':''}<div class="buttons"><button class="btn" type="submit">Salvar no Firebase</button><button class="btn alt" type="button" data-action="close">Cancelar</button></div></form>`)}
function itemCount(code){const m=material(code);if(!m)return;panel(`<h2>Conferir saldo físico</h2><p>${esc(m.nome)}</p><p class="small">Saldo registrado: <b>${fmt(m.quantidade)} ${esc(m.unidade)}</b></p><form id="countForm"><input type="hidden" id="countCode" value="${esc(code)}"><div class="field"><label>Quantidade física contada</label><input id="countQty" required inputmode="decimal" placeholder="Quantidade real"></div><div class="field"><label>Responsável pela conferência</label><input id="countPerson" required></div><div class="buttons"><button class="btn" type="submit">Confirmar contagem</button><button class="btn alt" type="button" data-action="close">Cancelar</button></div></form>`)}
async function saveItem(e){e.preventDefault();const code=$('editCode').value.trim(),name=$('editName').value.trim(),unit=$('editUnit').value.trim(),street=$('editStreet').value,pos=$('editPos').value.trim(),min=nval($('editMin').value),price=nval($('editPrice').value);if(!code||!/^[A-Za-z0-9-]{2,40}$/.test(code)||!name||!unit||!Number.isFinite(min)||min<0||!Number.isFinite(price)||price<0||((!!street)!=(!!pos))||(pos&&(!/^\d+$/.test(pos)||+pos<1||+pos>50))){notice('Verifique os dados e a localização.',true);return}if(street&&mats.some(x=>x.codigo!==code&&x.rua===street&&Number(x.posicao)===Number(pos))&&!confirm('Essa localização já está ocupada. Manter duplicada?'))return;const fields={nome:name,unidade:unit,rua:street,posicao:pos,minimo:rnd(min),preco:rnd(price)};const before=material(code);if(!confirm('Salvar alterações do cadastro no Firebase?'))return;const saved=await execute(async()=>{if(before){const aref=doc(collection(db,'nt_web_auditoria'));await runTransaction(db,async tx=>{const ref=itemRef(code),old=await tx.get(ref);if(!old.exists())throw Error('O material não existe mais.');tx.update(ref,{...fields,atualizadoEm:serverTimestamp()});tx.set(aref,{codigo:code,antes:old.data(),depois:fields,operador:user.email,criadoEm:serverTimestamp()})})}else{const ref=itemRef(code),aref=doc(collection(db,'nt_web_auditoria'));await runTransaction(db,async tx=>{const old=await tx.get(ref);if(old.exists())throw Error('Código já cadastrado.');tx.set(ref,{codigo:code,...fields,quantidade:0,baseV32:0,conferido:false,origem:'CADASTRO NOVO',criadoEm:serverTimestamp(),atualizadoEm:serverTimestamp(),ultimoMovimentoId:''});tx.set(aref,{codigo:code,acao:'NOVO_MATERIAL',operador:user.email,criadoEm:serverTimestamp()})})}},[code]);if(saved)close()}
function csv(rows){return '\ufeff'+rows.map(row=>row.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(';')).join('\r\n')}function download(text,name,mime){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type:mime}));a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
function stockCsv(){download(csv([['Código','Material','Unidade','Rua','Número','Saldo atual','Conferido','Preço R$','Estoque mínimo'],...mats.map(x=>[x.codigo,x.nome,x.unidade,x.rua,x.posicao,x.quantidade,x.conferido?'SIM':'NÃO',x.preco,x.minimo])]),`NewTermisa_Estoque_${day()}.csv`,'text/csv;charset=utf-8')}
function dayCsv(){download(csv([['Data','Código','Material','Unidade','Saídas','Entradas e devoluções','Ajuste','Solicitantes'],...dayRows().map(r=>[dateFilter,r.codigo,r.nome,r.unidade,r.saida,r.entrada,r.ajuste,[...r.solicitantes].join(' | ')])]),`NewTermisa_Fechamento_${dateFilter}.csv`,'text/csv;charset=utf-8')}
function eventsCsv(){download(csv([['ID','Data','Horário','Código','Material','Tipo','Quantidade','Saldo antes','Saldo depois','Solicitante','Pedido','Operador'],...todayMoves.map(r=>[r.id,r.dia,formatDate(r),r.codigo,r.nome,r.tipo,r.delta,r.antes,r.depois,r.solicitante,r.pedido,r.operador])]),`NewTermisa_Historico_${dateFilter}.csv`,'text/csv;charset=utf-8')}
async function fullBackup(){const m=await getDocsFromServer(collection(db,'nt_web_materiais')),h=await getDocsFromServer(collection(db,'nt_web_movimentos')),audit=await getDocsFromServer(collection(db,'nt_web_auditoria'));const replacer=v=>JSON.parse(JSON.stringify(v,(k,val)=>val&&typeof val.toDate==='function'?val.toDate().toISOString():val));const obj={formato:'NEW_TERMISA_FIREBASE_BACKUP_V1',exportadoEm:new Date().toISOString(),projeto:db.app.options.projectId,materiais:m.docs.map(x=>replacer(x.data())),movimentos:h.docs.map(x=>replacer(x.data())),auditoria:audit.docs.map(x=>replacer(x.data()))};download(JSON.stringify(obj,null,2),`NewTermisa_Backup_${day()}.json`,'application/json')}
async function importCatalog(file){if(!file)return;let parsed;try{parsed=JSON.parse(await file.text())}catch(e){notice('JSON inválido.',true);return}if(parsed.formato!=='NEW_TERMISA_CATALOGO_218_V32'||!Array.isArray(parsed.materiais)||parsed.materiais.length!==218||new Set(parsed.materiais.map(i=>String(i.codigo))).size!==218){notice('Selecione o catálogo privado correto de 218 materiais.',true);return}if(!confirm('Importar os 218 itens em uma base VAZIA? Quantidades são referências não conferidas.'))return;await execute(async()=>{const snap=await getDocsFromServer(query(collection(db,'nt_web_materiais'),limit(1)));if(!snap.empty)throw Error('Já existem materiais! Importação bloqueada para não sobrescrever estoque.');const batch=writeBatch(db);for(const x of parsed.materiais){const code=String(x.codigo),qty=Number(x.quantidade)||0;if(qty<0||!Number.isFinite(qty))throw Error('Saldo inválido para '+code);batch.set(itemRef(code),{codigo:code,nome:String(x.nome),unidade:String(x.unidade||'MP'),rua:String(x.rua||''),posicao:String(x.posicao||''),minimo:Number(x.minimo)||0,preco:Number(x.custo)||0,quantidade:rnd(qty),baseV32:rnd(qty),conferido:false,origem:'App V32 não conferido',ultimoMovimentoId:'',criadoEm:serverTimestamp(),atualizadoEm:serverTimestamp()})}batch.set(doc(db,'nt_web_meta','catalogo'),{tipo:'APP_V32_218',quantidade:218,importadoPor:user.uid,importadoEm:serverTimestamp()});await batch.commit()})}
function rememberOrder(){window.orderPerson=$('orderPerson')?.value||window.orderPerson||'';window.orderNumber=$('orderNumber')?.value||window.orderNumber||''}
async function handleActions(e){const act=e.target.closest('[data-action]');if(!act)return;const a=act.dataset.action;try{if(a==='close'){close();return}if(a==='modal-count'){itemCount(act.dataset.code);return}if(a==='modal-edit'){itemEdit(act.dataset.code);return}if(a==='novo'){itemEdit();return}if(a==='logout'){await signOut(appAuth);return}if(a==='resetconfig'){if(confirm('Desconectar a configuração deste navegador?')){localStorage.removeItem('nt-firebase-web-config');location.reload()}return}if(a==='csv-stock'){stockCsv();return}if(a==='csv-day'){dayCsv();return}if(a==='csv-history'){eventsCsv();return}if(a==='backup'){await execute(fullBackup);return}if(a==='import'){$('arquivoCatalogo').click();return}if(a==='add-cart'){rememberOrder();const code=$('cartCode').value,q=rnd(nval($('cartQty').value)),m=material(code);if(!m||!(q>0)||!Number.isFinite(q))throw Error('Selecione material e quantidade válida.');if(!m.conferido)throw Error('Confira primeiro este material.');const ex=cart.find(x=>x.codigo===code),t=rnd((ex?.qtd||0)+q);if(t>m.quantidade)throw Error('Quantidade maior que saldo.');if(ex)ex.qtd=t;else cart.push({codigo,qtd:t});draw();return}if(a==='finish-cart'){rememberOrder();const person=window.orderPerson?.trim(),order=window.orderNumber?.trim();if(!person)throw Error('Informe o solicitante.');if(!cart.length)throw Error('Pedido vazio.');if(!confirm(`Finalizar ${cart.length} materiais para ${person}? Todos serão descontados juntos.`))return;const saved=await execute(async()=>{await doMoves(cart.map(r=>({...r,quantidade:r.qtd,tipo:'SAIDA'})),person,order,'Pedido separado');},cart.map(r=>r.codigo));if(saved){cart=[];window.orderPerson='';window.orderNumber='';draw()}return}}catch(err){notice(err.message,true)}}
function load(){if(location.protocol!=='https:' && location.hostname!=='localhost'){status('● Precisa publicar em HTTPS',false,true);$('app').innerHTML='<div class="alert"><b>Não use este arquivo diretamente de Downloads.</b><p class="small">Para sincronizar e proteger o estoque, publique apenas o index.html em um site HTTPS (ex.: GitHub Pages). Não registre movimentos neste arquivo local.</p></div>';return;}const raw=localStorage.getItem('nt-firebase-web-config') || JSON.stringify(EMBEDDED_FIREBASE_CONFIG);if(!raw){status('● Falta conectar',false,true);$('app').innerHTML=homeConfig();return}let cfg;try{cfg=JSON.parse(raw);if(cfg.projectId!=='new-termisa-estoque')throw Error('Projeto não autorizado. Utilize New Termisa Estoque, não o Firebase oficial.');const fb=initializeApp(cfg);appAuth=getAuth(fb);db=getFirestore(fb);}catch(e){status('● Configuração inválida',false,true);$('app').innerHTML=homeConfig();notice('Configuração não foi aceita: '+e.message,true);return}onAuthStateChanged(appAuth,u=>{user=u;if(!u){for(const f of unsubs)f();unsubs=[];if(bindDay.unsub)bindDay.unsub();mats=[];recent=[];todayMoves=[];cloudOk=false;serverReady=false;$('navigation').classList.add('hide');status('● Entre para acessar');$('app').innerHTML=loginView()}else{status('● Verificando nuvem');bindListeners()}})}
document.addEventListener('submit',async e=>{e.preventDefault();try{if(e.target.id==='configForm'){const data=parseConfig($('configText').value);localStorage.setItem('nt-firebase-web-config',JSON.stringify(data));location.reload();return}if(e.target.id==='loginForm'){loader(true);await signInWithEmailAndPassword(appAuth,$('email').value.trim(),$('senha').value);loader(false);return}if(e.target.id==='moveForm'){const code=$('moveCode').value,q=rnd(nval($('moveQty').value)),p=$('movePerson').value.trim(),ref=$('moveOrder').value.trim(),obs=$('moveObs').value.trim();if(!material(code)||!Number.isFinite(q)||q<=0||!p)throw Error('Preencha todos os campos corretamente.');if(!confirm(`${kind}: ${fmt(q)} de ${material(code).nome}\nSolicitante: ${p}\nSalvar no Firebase?`))return;const saved=await execute(()=>doMoves([{codigo:code,quantidade:q,tipo:kind}],p,ref,obs),[code]);if(saved)e.target.reset();return}if(e.target.id==='countForm'){const code=$('countCode').value,qty=rnd(nval($('countQty').value)),p=$('countPerson').value.trim();if(!Number.isFinite(qty)||qty<0||!p)throw Error('Informe contagem e responsável.');if(!confirm(`Confirmar saldo físico de ${fmt(qty)} para ${material(code)?.nome}?`))return;const saved=await execute(()=>adjustMaterial(code,qty,p),[code],{[code]:{quantidade:qty,conferido:true}});if(saved)close();return}if(e.target.id==='editForm'){await saveItem(e);return}}catch(err){loader(false);notice(err.message||'Operação falhou.',true)}});
document.addEventListener('click',async e=>{const go=e.target.closest('[data-go]');if(go){tab=go.dataset.go;draw();window.scrollTo({top:0});return}const del=e.target.closest('[data-remove]');if(del){rememberOrder();cart.splice(+del.dataset.remove,1);draw();return}const details=e.target.closest('[data-details]');if(details){detail(details.dataset.details);return}const b=e.target.closest('[data-type]');if(b){kind=b.dataset.type;draw();return}await handleActions(e)});
document.addEventListener('input',e=>{if(e.target.id==='searchInput'){filter=e.target.value;const pos=e.target.selectionStart;draw();$('searchInput')?.focus();$('searchInput')?.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{if(e.target.id==='moveCode'){const m=material(e.target.value);if($('stockHint'))$('stockHint').textContent=m?`Saldo: ${fmt(m.quantidade)} ${m.unidade} | ${m.rua||'Sem rua'}-${m.posicao||'?'} | ${m.conferido?'Conferido':'PENDENTE DE CONFERÊNCIA'}`:'Selecione o material.'}if(e.target.id==='dateInput'){dateFilter=e.target.value;bindDay();draw()}});
$('arquivoCatalogo').addEventListener('change',async e=>{try{isReady();await importCatalog(e.target.files?.[0])}catch(err){notice(err.message,true)}finally{e.target.value=''}});
window.addEventListener('online',()=>{serverReady=false;status('● Revalidando Firebase');if(user){for(const f of unsubs)f();bindListeners()}});window.addEventListener('offline',()=>{serverReady=false;status('● Sem internet',false,true)});
load();
</script></body></html>
